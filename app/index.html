   LIDK, 100 % fix). På varje ställe stod lådan först på krönets kant och flöt
   sedan vid vattenlinjen några minuter senare. cm är krönet över vattenytan
   den kvällen, med antennens höjd i lådan avräknad (74 mm stående, 44 mm
   flytande), ±2 cm. Skillnaden på samma ställe är säkrare än höjderna var
   för sig: GPS:en visade högt både på kanten och i vattnet där kanten låg
   högt. Snorkelns kant låg 3–4 cm över ytan (Kristian, med ögonmått), och
   vid snorkeln var det 40 cm längs duken från kanten ner till ytan. */
const KANT={
  datum:'24 november',
  snorkel:3.5,                                      // snorkelns kant över ytan, cm
  pkt:[                                             // snorkeln först: den är förvald
    {id:'SN',kort:'Snorkeln',var:'vid snorkeln',cm:18.1,band:40,lat:58.5041365,lon:13.0884098},
    {id:'SV',kort:'SV',var:'i sydvästra hörnet',cm:22.6},
    {id:'NV',kort:'NV',var:'i nordvästra hörnet',cm:13.1},
    {id:'NO',kort:'NO',var:'i nordöstra hörnet',cm:18.6},
    {id:'SO',kort:'SO',var:'i sydöstra hörnet',cm:12.9},
  ],
};
const kantPkt=id=>KANT.pkt.find(p=>p.id===id)||KANT.pkt[0];
// Ritningens djup gäller krönet: de fyra hörnens medel räknas som 3,50 m.
const H_YTA=DAM.hMax-['SV','NV','NO','SO'].reduce((s,id)=>s+kantPkt(id).cm,0)/4/100; // ytan 24/11, 3,33 m
const H_SNORKEL=H_YTA+KANT.snorkel/100;              // snorkelns kant, 3,37 m = 100 %
const V100=volAt(H_SNORKEL);                         // ≈4110 m³
const kronH=id=>H_YTA+kantPkt(id).cm/100;            // krönet över botten, m
const overSnorkel=id=>kantPkt(id).cm-KANT.snorkel;   // krönet över snorkelns kant, cm
const H_LAG=Math.min(...KANT.pkt.map(p=>kronH(p.id)));  // lägsta inmätta krönet, 3,46 m (SO och NV)
const H_VARN=H_SNORKEL+0.05;                         // varning: 5 cm över snorkeln, 3,42 m
// Måttbandet mot höjden. I hörnen räknas från krönet med ritningens 1:1,5.
// Vid snorkeln utgår det från måttbandet 24 november: 40 cm ner till ytan,
// H_YTA. Ovanför 40 cm räknas 1:1,5. Det skiljer 4 cm i höjd mot GPS:en
// där, troligen för att duken är flackare överst, men det är måttbandet man
// mäter med, så det får gälla.
// Under 40 cm gäller också ritningens 1:1,5. Mot rättat FT01 stämde två
// sträckor inom 1 %: 40 → 120 cm (24–27 november, 679 mot 683 m³) och
// 120 → 178 cm (27–28 november, 464 mot 462–464 m³). Den lutning som passar
// exakt är 1:1,50. Appen räknade 1:1,3 här 28 november, ur flytpunkterna
// med lådan, som hade några cm fel nära kanten (Kristian, 28 november).
// SF_NED står kvar som eget tal, så att en uppmätt avvikelse kan läggas in.
const SF_NED=SF;                                     // cm längs duken per cm i höjd, under 40 cm vid snorkeln
const tapeAt=(h,id)=>{                               // cm längs duken från krönet ner till ytan
  const p=kantPkt(id);
  if(p.band==null)return (kronH(id)-h)*SF*100;
  return h>=H_YTA?p.band-(h-H_YTA)*SF*100:p.band+(H_YTA-h)*SF_NED*100;
};
const hFromTape=(cm,id)=>{
  const p=kantPkt(id);
  if(p.band==null)return kronH(id)-cm/(SF*100);
  return cm<=p.band?H_YTA+(p.band-cm)/(SF*100):H_YTA-(cm-p.band)/(SF_NED*100);
};
const tapeMax=id=>Math.floor(tapeAt(0,id));          // från krönet ända ner till botten

// nivåmarkörer (h i m, etikett, färg) — uppifrån och ned
const DAMLV=[
  [DAM.hMax,'Krönets medel','#fbbf24'],
  [H_LAG,'Lägsta inmätta krönet','#f59e0b'],
  [H_VARN,'Varning · 5 cm över snorkeln','#f87171'],
  [H_SNORKEL,'Snorkel · 100 %','#38bdf8'],
  [3.00,'Ritningens bräddrör','#8ba0bd'],
];

/* Måttbandet läses bara vid snorkeln, där duken är jämn (Kristian,
   25 november). Hörnen finns kvar i KANT för skissen och för gamla
   mätningar, men går inte att välja.
   V0/t0 är den senaste mätningen med måttband. Finns ingen sparad är V0 ett
   exempel, och vyn säger det. Läckage, lägsta driftnivå och reservtakten är
   inställningar i telefonen. */
let dam={ V0:3743, t0:Date.now(), kalId:null, drawn:0, fillRate:213, leak:2.0, floorH:0.5, horn:'SN' };

/* ---------- Vattenmätaren och kalibreringarna (25 november 2026) ----------
   Avläsningarna av vattenmätaren på påfyllningen och kalibreringarna med
   måttband sparas gemensamt i Firebase, under /damm. Förut låg pumpens start
   och stopp bara i minnet: de försvann när appen laddades om, och varje
   telefon hade sina egna. Avläsningarna fördes i Excel.
     /damm/avlas/{id}: {ts, m3, typ: start|stopp|avl, uid, namn}
     /damm/kalib/{id}: {ts, cm, punkt: SN|SV|NV|NO|SO, uid, namn}
   Medlemmar får lägga till, och rätta eller ta bort det de själva lagt in.
   Administratörer får ändra allt (firebase/database.rules.json). Det rör inte
   anläggningen: appen läser fortfarande bara från styrsystemet.
   Kalibreringen sparar måttet och stället, inte volymen. Ändras modellen,
   som när snorkeln mättes in, räknas gamla kalibreringar om av sig själva.
   Med ?demo ligger allt bara i minnet. */
let dammData={avlas:{},kalib:{}}, dammErr='';
const dammLista=o=>Object.entries(o||{}).map(([id,x])=>Object.assign({id},x))
  .filter(x=>Number.isFinite(x.ts)).sort((a,b)=>a.ts-b.ts);
const avlasList=()=>dammLista(dammData.avlas).filter(a=>Number.isFinite(a.m3));
const kalibList=()=>dammLista(dammData.kalib).filter(k=>Number.isFinite(k.cm)&&KANT.pkt.some(p=>p.id===k.punkt));
function applyDamm(v,nekad){
  dammData={avlas:(v&&v.avlas)||{},kalib:(v&&v.kalib)||{}};
  dammErr=nekad?'Får inte läsa dammens avläsningar. Reglerna i Firebase är kanske inte utlagda.':'';
  damSync(); liveRefresh();
}
// Den senaste kalibreringen är utgångsläget. I drift räknas uttaget sedan
// den ur kanonernas timvatten (damDrawnSince); i ?demo summeras det i minnet
// och nollställs av en ny kalibrering.
function damSync(){
  const k=kalibList(), s=k[k.length-1];
  // Utan kalibrering: tillbaka till exemplet, så att ingen sparad nivå ligger
  // kvar när någon loggar ut eller kalibreringen tas bort.
  if(!s){if(dam.kalId!==null){dam.kalId=null;dam.V0=3743;dam.t0=Date.now();dam.drawn=0;}return;}
  if(dam.kalId!==s.id){dam.kalId=s.id;dam.drawn=0;}
  dam.V0=volAt(clampH(hFromTape(s.cm,s.punkt))); dam.t0=s.ts;
}
const dammJag=()=>real&&window.dammMe?window.dammMe():{uid:'demo',namn:'Demo'};
const dammFarAndra=x=>!real||isAdmin||(x&&x.uid===(dammJag()||{}).uid);
function dammSkriv(l,id,data){
  if(real){ if(!window.dammWrite)return Promise.reject(new Error('Inte inloggad'));
    return window.dammWrite(l,id,data); }
  const o=dammData[l]; if(data===null)delete o[id]; else o[id||('demo'+Date.now())]=data;
  damSync(); return Promise.resolve();
}

/* Pumpen följer avläsningarna: efter Start går den, efter Stopp står den.
   En vanlig avläsning ändrar inget. Takten är den senaste som mätaren visat
   medan pumpen gick (minst en timme mellan avläsningarna), annars
   reservtakten (dam.fillRate, m³/dygn). */
function pumpInfo(L=avlasList()){
  let on=false, since=null, rate=null;
  L.forEach((a,i)=>{
    if(a.typ==='start'){if(!on)since=a.ts;on=true;}
    else if(a.typ==='stopp'){on=false;since=a.ts;}
    const b=L[i+1];
    if(on&&b&&b.ts-a.ts>=3600e3&&b.m3>a.m3)rate=(b.m3-a.m3)/((b.ts-a.ts)/3600e3);
  });
  return {on, since, last:L[L.length-1]||null, rate:rate??dam.fillRate/24, uppmatt:rate!==null};
}
/* Mätarställningen vid en viss tid. Mellan två avläsningar rak linje: stod
   pumpen still är ställningarna lika, och då blir linjen platt av sig själv.
   Efter den sista avläsningen räknas med takten om pumpen går. */
function meterAt(t,L=avlasList()){
  if(!L.length)return null;
  if(t<=L[0].ts)return L[0].m3;
  for(let i=0;i<L.length-1;i++){const a=L[i],b=L[i+1];
    if(t<b.ts)return a.m3+(b.m3-a.m3)*(t-a.ts)/((b.ts-a.ts)||1);}
  const p=pumpInfo(L), s=p.last;
  return p.on?s.m3+p.rate*(t-s.ts)/3600e3:s.m3;
}
const damFillSince=(t0,now=Date.now())=>{const a=meterAt(t0),b=meterAt(now);return a==null||b==null?0:Math.max(0,b-a);};

/* ---------- Uttaget: kanonernas vatten, timme för timme (26 november 2026) ----------
   FT01 visar ungefär 45 % av kanonernas summa och går troligen inte att lita
   på, så uttaget dödräknas ur kanonerna i stället (Kristians beslut). Bryggan
   (version 11) räknar varje timmes vatten ur styrsystemets statistik och
   lägger det i /vattenTimme: {"2026112603": 35.21, …}, nyckeln är timmens
   början i UTC. Kanonerna mäter inte flödet — det är deras eget beräknade
   "real water flow" (teoretiskt flöde × roten ur tryck/börtryck). Stämmer
   det inte, syns det som att måttbandet och modellen glider isär.
   Timmarna kommer med ungefär en halvtimmes fördröjning; den pågående
   timmen växer var tionde minut. Hela grenen är några hundra tal på en
   säsong, så appen lyssnar på allt. */
let vattenTimme={}, vattenTimmeOk=false;
function applyVattenTimme(v,nekad){vattenTimme=(v&&typeof v==='object')?v:{};vattenTimmeOk=!nekad&&!!v;liveRefresh();}
const timKey=k=>Date.UTC(+k.slice(0,4),+k.slice(4,6)-1,+k.slice(6,8),+k.slice(8,10));
/* Dammens uttag räknas på kanonernas timvatten, kalibrerat mot FT01.
   Rättat FT01 (se FT01_FAKTOR) är det enda som mäter vattnet ut; kanonerna
   räknade 119–123 % av det 24–28 november, stadigt i alla flödesband.
   Uttaget räknas därför som 83 % av kanonernas vatten (Kristian, 28
   november). Förut 0,9, ur måttbandet och flytpunkten. Uttaget just nu tas
   direkt ur rättat FT01 när pumparna går. Påfyllningen till snorkeln, mot
   kommunens mätare, avgör slutligt. */
const UTTAG_FAKTOR=0.83;
const UTTAG_PCT=Math.round(UTTAG_FAKTOR*100);
/* Vattnet ur dammen mellan t0 och nu. Timmen som t0 ligger i räknas till
   den del som är efter t0, som om kanonerna gått jämnt hela timmen. */
function damDrawnSince(t0){
  let s=0;
  for(const [k,v] of Object.entries(vattenTimme)){
    if(!/^\d{10}$/.test(k)||!Number.isFinite(v))continue;
    const a=timKey(k), b=a+3600e3;
    if(b<=t0)continue;
    s+=a>=t0?v:v*(b-t0)/3600e3;
  }
  return s*UTTAG_FAKTOR;
}
// Utan timvattnet (bryggan före version 11) räknas inget uttag alls, och
// dammen står kvar på senaste mätningen. Det får inte se aktuellt ut.
const damUtanUttag=()=>real&&!vattenTimmeOk;
// Sista timmen med vatten, för att kunna säga hur färskt uttaget är.
const vattenTimmeSenast=()=>{const k=Object.keys(vattenTimme).filter(x=>/^\d{10}$/.test(x)).sort().pop();return k?timKey(k)+3600e3:null;};

/* Volymen JUST NU = volymen vid senaste kalibreringen (V0 vid t0)
     + det vattenmätaren visar sedan dess (räknat framåt om pumpen går)
     − det kanonerna tagit sedan dess (damDrawn: timvattnet i drift, dam.drawn i ?demo)
     − läckaget.
   Bara det som fylldes EFTER kalibreringen räknas — det som fylldes före den
   finns redan med i den uppmätta nivån. */
const damDrawn=()=>real?damDrawnSince(dam.t0):dam.drawn;
function damVolNow(now=Date.now()){
  const v=dam.V0 + damFillSince(dam.t0,now) - damDrawn() - (now-dam.t0)/3600e3/24*dam.leak;
  return Math.max(0,Math.min(volAt(DAM.hMax),v));
}
let damTape=Math.round(tapeAt(hFromVol(dam.V0),dam.horn));  // måttbandsreglagets läge

/* flöden */
// Uttaget just nu (m³/h): rättat FT01 när pumparna går, annars kanonernas
// beräknade flöde × UTTAG_FAKTOR; i ?demo exemplets eau.
const damUttakM3h=()=>{
  if(!real)return totalWater();
  // Går pumparna och bryggan hörs: FT01, rättat, är det som faktiskt går ut.
  const p2=pumps&&pumps.dep12;
  if(p2&&!bridgeOld()&&pumpGar(p2))return +ft01(p2.k125).toFixed(1);
  return +(sum(running().filter(c=>Number.isFinite(c.q)),c=>c.q)*UTTAG_FAKTOR).toFixed(1);
};
const damInflowM3d=()=>{const p=pumpInfo();return p.on?p.rate*24:0;};  // påfyllningen, m³/dygn (regn tillkommer)
const damNetM3h=()=>damInflowM3d()/24 - damUttakM3h() - dam.leak/24;
const floorVol=()=>volAt(dam.floorH);               // lägsta driftnivå (pumpintag)
const usableVol=v=>Math.max(0,v-floorVol());
function damPct(){return Math.round(damVolNow()/V100*100);}
// läckaget räknas med här också, annars säger "drifttid" och "sjunker till
// lägsta nivå" olika saker på samma sida
function damDaysAt(m3h){const net=m3h*24 - damInflowM3d() + dam.leak; return net<=0?99:usableVol(damVolNow())/net;}

/* Klockslagen går att sätta i efterhand. Man glömmer ofta att läsa in
   avläsningen direkt och kommer på det först efter en stund. */
const toLocalDT=ts=>{ if(!ts)return ''; const d=new Date(ts), p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
const fmtDT=ts=>{ if(!ts)return '–'; const d=new Date(ts), p=n=>String(n).padStart(2,'0');
  const wd=['sön','mån','tis','ons','tor','fre','lör'][d.getDay()];
  return `${wd} ${p(d.getDate())}/${d.getMonth()+1}${d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():''} ${p(d.getHours())}:${p(d.getMinutes())}`; };

function fmtDur(h){ if(!isFinite(h)||h>24*30)return '30+ dygn'; if(h>=24)return (h/24).toFixed(1)+' dygn'; if(h>=1)return h.toFixed(1)+' h'; return Math.max(1,Math.round(h*60))+' min'; }
function etaStr(h){ if(!isFinite(h)||h>24*30||h<=0)return ''; const d=new Date(Date.now()+h*3600e3);
  const wd=['sön','mån','tis','ons','tor','fre','lör'][d.getDay()];
  return wd+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

function damSVG(h){
  const cx=150, topY=16, botY=176, Hpx=botY-topY;
  const yAt=hh=>botY-(hh/DAM.hMax)*Hpx, half=hh=>60+70*(hh/DAM.hMax);
  const lx=hh=>cx-half(hh), rx=hh=>cx+half(hh);
  const wy=yAt(h), wl=lx(h), wr=rx(h);
  // nivåerna 3,0–3,5 ligger alla i översta halvmetern, så markörlinjerna hamnar
  // tätt. Etiketterna sprids ut i egna rader med tunna ledarlinjer.
  const labelX=rx(DAM.hMax)+9;
  // Textstorlek 11 i en bild som är 440 bred: på en telefon krymper bilden till
  // ca 300 px, och med de tidigare 8 blev nivånamnen 5 px höga — oläsliga,
  // fast de är själva poängen med bilden.
  const mk=DAMLV.map(([mh,lab,col],i)=>{const y=yAt(mh), ly=topY+11+i*16;
    return `<line x1="${lx(mh).toFixed(1)}" y1="${y.toFixed(1)}" x2="${rx(mh).toFixed(1)}" y2="${y.toFixed(1)}" stroke="${col}" stroke-width="1" stroke-dasharray="3 3" opacity=".85"/>`+
      `<line x1="${rx(mh).toFixed(1)}" y1="${y.toFixed(1)}" x2="${(labelX-3).toFixed(1)}" y2="${ly.toFixed(1)}" stroke="${col}" stroke-width=".6" opacity=".45"/>`+
      `<text x="${labelX.toFixed(1)}" y="${(ly+4).toFixed(1)}" fill="${col}" font-size="11">${lab}</text>`;}).join('');
  return `<svg viewBox="0 0 440 196" class="dam-svg" preserveAspectRatio="xMinYMid meet">
    <defs><linearGradient id="dw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".8"/><stop offset="1" stop-color="#0e5a7a" stop-opacity=".95"/></linearGradient></defs>
    <polygon points="${lx(0).toFixed(1)},${botY} ${rx(0).toFixed(1)},${botY} ${wr.toFixed(1)},${wy.toFixed(1)} ${wl.toFixed(1)},${wy.toFixed(1)}" fill="url(#dw)"/>
    <line x1="${wl.toFixed(1)}" y1="${wy.toFixed(1)}" x2="${wr.toFixed(1)}" y2="${wy.toFixed(1)}" stroke="#7dd3fc" stroke-width="1.6"/>
    ${mk}
    <path d="M${lx(DAM.hMax).toFixed(1)},${topY} L${lx(0).toFixed(1)},${botY} L${rx(0).toFixed(1)},${botY} L${rx(DAM.hMax).toFixed(1)},${topY}" fill="none" stroke="#5b6b82" stroke-width="2"/>
    <circle cx="${wr.toFixed(1)}" cy="${wy.toFixed(1)}" r="3" fill="#7dd3fc"/>
    <text x="${cx}" y="${botY+14}" fill="#8296b5" font-size="10" text-anchor="middle">Tvärsnitt — ej skalenligt på bredden</text>
  </svg>`;
}

const pm=(v,d=1)=>(v>0?'+':'')+num(v,d);            // +4,5 / −5,6
// Volymen om krönet vore det inmätta i stället för ritningens, med samma slänt
// och djup. Bara för jämförelsen i vyn — räkningen använder ritningen.
function volKron(h){const w=KRON.bredd-2*DAM.slope*DAM.hMax, l=KRON.langd-2*DAM.slope*DAM.hMax;
  return w*l*h+(w+l)*DAM.slope*h*h+4/3*DAM.slope*DAM.slope*h*h*h;}

/* Krönet uppifrån, norr uppåt, ritat ur de inmätta hörnen i skala. Varje hörn
   visar hur högt krönet ligger över snorkelns kant; de lägsta är gula. */
function kronSVG(){
  const H=KRON.horn, n=H.length;
  const la0=H.reduce((s,k)=>s+k.lat,0)/n, lo0=H.reduce((s,k)=>s+k.lon,0)/n;
  const mLat=111320, mLon=111320*Math.cos(la0*Math.PI/180);   // m per grad, gott nog för en skiss
  const s=5.2, cx=170, cy=170;                                // px per meter, mitten
  const xy=k=>[cx+(k.lon-lo0)*mLon*s, cy-(k.lat-la0)*mLat*s];
  const P=H.map(xy);
  // NV och SO skiljer bara 0,2 cm — båda är lägst inom mätfelet
  const minCm=Math.min(...H.map(k=>overSnorkel(k.id)));
  const f=v=>v.toFixed(1);
  const sidor=H.map((k,i)=>{const [x1,y1]=P[i],[x2,y2]=P[(i+1)%n];
    let mx=(x1+x2)/2, my=(y1+y2)/2; const dx=cx-mx, dy=cy-my, d=Math.hypot(dx,dy)||1;
    mx+=dx/d*30; my+=dy/d*30;                                  // in mot mitten
    return `<text x="${f(mx)}" y="${f(my+4)}" fill="#e9f0fa" font-size="12" font-weight="600" text-anchor="middle">${num(KRON.sidor[i],2)} m</text>`;}).join('');
  const horn=H.map((k,i)=>{const [x,y]=P[i], upp=y<cy, vanster=x<cx, c=overSnorkel(k.id), lg=c-minCm<1;
    const tx=vanster?x-7:x+7, anc=vanster?'end':'start', y1=upp?y-18:y+15;
    return `<circle cx="${f(x)}" cy="${f(y)}" r="4.5" fill="${lg?'#f59e0b':'#e9f0fa'}"/>`+
      `<text x="${f(tx)}" y="${f(y1)}" fill="${lg?'#f59e0b':'#e9f0fa'}" font-size="12" font-weight="700" text-anchor="${anc}">${k.id}</text>`+
      `<text x="${f(tx)}" y="${f(y1+13)}" fill="${lg?'#f59e0b':'#9fb0c7'}" font-size="11" text-anchor="${anc}">${Math.round(c)} cm</text>`;}).join('');
  // snorkeln står under södra sidan, utanför — innanför krockar den med sidans längd
  const sn=kantPkt('SN'), [sx,sy]=xy(sn);
  const snorkel=`<circle cx="${f(sx)}" cy="${f(sy)}" r="4.5" fill="#38bdf8"/>`+
    `<text x="${f(sx+2)}" y="${f(sy+19)}" fill="#38bdf8" font-size="12" font-weight="700">Snorkeln</text>`+
    `<text x="${f(sx+2)}" y="${f(sy+32)}" fill="#7dd3fc" font-size="11">${Math.round(overSnorkel('SN'))} cm</text>`;
  return `<svg viewBox="0 0 340 330" class="dam-svg" style="max-width:420px;margin:4px auto 0" role="img" aria-label="Dammens krön uppifrån med sidornas längd och hur högt krönet ligger över snorkeln i hörnen och vid snorkeln">
    <polygon points="${P.map(p=>p.map(f).join(',')).join(' ')}" fill="#0e5a7a" fill-opacity=".55" stroke="#22d3ee" stroke-width="2"/>
    ${sidor}${horn}${snorkel}
    <line x1="18" y1="40" x2="18" y2="16" stroke="#8296b5" stroke-width="1.5"/><path d="M13,22 L18,13 L23,22 Z" fill="#8296b5"/>
    <text x="18" y="54" fill="#8296b5" font-size="11" text-anchor="middle">N</text>
  </svg>
  <p class="muted small" style="margin:6px 0 0;text-align:center">Siffrorna vid hörnen: krönet över snorkelns kant, inmätt ${KANT.datum}.</p>`;
}

// Inmätningen bredvid ritningen, och vad höjdskillnaderna betyder i m³
function kronFakta(){
  const hrn=KRON.horn.map(k=>k.id).sort((a,b)=>overSnorkel(a)-overSnorkel(b));
  const lista=hrn.map(id=>`${id} ${Math.round(overSnorkel(id))}`).join(', ');
  const rad=(t,r,m)=>`<tr><td>${t}</td><td>${r}</td><td><b>${m}</b></td></tr>`;
  const cmUnder=Math.round((DAM.hMax-H_SNORKEL)*100);
  return `<table class="kron-tab">
      <tr><th></th><th>Ritningen</th><th>Inmätt</th></tr>
      ${rad('Krönets bredd','36,5 m',num(KRON.bredd,2)+' m')}
      ${rad('Krönets längd','44,5 m',num(KRON.langd,2)+' m')}
      ${rad('Yta innanför krönet',Math.round(36.5*44.5).toLocaleString('sv-SE')+' m²',KRON.yta.toLocaleString('sv-SE')+' m²')}
      ${rad('Bräddning under krönet','50 cm, bräddrör',cmUnder+' cm, snorkeln')}
      ${rad('Volym till bräddningen',Math.round(volAt(3.00)).toLocaleString('sv-SE')+' m³',Math.round(V100).toLocaleString('sv-SE')+' m³')}
      ${rad('Slänt vid snorkeln','1:1,5','1:1,5 (40–178 cm, mot FT01)')}
      ${rad('Djup','3,5 m','inte mätt')}
    </table>
    <p class="muted small" style="line-height:1.6;margin:12px 0 0"><b style="color:var(--text)">Snorkeln sitter högre än appen trodde.</b> Förut räknade den med ritningens bräddrör plus 20 cm: 3,20 m och ${Math.round(volAt(3.20)).toLocaleString('sv-SE')} m³. Mätt mot vattenytan ${KANT.datum} sitter snorkelns kant ${cmUnder} cm under krönets medel, på ${num(H_SNORKEL,2)} m. Då rymmer dammen ${Math.round(V100-volAt(3.20))} m³ mer, och det stämmer med vattenmätaren på påfyllningen. Det som såg ut som läckage var alltså troligen en större damm.</p>
    <p class="muted small" style="line-height:1.6;margin:10px 0 0"><b style="color:var(--text)">Måtten i plan stämmer med ritningen.</b> Räknat med de inmätta måtten blir det bara ${Math.round(volKron(H_SNORKEL)-V100)} m³ mer till snorkeln, så volymen räknas fortfarande ur ritningen.</p>
    <p class="muted small" style="line-height:1.6;margin:10px 0 0"><b style="color:var(--text)">Höjden skiljer mer.</b> 10 cm i höjd är ca ${Math.round(areaAt(H_SNORKEL)*0.1)} m³ vid snorkeln. Krönet ligger så här många cm över snorkelns kant: ${lista}. Tar snorkeln inte undan, till exempel om den fryser, bräddar dammen först i SO och NV. Därför varnar appen redan 5 cm över snorkeln. Det kan finnas lägre ställen mellan hörnen, som inte är mätta. De fyra hörnens medel räknas som ritningens 3,50 m.</p>
    <p class="muted small" style="line-height:1.6;margin:10px 0 0">Planen: band-ATV med pucken längs krönet ${KRON.datum}. Höjderna: GPS:en i en låda ${KANT.datum}, först stående på krönets kant och sedan flytande vid vattenlinjen på samma ställe. Båda är efterberäknade mot Swepos, med 100 % fix. Höjderna stämmer på ±2 cm. Botten är inte mätt, så volymen bygger på ritningens djup.</p>
    <p class="muted small" style="line-height:1.6;margin:10px 0 0"><b style="color:var(--text)">Slänten stämmer med ritningen, 1:1,5.</b> Mot flödesmätaren FT01, rättad, stämde måttbandet inom 1 % på två sträckor: 40 → 120 cm (24–27 november) och 120 → 178 cm (27–28 november). Flytpunkterna med lådan pekade först på 1:1,3, men de hade några cm fel nära kanten.</p>`;
}

function vDam(){
  const V=damVolNow(), h=hFromVol(V), pct=damPct();
  const net=damNetM3h(), uttak=damUttakM3h();
  let proj, projEta='';
  if(net>0.01){
    // redan över en nivå? Då finns ingen tid dit — säg det i stället för "1 min"
    const t=(V100-V)/net, tv=(volAt(H_VARN)-V)/net;
    if(tv<=0)proj='Fyller — redan över varningsnivån (5 cm över snorkeln)';
    else if(t<=0)proj=`Fyller — över snorkeln, ≈ ${fmtDur(tv)} till varningsnivå`;
    else proj=`Fyller ≈ ${fmtDur(t)} till snorkeln, ≈ ${fmtDur(tv)} till varningsnivå`;
    projEta=etaStr(Math.max(t,tv));}
  else if(net<-0.01){const t=usableVol(V)/(-net); proj=`Sjunker ≈ ${fmtDur(t)} till lägsta driftnivå`; projEta=etaStr(t);}
  else proj='I det närmaste i balans';
  return topbar('Vattenbalans','Damm-koll — magasinet vid Råda ås')+`<div class="view">
   <div class="banner ok">${icon('dam','#34d399',20)}<div style="flex:1"><b>Digital tvilling av dammen.</b> <span class="muted small">Volymen räknas ur byggritningen. Krönet och snorkeln är inmätta mot vattenytan ${KANT.datum}. ${real?(vattenTimmeOk?'<b style="color:var(--text)">Uttaget är '+UTTAG_PCT+' % av kanonernas beräknade vatten</b>, timme för timme ur styrsystemets statistik. Faktorn kommer från FT01, rättad för omvandlarens fel: kanonerna räknar cirka 20 % för mycket. Uttaget just nu är FT01 när pumparna går. Mät gärna med måttbandet före och efter en körning: loggen visar då om det stämmer.':'<b style="color:var(--text)">Uttaget har inte kommit från bryggan än</b> (version 11), så beräkningen tar bara hänsyn till påfyllning och läckage — mät med måttbandet efter varje körning.'):'Uttaget kommer från driftdatan;'} Vattenmätaren och måttbandet matar du in — appen räknar, den styr aldrig pumparna.</span></div></div>
   ${dammErr?`<div class="banner">${icon('bell','#f87171')}<div style="flex:1"><b>${dammErr}</b></div></div>`:''}
   ${real&&!kalibList().length?`<div class="banner">${icon('bell','#f87171')}<div style="flex:1"><b>Ingen mätning med måttband är sparad än.</b> <span class="muted small">Volymen nedan är ett exempel tills någon mätt vid snorkeln och sparat mätningen.</span></div></div>`:''}

   <div class="grid g-kpi">
     <div class="card kpi${damUtanUttag()?' old':''}"><h3>${icon('drop','#7dd3fc',15)} Aktuell volym</h3><div class="val">${Math.round(V).toLocaleString('sv-SE')}<small> m³</small></div><div class="bar ${pct>101?'amber':pct<30?'red':'green'}"><i style="width:${Math.min(100,pct)}%"></i></div><div class="foot">${pct}% av snorkelnivån (${Math.round(V100).toLocaleString('sv-SE')} m³)</div></div>
     <div class="card kpi"><h3>${icon('sliders','#7dd3fc',15)} Nivå & måttband</h3><div class="val">${h.toFixed(2)}<small> m djup</small></div><div class="foot">måttbandet vid snorkeln: ${Math.max(0,Math.round(tapeAt(h,'SN')))} cm (fullt ≈ ${Math.round(tapeAt(H_SNORKEL,'SN'))} cm)</div></div>
     <div class="card kpi"><h3>${icon('gauge','#7dd3fc',15)} Nettoflöde nu</h3><div class="val ${net<0?'down':'up'}">${net>=0?'+':''}${net.toFixed(1)}<small> m³/h</small></div><div class="foot">${proj}${projEta?' · '+projEta:''}</div></div>
     <div class="card kpi"><h3>${icon('clock','#7dd3fc',15)} Drifttid vid nuvarande uttag</h3><div class="val">≈ ${fmtDur(damDaysAt(uttak)*24)}</div><div class="foot">uttag ${uttak.toFixed(0)} m³/h${pumpInfo().on?' · påfyllningen går':' · påfyllningen står'}</div></div>
   </div>

   <div class="dam-grid">
     <div class="card">
       <h3>${icon('dam','#7dd3fc',15)} Tvärsnitt — vattennivå och bräddnivåer</h3>
       ${damSVG(h)}
     </div>
     <div class="card dam-ctrl" id="mbkort">
       ${mbCard(h)}
     </div>
   </div>

   <div class="dam-grid">
     <div class="card dam-ctrl" id="mtkort">
       <h3>${icon('drop','#7dd3fc',15)} Vattenmätaren — påfyllningen</h3>
       ${mtCard()}
     </div>
     <div class="card dam-ctrl" id="loggkort">
       ${loggCard()}
     </div>
   </div>

   <div class="dam-grid">
     <div class="card">
       <h3>${icon('map','#7dd3fc',15)} Krönet uppifrån — inmätt ${KRON.datum}</h3>
       ${kronSVG()}
     </div>
     <div class="card">
       <h3>${icon('sliders','#7dd3fc',15)} Inmätningen mot ritningen</h3>
       ${kronFakta()}
     </div>
   </div>

   <div class="note" style="margin-top:14px">⚠️ <b>Så snabbt töms den:</b> användbar volym ≈ ${Math.round(V100-floorVol()).toLocaleString('sv-SE')} m³. Vid fullt uttag — pumptaket <b>70 m³/h</b> (1 680 m³/dygn), som också är dammens högsta utflöde — räcker det ungefär <b>${((V100-floorVol())/(PUMP_MAX*24)).toFixed(1)} dygn</b>. Påfyllningspumpen ger bara 213 m³/dygn (≈9 m³/h), en bråkdel av uttaget, så den är en påfyllnad mellan passen snarare än i takt med kanonerna. Pumptaket är verkligt; lägsta driftnivå (${dam.floorH} m) och läckage är ännu exempel. Volymmodellen är exakt och förankrad i ritningen, och krönet och snorkeln är inmätta mot vattenytan.</div>
  </div>`;
}
const clampH=h=>Math.max(0,Math.min(DAM.hMax,h));
const tapeFor=h=>Math.max(0,Math.round(tapeAt(h,'SN')));
function damNum(k,v){const n=parseFloat(String(v).replace(',','.')); if(!isNaN(n)&&n>=0)dam[k]=n; render();}

/* Formulären hålls i variabler, inte bara i fälten. Vyn ritas om när ny
   data kommer, och då skulle det man skrivit annars försvinna. */
let calForm={cm:'',ts:'',edit:null,msg:'',err:false};
let mtForm={m3:'',ts:'',typ:'avl',edit:null,msg:'',err:false,sparar:false};
let loggFlik='avl', loggAlla=false;
// "73 478,4" och "73478.4" ska båda gå: telefonens tangentbord ger komma.
const talIn=s=>{const t=String(s??'').replace(/[\s  ]/g,'').replace(',','.');return /^\d+(\.\d+)?$/.test(t)?parseFloat(t):NaN;};
const tidIn=s=>s?new Date(s).getTime():Date.now();
const fmtM3=v=>Number.isFinite(v)?v.toLocaleString('sv-SE',{maximumFractionDigits:3}):'–';
const fmtHel=v=>Number.isFinite(v)?Math.round(v).toLocaleString('sv-SE'):'–';
const fmtCm=v=>num(v,v%1?1:0);
const felText=e=>e&&e.code==='PERMISSION_DENIED'?'databasen sa nej (saknas behörighet, eller är reglerna inte utlagda?)':esc(e&&(e.code||e.message)||e);
const tillKort=id=>{const e=document.getElementById(id); if(e)e.scrollIntoView({behavior:'smooth',block:'start'});};

/* ---------- måttbandet vid snorkeln ----------
   Förut fanns två rutor: en snabbkoll att dra i och en kalibrering där man
   valde hörn. Det var förvirrande (Kristian, 25 november), och måttbandet
   läses bara vid snorkeln, där duken är jämn. Nu är det en ruta: dra eller
   skriv måttet och se vad det motsvarar. Det sparas först när man trycker
   Spara, och då blir mätningen dammens nya utgångsläge för hela gruppen. */
function mbCard(h){
  const tmax=tapeMax('SN'), red=calForm.edit, ed=red&&dammData.kalib[red];
  // Utan eget mått står reglaget där beräkningen säger att ytan är nu.
  const cm=talIn(calForm.cm), visa=Number.isFinite(cm)?cm:Math.max(0,Math.round(tapeAt(h,'SN')));
  const hh=clampH(hFromTape(visa,'SN')), v=volAt(hh);
  const K=kalibList(), s=K[K.length-1];
  return `<h3>${icon('sliders','#7dd3fc',15)} Måttbandet vid snorkeln</h3>
    <p class="muted small" style="margin:8px 0 2px">Mät från krönets kant rakt ner längs duken till vattenytan, vid snorkeln. Full damm är ungefär ${Math.round(tapeAt(H_SNORKEL,'SN'))} cm. Dra i reglaget eller skriv måttet, så syns vad det motsvarar.</p>
    ${red?`<p class="mt-msg">Ändrar mätningen ${fmtDT(ed&&ed.ts)}${ed&&ed.namn?' ('+esc(ed.namn)+')':''}.</p>`:''}
    <input type="range" id="mb_range" min="0" max="${tmax}" value="${Math.round(visa)}" oninput="mbDra(this.value)">
    <div class="readout">
      <div><b id="ro_cm">${fmtCm(Math.round(visa*10)/10)} cm</b><span>längs duken</span></div>
      <div><b id="ro_v">${fmtHel(v)} m³</b><span>volym</span></div>
      <div><b id="ro_p">${Math.round(v/V100*100)} %</b><span>av 100 %</span></div>
      <div><b id="ro_h">${hh.toFixed(2)} m</b><span>djup</span></div>
    </div>
    <label>Mått längs duken (cm)</label>
    <input type="text" inputmode="decimal" id="mb_cm" value="${esc(calForm.cm)}" placeholder="enligt beräkningen ≈ ${tapeFor(h)}" oninput="mbSkriv(this.value)">
    <label>Mättes</label>
    <input type="datetime-local" id="mb_ts" value="${calForm.ts||toLocalDT(Date.now())}" onchange="calForm.ts=this.value">
    <div class="row" style="margin-top:12px">${red
      ?`<button class="linkbtn fram" onclick="damCalib()">Spara ändring</button><button class="linkbtn" onclick="kalibTaBort()">Ta bort</button><button class="linkbtn" onclick="mbAvbryt()">Avbryt</button>`
      :`<button class="linkbtn fram" onclick="damCalib()">Spara mätningen</button>`}</div>
    ${calForm.msg?`<p class="mt-msg ${calForm.err?'fel':''}">${calForm.msg}</p>`:''}
    <p class="muted small" style="margin-top:12px"><b style="color:var(--text)">Vad händer när jag sparar?</b> Mätningen blir dammens nya utgångsläge för alla i gruppen. Sedan räknar appen vidare själv — plus det vattenmätaren fyller på, minus läckaget — tills nästa mätning. Att bara dra i reglaget sparar ingenting.</p>
    <p class="muted small" style="margin-top:8px">${s
      ?`Senaste mätningen: <b style="color:var(--text)">${fmtDT(s.ts)}, ${fmtCm(s.cm)} cm</b>${s.namn?' ('+esc(s.namn)+')':''}, alltså ${fmtHel(dam.V0)} m³. Sedan dess: påfyllt ${fmtHel(damFillSince(s.ts))} m³, läckage ${fmtHel((Date.now()-s.ts)/864e5*dam.leak)} m³, ${damUtanUttag()?'uttaget saknas (bryggan på styrdatorn behöver version 11)':'uttag '+fmtHel(damDrawn())+' m³'+(real?' ('+UTTAG_PCT+' % av kanonernas räknade vatten'+(vattenTimmeSenast()?', till '+fmtDT(vattenTimmeSenast()):'')+')':'')}. Alla mätningar finns i loggen.`
      :`Ingen mätning sparad än.${real?'':' (I ?demo sparas den bara i minnet.)'}`}</p>`;
}
// Reglaget och fältet följer varandra utan att hela vyn ritas om — annars
// tappar reglaget greppet mitt i draget.
function mbVisa(cm){
  const hh=clampH(hFromTape(cm,'SN')), v=volAt(hh), set=(id,t)=>{const e=document.getElementById(id);if(e)e.textContent=t;};
  set('ro_cm',fmtCm(Math.round(cm*10)/10)+' cm'); set('ro_v',fmtHel(v)+' m³');
  set('ro_p',Math.round(v/V100*100)+' %'); set('ro_h',hh.toFixed(2)+' m');
}
function mbDra(v){const cm=+v; damTape=cm; calForm.cm=String(cm); const f=document.getElementById('mb_cm'); if(f)f.value=calForm.cm; mbVisa(cm);}
function mbSkriv(v){calForm.cm=v; const cm=talIn(v); if(!Number.isFinite(cm))return;
  damTape=cm; const r=document.getElementById('mb_range'); if(r)r.value=Math.round(cm); mbVisa(cm);}
function mbAvbryt(){calForm={cm:'',ts:'',edit:null,msg:'',err:false};render();}
function mbRedigera(id){const k=dammData.kalib[id]; if(!k)return;
  calForm={cm:fmtCm(k.cm),ts:toLocalDT(k.ts),edit:id,msg:'',err:false}; damTape=k.cm; render(); tillKort('mbkort');}

async function damCalib(){
  const cm=talIn(calForm.cm), ts=tidIn(calForm.ts), me=dammJag(), red=calForm.edit;
  const fel=t=>{calForm.msg=t;calForm.err=true;render();};
  if(!Number.isFinite(cm)||cm>tapeMax('SN'))return fel(`Skriv måttet i cm längs duken, 0–${tapeMax('SN')}.`);
  if(!Number.isFinite(ts))return fel('Tiden går inte att läsa.');
  if(ts>Date.now()+10*60e3)return fel('Tiden ligger i framtiden.');
  if(!me)return fel('Inte inloggad.');
  // Den som mätte står kvar när någon annan rättar.
  const gammal=red?dammData.kalib[red]:null;
  try{
    await dammSkriv('kalib',red,{ts:Math.round(ts),cm:Math.round(cm*10)/10,punkt:'SN',uid:gammal?gammal.uid:me.uid,namn:gammal?gammal.namn:me.namn});
    damTape=cm; calForm={cm:'',ts:'',edit:null,msg:`Sparat: ${fmtCm(cm)} cm vid snorkeln, ${fmtDT(ts)}.`,err:false}; render();
  }catch(e){fel('Kunde inte spara: '+felText(e));}
}
async function kalibTaBort(){
  const id=calForm.edit, k=id&&dammData.kalib[id]; if(!k)return;
  if(!confirm(`Ta bort mätningen ${fmtDT(k.ts)}, ${fmtCm(k.cm)} cm?`))return;
  try{await dammSkriv('kalib',id,null);calForm={cm:'',ts:'',edit:null,msg:'Borttagen.',err:false};render();}
  catch(e){calForm.msg='Kunde inte ta bort: '+felText(e);calForm.err=true;render();}
}

/* ---------- vattenmätaren ----------
   Rutan är bara till för att läsa in. Allt som sparats syns i loggen bredvid,
   där det också går att rätta och ladda ner. */
const sasong=ts=>{const d=new Date(ts);return d.getMonth()>=6?d.getFullYear():d.getFullYear()-1;};  // säsongen börjar 1 juli

    :`<b style="color:var(--text)">Påfyllningen står</b>${p.since?' sedan '+fmtDT(p.since):''}.`;

    ?`<div class="seg" style="margin-top:12px">${['start','stopp','avl'].map(t=>`<button class="${mtForm.typ===t?'on':''}" onclick="mtForm.typ='${t}';render()">${TYPTXT[t]}</button>`).join('')}</div>
      <div class="row" style="margin-top:12px"><button class="linkbtn fram" onclick="mtSpara(mtForm.typ)">Spara ändring</button><button class="linkbtn" onclick="mtTaBort()">Ta bort</button><button class="linkbtn" onclick="mtAvbryt()">Avbryt</button></div>`
    :`<div class="row" style="margin-top:12px">${['start','stopp','avl'].map(t=>`<button class="linkbtn${(t==='start'&&!p.on)||(t==='stopp'&&p.on)?' fram':''}" ${mtForm.sparar?'disabled':''} onclick="mtSpara('${t}')">${t==='avl'?'Avläsning':TYPTXT[t]}</button>`).join('')}</div>`;
  return `<p class="muted small" style="margin:8px 0 0">${status}</p>
    ${red?`<p class="mt-msg">Ändrar avläsningen ${fmtDT(ed&&ed.ts)}${ed&&ed.namn?' ('+esc(ed.namn)+')':''}.</p>`:''}
    <label>Mätarställning (m³)</label>
    <input type="text" inputmode="decimal" id="mt_m3" value="${esc(mtForm.m3)}" placeholder="${est!=null&&!red?'väntat ≈ '+fmtHel(est):'t.ex. 73 478,4'}" oninput="mtForm.m3=this.value">
    <label>Avläst</label>
    <input type="datetime-local" id="mt_ts" value="${mtForm.ts||toLocalDT(now)}" onchange="mtForm.ts=this.value">
    ${knappar}
    ${mtForm.msg?`<p class="mt-msg ${mtForm.err?'fel':''}">${mtForm.msg}</p>`:''}
    ${sist&&!red?`<p class="muted small" style="margin-top:10px">Senast: ${fmtDT(sist.ts)}, ${TYPTXT[sist.typ].toLowerCase()} ${fmtM3(sist.m3)} m³${sist.namn?' ('+esc(sist.namn)+')':''}. Alla avläsningar finns i loggen.</p>`:''}
    <label>Reservtakt när avläsningar saknas (m³/dygn)</label>
    <input type="number" id="dam_rate" value="${dam.fillRate}" onchange="damNum('fillRate',this.value)">
    <label>Läckage / avdunstning (m³/dygn)</label>
    <input type="number" id="dam_leak" value="${dam.leak}" step="0.5" onchange="damNum('leak',this.value)">
    <p class="muted small" style="margin-top:10px">Påfyllningen ger ca 9 m³/h (214 m³/dygn) — den är en påfyllnad mellan passen, inte i takt med snökanonernas uttag (upp till 70 m³/h).</p>`;
}
function mtRedigera(id){const a=dammData.avlas[id]; if(!a)return;
  mtForm=Object.assign(mtForm,{edit:id,m3:fmtM3(a.m3),ts:toLocalDT(a.ts),typ:a.typ,msg:'',err:false});render(); tillKort('mtkort');}
function mtAvbryt(){mtForm=Object.assign(mtForm,{edit:null,m3:'',ts:'',msg:'',err:false});render();}
async function mtSpara(typ){
  const fel=t=>{mtForm.msg=t;mtForm.err=true;mtForm.sparar=false;render();};
  const m3=talIn(mtForm.m3), ts=tidIn(mtForm.ts), me=dammJag();
  if(!Number.isFinite(m3)||m3<=0)return fel('Skriv mätarställningen i m³, till exempel 73 478,4.');
  if(!Number.isFinite(ts))return fel('Tiden går inte att läsa.');
  if(ts>Date.now()+10*60e3)return fel('Tiden ligger i framtiden.');
  if(!me)return fel('Inte inloggad.');
  // Mätaren går bara framåt. Kontrolleras här — databasen ser bara en
  // avläsning i taget.
  const L=avlasList().filter(a=>a.id!==mtForm.edit);
  const fore=L.filter(a=>a.ts<=ts).pop(), efter=L.find(a=>a.ts>ts);
  if(fore&&m3<fore.m3)return fel(`Ställningen är lägre än avläsningen ${fmtDT(fore.ts)} (${fmtM3(fore.m3)} m³). Mätaren går inte baklänges — kontrollera siffrorna.`);
  if(efter&&m3>efter.m3)return fel(`Ställningen är högre än avläsningen ${fmtDT(efter.ts)} (${fmtM3(efter.m3)} m³), som är senare. Kontrollera siffror och tid.`);
  if(fore){const dt=(ts-fore.ts)/3600e3, t=(m3-fore.m3)/Math.max(dt,1/60);
    if(t>20&&!confirm(`Det blir ${num(t,1)} m³/h sedan avläsningen ${fmtDT(fore.ts)}. Påfyllningen brukar ge ca 9. Spara ändå?`))return;}
  const gammal=mtForm.edit?dammData.avlas[mtForm.edit]:null;
  // Den som läste av står kvar när någon annan rättar.
  const data={ts:Math.round(ts),m3:Math.round(m3*1000)/1000,typ,uid:gammal?gammal.uid:me.uid,namn:gammal?gammal.namn:me.namn};
  mtForm.sparar=true; mtForm.msg='Sparar …'; mtForm.err=false; render();
  try{
    await dammSkriv('avlas',mtForm.edit,data);
    mtForm=Object.assign(mtForm,{edit:null,m3:'',ts:'',sparar:false,err:false,msg:`Sparat: ${TYPTXT[typ].toLowerCase()} ${fmtM3(data.m3)} m³, ${fmtDT(data.ts)}.`});
    loggFlik='avl'; render();
  }catch(e){fel('Kunde inte spara: '+felText(e));}
}
async function mtTaBort(){const id=mtForm.edit, a=id&&dammData.avlas[id]; if(!a)return;
  if(!confirm(`Ta bort avläsningen ${fmtDT(a.ts)}, ${fmtM3(a.m3)} m³?`))return;
  try{await dammSkriv('avlas',id,null);mtForm=Object.assign(mtForm,{edit:null,m3:'',ts:'',msg:'Borttagen.',err:false});render();}
  catch(e){mtForm.msg='Kunde inte ta bort: '+felText(e);mtForm.err=true;render();}
}

/* ---------- loggen ----------
   Allt som sparats, i tre flikar: avläsningarna (som kolumnerna i Excel),
   pumppassen (start till stopp) och mätningarna med måttband. Varje flik går
   att ladda ner som en fil för Excel. Förut låg avläsningarna under
   knapparna i inmatningsrutan och var svåra att hitta. */
// Varje avläsning med påfyllt sedan säsongens första och takten sedan förra.
function mtRader(L=avlasList()){
  let y=null, bas=0;
  return L.map((a,i)=>{const f=L[i-1];
    if(sasong(a.ts)!==y){y=sasong(a.ts);bas=a.m3;}
    const sammaS=f&&sasong(f.ts)===y, dt=sammaS?(a.ts-f.ts)/3600e3:0, d=sammaS?a.m3-f.m3:0;
    return Object.assign({},a,{sasong:y,pafyllt:a.m3-bas,takt:d>0&&dt>0?d/dt:null});});
}
// Pumppassen: från en start till nästa stopp. Ett pass som inte stoppats än
// räknas fram till nu med takten.
function pumpPass(L=avlasList()){
  const P=[]; let cur=null;
  for(const a of L){
    if(a.typ==='start'){if(!cur)cur={start:a};}
    else if(a.typ==='stopp'){P.push(Object.assign(cur||{start:null},{stopp:a}));cur=null;}
  }
  if(cur)P.push(cur);
  const now=Date.now();
  return P.map(p=>{const s=p.start, e=p.stopp||null, t2=e?e.ts:now, m2=e?e.m3:meterAt(now,L);
    const h=s?(t2-s.ts)/3600e3:null, m=s&&m2!=null?m2-s.m3:null;
    return {id:(s||e).id, ts:s?s.ts:e.ts, start:s, stopp:e, pagar:!e, h, m3:m, takt:h>0&&m!=null?m/h:null, sasong:sasong(s?s.ts:e.ts)};});
}
const fmtTim=h=>!Number.isFinite(h)?'–':h>=48?num(h/24,1)+' d':num(h,1)+' h';
function loggCard(){
  const now=Date.now(), nu=sasong(now);
  const urval=R=>{if(loggAlla)return R.slice().reverse();
    const ar=R.some(r=>r.sasong===nu)?nu:(R.length?R[R.length-1].sasong:nu);
    return R.filter(r=>r.sasong===ar).reverse().slice(0,10);};
  const radAttr=(x,fn)=>dammFarAndra(x)?`class="kan" onclick="${fn}('${esc(x.id)}')" title="Rätta eller ta bort"`:'';
  let tab='', antal=0, visat=0, tips='', extra='';
  if(loggFlik==='avl'){
    const R=mtRader(); antal=R.length; const V=urval(R); visat=V.length;
    tab=V.length?`<tr><th>Avläst</th><th></th><th class="r">Ställning</th><th class="r">Påfyllt</th><th class="r">m³/h</th></tr>`+
      V.map(r=>`<tr ${radAttr(r,'mtRedigera')}><td>${fmtDT(r.ts)}</td><td>${TYPTXT[r.typ]||''}</td><td class="r">${fmtM3(r.m3)}</td><td class="r">${fmtHel(r.pafyllt)}</td><td class="r">${r.takt===null?'–':num(r.takt,2)}</td></tr>`).join(''):'';
    tips='Påfyllt räknas från säsongens första avläsning. Tryck på en rad för att rätta eller ta bort den.';
  }else if(loggFlik==='pass'){
    const R=pumpPass(); antal=R.length; const V=urval(R); visat=V.length;
    tab=V.length?`<tr><th>Start</th><th>Stopp</th><th class="r">Tid</th><th class="r">m³</th><th class="r">m³/h</th></tr>`+
      V.map(p=>`<tr><td>${p.start?fmtDT(p.start.ts):'?'}</td><td>${p.pagar?'<b style="color:var(--text)">går</b>':fmtDT(p.stopp.ts)}</td><td class="r">${fmtTim(p.h)}</td><td class="r">${p.pagar?'≈ ':''}${fmtHel(p.m3)}</td><td class="r">${p.takt===null?'–':num(p.takt,2)}</td></tr>`).join(''):'';
    tips='Ett pass går från Start till Stopp. Pågår det räknas det fram till nu.';
  }else{
    const K=kalibList().map(k=>Object.assign({},k,{sasong:sasong(k.ts),v:volAt(clampH(hFromTape(k.cm,k.punkt)))}));
    antal=K.length; const V=urval(K); visat=V.length;
    tab=V.length?`<tr><th>Mättes</th><th class="r">cm</th><th class="r">m³</th><th class="r">%</th><th>Av</th></tr>`+
      V.map(k=>`<tr ${radAttr(k,'mbRedigera')}><td>${fmtDT(k.ts)}</td><td class="r">${fmtCm(k.cm)}</td><td class="r">${fmtHel(k.v)}</td><td class="r">${Math.round(k.v/V100*100)}</td><td>${esc((k.namn||'').split(' ')[0])}</td></tr>`).join(''):'';
    tips='Tryck på en rad för att ändra mått eller tid, eller ta bort mätningen.'; extra=lackage();
  }
  const fl=[['avl','Avläsningar'],['pass','Pumppass'],['mb','Måttband']];
  return `<h3>${icon('clock','#7dd3fc',15)} Loggen — påfyllning och måttband</h3>
    <div class="seg" style="margin-top:10px">${fl.map(([k,t])=>`<button class="${loggFlik===k?'on':''}" onclick="loggFlik='${k}';render()">${t}</button>`).join('')}</div>
    ${tab?`<table class="kron-tab mt-tab" style="margin-top:12px">${tab}</table>`:`<p class="muted small" style="margin-top:12px">Inget sparat än.</p>`}
    <p class="muted small" style="margin-top:8px">${tips}</p>${extra}
    <div class="row" style="margin-top:8px">${loggAlla||antal>visat?`<button class="linkbtn" onclick="loggAlla=!loggAlla;render()">${loggAlla?'Bara den här säsongen':'Visa alla '+antal}</button>`:''}${antal?`<button class="linkbtn" onclick="loggExcel()">Ladda ner för Excel</button>`:''}</div>`;
}
// Läckaget ur de två senaste mätningarna: det som försvunnit är
// nivåskillnaden minus det mätaren fyllt på. Det kräver att kanonerna stått
// still emellan (uttaget läses inte än), och regn räknas in som minus.
function lackage(){
  const K=kalibList(); if(K.length<2||!avlasList().length)return '';
  const a=K[K.length-2], s=K[K.length-1], d=(s.ts-a.ts)/864e5; if(d<1)return '';
  const va=volAt(clampH(hFromTape(a.cm,a.punkt))), vb=volAt(clampH(hFromTape(s.cm,s.punkt))), f=meterAt(s.ts)-meterAt(a.ts), borta=va+f-vb;
  // Med timvattnet dras kanonernas uttag av, så att resten är läckaget.
  const k=real&&vattenTimmeOk?damDrawnSince(a.ts)-damDrawnSince(s.ts):null, rest=k!=null?borta-k:borta;
  const B=t=>`<b style="color:var(--text)">${t}</b>`, LAK='läckage, avdunstning och bräddning, minus regn';
  const text=k!=null&&k>=1
    ?`Då försvann ${fmtHel(borta)} m³. Kanonerna tog ${fmtHel(k)} m³ (${UTTAG_PCT} % av sitt räknade vatten), och kvar blir ${B(fmtHel(rest)+' m³, '+num(rest/d,1)+' m³/dygn')}: ${LAK}. Blir det mycket mer eller mindre än några m³ per dygn stämmer inte faktorn för kanonerna.`
    :`Då försvann ${B(fmtHel(borta)+' m³, '+num(borta/d,1)+' m³/dygn')}: ${LAK}.${k==null?' Har kanonerna gått emellan ingår uttaget också.':''}`;
  return `<p class="muted small" style="margin-top:8px">${B('Mellan de två senaste mätningarna')} (${num(d,1)} dygn) fyllde mätaren ${fmtHel(f)} m³ och nivån ändrades ${vb>=va?'+':'−'}${fmtHel(Math.abs(vb-va))} m³. ${text} Måttbandet ger ca ±10 m³.</p>`;
}
// En fil som Excel öppnar direkt: semikolon, decimalkomma och en BOM så att
// å, ä och ö blir rätt. Filen gäller fliken som är vald, alla säsonger.
function loggExcel(){
  const c=v=>{const s=String(v??'');return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const tal=(v,d)=>Number.isFinite(v)?v.toFixed(d).replace('.',','):'';
  const p2=n=>String(n).padStart(2,'0');
  const dag=ts=>{const d=new Date(ts);return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;};
  const kl=ts=>{const d=new Date(ts);return `${p2(d.getHours())}:${p2(d.getMinutes())}`;};
  let rad, namn;
  if(loggFlik==='pass'){namn='pumppass';
    rad=[['Start datum','Start tid','Stopp datum','Stopp tid','Timmar','Påfyllt (m³)','Takt (m³/h)','m³/dygn']]
      .concat(pumpPass().map(p=>[p.start?dag(p.start.ts):'',p.start?kl(p.start.ts):'',p.pagar?'går':dag(p.stopp.ts),p.pagar?'':kl(p.stopp.ts),
        tal(p.h,2),tal(p.m3,3),tal(p.takt,2),tal(p.takt===null?NaN:p.takt*24,1)]));}
  else if(loggFlik==='mb'){namn='mattband';
    rad=[['Datum','Tid','Måttband vid snorkeln (cm)','Volym (m³)','Andel av 100 %','Mätt av']]
      .concat(kalibList().map(k=>{const v=volAt(clampH(hFromTape(k.cm,k.punkt)));
        return [dag(k.ts),kl(k.ts),tal(k.cm,1),tal(v,0),tal(v/V100*100,0),k.namn||''];}));}
  else{namn='vattenmataren';
    rad=[['Datum','Tid','Händelse','Mätarställning (m³)','Påfyllt sedan säsongens början (m³)','Takt sedan förra (m³/h)','m³/dygn','Avläst av']]
      .concat(mtRader().map(r=>[dag(r.ts),kl(r.ts),TYPTXT[r.typ]||r.typ,tal(r.m3,3),tal(r.pafyllt,3),tal(r.takt,2),tal(r.takt===null?NaN:r.takt*24,1),r.namn||'']));}
  const blob=new Blob(['﻿'+rad.map(r=>r.map(c).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=`${namn}-${dag(Date.now())}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),10000);
}

/* ============================================================
   VATTENRÅDGIVARE
   Räknar fram ett FÖRSLAG på fördelning — appen styr aldrig. Hård gräns:
   summan av vattenuttaget får inte överstiga pumpkapaciteten. Enheter med
   lägst våttemperatur prioriteras (bäst snö per liter). Tre strategier.
   ============================================================ */
let advGoal='cover', advDays=5;
const FTHRESH=-2.5;  // startgräns (våttemp °C) — prototyp, samma som prognosen
// Avrundar NEDÅT: avrundas varje enhet uppåt kan summan hamna några tiondelar
// över gränsen 69, och den gränsen är hård.
const round1=x=>Math.floor(x*10+1e-9)/10;

function advise(){
  // Med riktig data: bara enheter med kontakt, och styrsystemets teoretiska
  // flöde som fullt flöde. En enhet utan kontakt har gamla värden.
  const src=real?running().filter(c=>Number.isFinite(c.fmax)&&Number.isFinite(c.tw)):cannons;
  const rows=src.map(c=>({id:c.id,namn:c.namn,typ:c.typ,brunn:c.brunn,tw:c.tw,fmax:c.fmax,cur:c.eau,sug:0}));
  const elig=rows.filter(u=>u.tw<=FTHRESH);        // får köra
  const cold=[...elig].sort((a,b)=>a.tw-b.tw);     // kallast först
  const sumF=elig.reduce((s,u)=>s+u.fmax,0);
  const usable=usableVol(damVolNow()), inflowD=damInflowM3d()-dam.leak;  // m³ i magasinet resp. m³/dygn in (netto efter läckage)

  let budget = advGoal==='last'
    ? Math.min(sumF, PUMP_TARGET, (usable/advDays + inflowD)/24)  // m³/h: håll volymen i advDays dygn
    : Math.min(sumF, PUMP_TARGET);                   // kör mot målet 69, aldrig mot taket 70

  if(advGoal==='cover'){
    // sprid tunt på alla behöriga så fler brunnar täcks
    const k = sumF<=budget ? 1 : budget/sumF;
    elig.forEach(u=>u.sug=round1(u.fmax*k));
  }else{
    // koncentrera på de kallaste tills budgeten är slut (fast / last)
    let rem=budget;
    cold.forEach(u=>{const g=Math.min(u.fmax,Math.max(0,rem));u.sug=g>0.4?round1(g):0;rem-=u.sug;});
  }

  const sugTot=round1(rows.reduce((s,u)=>s+u.sug,0));
  const runN=rows.filter(u=>u.sug>0).length;
  const cov=Math.min(2.3, runN*0.30);              // fler enheter → längre bana
  const lastDays= sugTot>0 ? damDaysAt(sugTot) : 99;  // ur dammens volym + påfyllning
  return {rows,sugTot,runN,cov,lastDays,pumpPct:Math.round(sugTot/PUMP_TARGET*100)};
}

  </div>`;

   ${real&&!cannons.some(c=>c.brunn)?missing('<b>Enheterna ritas inte ut än.</b> Brunnen varje enhet står vid skickas från bryggans version 6. Kartan visar spåret och brunnarna.'):''}
   <div class="note" style="margin-top:12px">Vid varje enhet står <b>våttemperaturen</b> från enhetens egen givare (blå under startgränsen ${num(FTHRESH)} °C, gul över) och <b>flödet</b> i m³/h. Flödet är styrsystemets beräknade, ingen kanon mäter det. Står två enheter vid samma brunn visas den som är aktiv; den andra står i rutan. Vid dammen står summan av enheternas flöde, som används tills flödesmätaren FT01 är kontrollerad, och dammens nivå i procent. Utzoomat syns bara ikonerna. Tryck för detaljer. Spårlinjen är medellinjen ur drygt sex varv med klocka, och brunnarna och dammens krön är inmätta med pucken. Brunn 17 och 18 ligger en bit från linjen: gatan är 15–20 m bred längst ner i stora slingan, och varven gick på andra sidan. Kartan speglar styrsystemet — appen visar bara, styr aldrig.</div>
  </div>`;
}
let mapInst=null;
function initMap(){
  const el=document.getElementById('opsmap'); if(!el||!window.L) return;
  if(mapInst){try{mapInst.remove();}catch(e){} mapInst=null;}
  // Halva och kvarts zoomsteg: med hela steg hamnade spåret på 15 i en telefon,
  // för långt ut för etiketterna, medan 16 inte rymde hela spåret.
  mapInst=L.map(el,{zoomControl:true,attributionControl:true,scrollWheelZoom:true,zoomSnap:0.25,zoomDelta:0.5,wheelPxPerZoomLevel:120});
  // Flygbild från Esri (förval i prognosappen); referrerPolicy satt om OSM används
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {maxZoom:19,attribution:'Flygbild © Esri'}).addTo(mapInst);
  const line=L.polyline(TRACK.pts,{color:'#38bdf8',weight:3,opacity:.9}).addTo(mapInst);
  // dammens krön, inmätt med pucken (KRON under Damm-koll)
  L.polygon(KRON.horn.map(k=>[k.lat,k.lon]),{color:'#22d3ee',weight:2,fillColor:'#0e5a7a',fillOpacity:.35})
   .addTo(mapInst).bindPopup(`<b>Dammen</b> · krönet inmätt ${KRON.datum}<br>`+
     `${num(KRON.bredd,2)} × ${num(KRON.langd,2)} m, ${KRON.yta.toLocaleString('sv-SE')} m² innanför krönet<br>`+
     `Krönet över snorkeln: ${KRON.horn.map(k=>`${k.id} ${Math.round(overSnorkel(k.id))}`).join(' · ')} cm<br>`+
     `<a href="#" onclick="go('dam');return false">Öppna Damm-koll</a>`);
  // snorkeln, dammens bräddavlopp och 100 %-nivån (KANT under Damm-koll)
  const sn=kantPkt('SN');
  L.circleMarker([sn.lat,sn.lon],{radius:5,color:'#38bdf8',weight:2,fillColor:'#38bdf8',fillOpacity:.9})
   .addTo(mapInst).bindPopup(`<b>Snorkeln</b> · dammens bräddavlopp, 100 %<br>`+
     `${Math.round(overSnorkel('SN'))} cm under krönet här, inmätt ${KANT.datum}`);
  // Kartan fyller det som är kvar av skärmen ovanför menyraden, så att hela
  // spåret syns utan att man rullar. Med en fast höjd hamnade södra änden
  // under menyraden på en liten telefon, och kartan zoomades in för att
  // rymma det som inte syntes.
  const fitH=()=>{const nav=document.getElementById('botnav'), nh=nav&&nav.offsetHeight||0;
    const h=Math.round(window.innerHeight-(el.getBoundingClientRect().top+window.scrollY)-nh-10);
    el.style.height=Math.max(320,Math.min(h,900))+'px';};
  fitH();
  const fit=()=>{if(mapInst){fitH();mapInst.invalidateSize();mapInst.fitBounds(line.getBounds(),{padding:[12,12]});}};
  fit();
  // containern kan sakna sin höjd när kartan skapas (vyn fejdas in) — passa in igen
  // när layouten satt sig, annars hamnar zoomen på världsnivå.
  setTimeout(fit,60);
  // brunnar som små punkter, väderstationen (br 7) markerad
  WELLS.forEach(w=>{
    const st=!!w.station;
    L.circleMarker([w.lat,w.lon],{radius:st?6:4,color:st?'#22d3ee':'#8ba0bd',weight:st?2:1,
      fillColor:st?'#0e2a3d':'#1a2a42',fillOpacity:.95})
     .addTo(mapInst).bindPopup(st?`<b>Brunn ${w.no}</b><br>Styrsystemets väderstation`:`Brunn ${w.no}${w.spare?' · reserv':''}`);
  });
  // Längre ut än att hela spåret syns får etiketterna inte plats (se .zlow).
  // Gränsen låg förut på 15,5, och då syntes de inte på Kristians telefon
  // utan att zooma in.
  const zl=()=>{if(mapInst)mapInst.getContainer().classList.toggle('zlow',mapInst.getZoom()<14.5);};
  mapInst.on('zoomend',()=>{zl();drawMapUnits();}); zl();
  mapMk={}; drawMapUnits();
}

/* ---------- enheterna och pumphuset på kartan ----------
   Kartan är startvyn och ska gå att läsa utan att trycka: våttemperatur och
   flöde står vid varje enhet, och summaflödet och dammen vid pumphuset.
   Markörerna byts ut på plats när ny data kommer. Hela kartan ritas inte om,
   för då hoppar den tillbaka till utgångsläget, och en öppen ruta stängs. */
let mapMk={};
/* Åt vilket håll etiketten står från brunnen. Upp till brunn 12 går spåret
   i nord-sydlig led med 60 m mellan brunnarna, och etiketten står på den
   sida av brunnen som vetter bort från spårlinjen (räknas ut). Norr om 12
   ligger brunnarna i vändslingorna tätt åt alla håll, så där är sidan vald
   för hand: över eller under ikonen, eftersom 13-16 ligger på rad i
   öst-västlig led. placeLabels flyttar den om den ändå krockar. Prövat med en
   enhet vid varje brunn. */
// 7 och 8 står mitt för dammen, där pumphusets etikett sitter öster om
// spåret, och får därför sin etikett åt väster.
const MSIDA={7:'w',8:'w',13:'n',14:'s',15:'n',16:'s',17:'s',18:'n',19:'n'};
function msida(w){
  if(MSIDA[w.no])return MSIDA[w.no];
  let best=null,d=1e9;
  for(const p of TRACK.pts){const dd=(p[0]-w.lat)**2+((p[1]-w.lon)*0.52)**2; if(dd<d){d=dd;best=p;}}
  return best&&w.lon<best[1]?'w':'e';
}
/* Läget för en enhet på kartan. kor följer samma regel som pushlarmen
   (functions/larm.js): läget Kör, eller på det äldre kortet att vatten går.
   borta = styrsystemet hör den inte, och pushlarmet säger att den körde nyss:
   den kan ha försvunnit. En enhet som inte hörts på länge får bara streck. */
function mapUnitState(c){
  if(!real){const kor=c.state!=='off';
    return {live:true,kor,fel:c.state==='alarm',borta:false,q:c.eau,
      col:UCOL[c.state]||'#9fb0c7',txt:STATE[c.state][1]};}
  const live=c.state==='conn'&&!bridgeOld();
  const push=larmlage['enhet-'+c.key]; const larm=!!(push&&push.titel);
  const kor=live&&(c.lage===6||(Number.isFinite(c.q)&&c.q>0));
  const fel=live&&(c.lage===1||(larm&&!kor));
  const borta=!live&&!bridgeOld()&&larm;
  const col=fel||borta?'#f87171':kor?'#34d399':live?'#60a5fa':'#9fb0c7';
  const txt=fel?(c.lage===1?'Fel':'Larm'):borta?'Hörs inte — kan ha försvunnit':kor?'Kör':live?'Hörs, kör inte':'Tyst';
  return {live,kor,fel,borta,q:c.q,col,txt,larm:larm?push:null};
}
// Står två enheter vid samma brunn visas bara den som är aktiv: den som kör,
// annars den som hörs, annars den som larmar, annars den som hördes sist.
function mapPick(list){
  const v=c=>{const m=mapUnitState(c);return (m.kor?8:0)+(m.live?4:0)+(m.borta||m.fel?2:0);};
  return list.slice().sort((a,b)=>v(b)-v(a)||((b.heard||0)-(a.heard||0)))[0];
}
// Brunn 1-12 får etiketten på en rad (temperatur och flöde efter varandra):
// där står brunnarna 60 m isär i nord-sydlig led, och en låg etikett ryms
// mellan dem även när hela spåret syns. Från 13 ligger brunnarna på rad i
// öst-västlig led, och där är en smal etikett i två rader över eller under
// ikonen bättre (Kristian 27 november).
function unitLabel(c,m,side,rad){
  const tw=m.live?num(c.tw):'–', q=m.live?num(m.q):'–';
  const twc=m.live&&Number.isFinite(c.tw)?(c.tw<=FTHRESH?'#7dd3fc':'#fbbf24'):'#9fb0c7';
  return `<div class="mlab ${side}${m.live?'':' dim'}"><span style="color:${twc}">${tw}°</span>${m.borta?' <span style="color:#fbbf24">⚠</span>':''}${rad?' ':'<br>'}${q} <small>m³/h</small></div>`;
}
function drawMapUnits(){
  // Larmraden och larmknappens siffra följer med, eftersom vyn inte ritas om.
  const b=document.getElementById('mapBanner'); if(b)b.innerHTML=alarmBanner();
  buildNav();
  if(!mapInst)return;
  const want={};
  const byWell={};
  cannons.forEach(c=>{if(WELLS.some(w=>w.no===c.brunn))(byWell[c.brunn]=byWell[c.brunn]||[]).push(c);});
  for(const [no,list] of Object.entries(byWell)){
    const w=WELLS.find(x=>x.no===+no), c=mapPick(list), m=mapUnitState(c), side=msida(w);
    const andra=list.filter(x=>x!==c);
    const html=sd=>`<div class="mk"><div class="umark${m.borta?' vanish':''}" style="background:${m.col}${m.live?'':';opacity:.6;border-style:dashed'}">${esc(c.id)}</div>${unitLabel(c,m,sd,+no<=12)}</div>`;
    const pop=`<b>${esc(c.namn)}</b> · ${esc(m.txt)}<br>Brunn ${w.no}${c.modell?' · '+esc(c.modell):''}<br>`+
      `Våttemp ${m.live?num(c.tw):'–'} °C · flöde ${m.live?num(m.q):'–'} m³/h`+
      (real?`<br>${m.live?'Hörd nyss':'Hörd '+ago(c.heard)}`:'')+
      (m.larm?`<br><b style="color:#f87171">${esc(m.larm.titel)}</b>`:'')+
      (andra.length?`<br><span style="color:#9fb0c7">Också vid brunnen: ${andra.map(x=>esc(x.namn)+' ('+esc(mapUnitState(x).txt.toLowerCase())+')').join(', ')}</span>`:'')+
      (real?`<br><a href="#" onclick="openUnit('${esc(c.id)}');return false">Öppna</a>`:'');
    want['w'+no]={ll:[w.lat,w.lon],html,pop,pref:side};
  }
  // Pumphuset står vid dammen. Summan är kanonernas eget beräknade flöde;
  // FT01 står i rutan, rättad (se FT01_FAKTOR).
  {
    const lat=KRON.horn.reduce((a,k)=>a+k.lat,0)/KRON.horn.length, lon=KRON.horn.reduce((a,k)=>a+k.lon,0)/KRON.horn.length;
    const lv=real?cannons.filter(c=>mapUnitState(c).live&&Number.isFinite(c.q)):cannons;
    const q=real?(lv.length?sum(lv,c=>c.q):null):totalWater(), pct=damPct();
    const pc=pct<30?'#f87171':pct<50?'#fbbf24':'#34d399';
    const html=()=>`<div class="mk"><div class="mlab pump e" style="left:4px">Σ ${num(q)} <small>m³/h</small><br><small>Dammen</small> <span style="color:${damUtanUttag()?'#6f7f96':pc}">${damUtanUttag()?'≤ ':''}${pct} %</span></div></div>`;
    const p2=pumps&&pumps.dep12||{};
    const pop=`<b>Pumphuset</b><br>Kanonernas flöde, summa: ${num(q)} m³/h<br>`+
      (real?`FT01 ${num(ft01(p2.k125))} m³/h${ft01Fel()?' (rättat × 1,81)':''}<br>`:'')+
      `Dammen ${pct} % · egen beräkning, nivån mäts inte${damUtanUttag()?'. Uttaget sedan mätningen '+fmtDT(dam.t0)+' saknas':''}<br>`+
      `<a href="#" onclick="go('water');return false">Vatten</a> · <a href="#" onclick="go('dam');return false">Damm-koll</a>`;
    want.pump={ll:[lat,lon],html,pop};
  }
  // Två varv: det första med etiketternas förra storlek, det andra med den
  // uppmätta om någon ändrats (en ny siffra kan göra etiketten bredare).
  for(let varv=0;varv<2;varv++){
    const sides=placeLabels(want);
    putMarkers(want,sides);
    if(!Object.keys(want).map(measureLabel).some(Boolean))break;
  }
}
// Etiketternas storlek i bildpunkter, uppmätt när de ritats.
let mlabSize={};
function measureLabel(k){
  const o=mapMk[k], el=o&&o.mk.getElement()&&o.mk.getElement().querySelector('.mlab');
  if(!el||!el.offsetWidth)return false;
  const w=el.offsetWidth,h=el.offsetHeight,f=mlabSize[k];
  mlabSize[k]={w,h};
  return !f||Math.abs(f.w-w)>2||Math.abs(f.h-h)>2;
}
/* Väljer åt vilket håll varje etikett står, så att de inte skriver över
   varandra eller en annan enhets ikon. Brunnens egen sida (msida) provas
   först, sedan motsatt sida och snedställt. Räknas om vid varje zoom, för
   när man zoomar ut kommer brunnarna närmare varandra på skärmen. Får ingen
   sida plats tas den som täcker minst. */
const MSIDOR={e:['e','ne','se','w','nw','sw','n','s'],w:['w','nw','sw','e','ne','se','n','s'],
  n:['n','ne','nw','s','se','sw','e','w'],s:['s','se','sw','n','ne','nw','e','w']};
function labelRect(p,sd,w,h){
  const r={e:[17,-h/2],w:[-17-w,-h/2],n:[-w/2,-16-h],s:[-w/2,16],ne:[15,-13-h],nw:[-15-w,-13-h],se:[15,13],sw:[-15-w,13]}[sd];
  return {x:p.x+r[0],y:p.y+r[1],w,h};
}
function overlap(a,b){
  const dx=Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x), dy=Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y);
  return dx>0&&dy>0?dx*dy:0;
}
function placeLabels(want){
  const sz=mapInst.getSize(), pt={}, taken=[], sides={};
  for(const [k,x] of Object.entries(want))pt[k]=mapInst.latLngToContainerPoint(x.ll);
  // Alla ikoner är hinder, och pumphusets etikett står fast.
  for(const k of Object.keys(want))if(k!=='pump')taken.push({x:pt[k].x-15,y:pt[k].y-14,w:30,h:28});
  if(want.pump){const z=mlabSize.pump||{w:90,h:36};taken.push({x:pt.pump.x+4,y:pt.pump.y-z.h/2,w:z.w,h:z.h});}
  // Söderifrån, i brunnarnas ordning: där är det glest och förstahandsvalet
  // står sig, och de trånga vändslingorna anpassar sig efter det.
  const keys=Object.keys(want).filter(k=>k!=='pump').sort((a,b)=>+a.slice(1)-+b.slice(1));
  for(const k of keys){
    const z=mlabSize[k]||{w:64,h:34}; let best=null,bs=1e18;
    MSIDOR[want[k].pref].forEach((sd,i)=>{
      const r=labelRect(pt[k],sd,z.w,z.h);
      let s=taken.reduce((a,t)=>a+overlap(r,t),0);
      // Utanför kartan syns den inte.
      s+=r.w*r.h-overlap(r,{x:0,y:0,w:sz.x,h:sz.y});
      s=s*100+i;
      if(s<bs){bs=s;best=sd;}
    });
    sides[k]=best; taken.push(labelRect(pt[k],best,z.w,z.h));
  }
  return sides;
}
function putMarkers(want,sides){
  for(const k of Object.keys(mapMk))if(!want[k]){mapInst.removeLayer(mapMk[k].mk);delete mapMk[k];}
  for(const [k,x0] of Object.entries(want)){
    const x={ll:x0.ll,pop:x0.pop,html:x0.html(sides[k])};
    const ic=L.divIcon({className:'',html:x.html,iconSize:[0,0],iconAnchor:[0,0]});
    const o=mapMk[k];
    if(o&&o.lat===x.ll[0]&&o.lon===x.ll[1]){
      if(o.html!==x.html){o.mk.setIcon(ic);o.html=x.html;}
      if(o.pop!==x.pop){o.mk.setPopupContent(x.pop);o.pop=x.pop;}
      continue;
    }
    if(o)mapInst.removeLayer(o.mk);
    const mk=L.marker(x.ll,{icon:ic,zIndexOffset:k==='pump'?0:1000}).addTo(mapInst).bindPopup(x.pop);
    mapMk[k]={mk,html:x.html,pop:x.pop,lat:x.ll[0],lon:x.ll[1]};
  }
}

  </div>`;
