<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snökoll — driftövervakning</title>
<meta name="theme-color" content="#0a111e">
<meta name="apple-mobile-web-app-title" content="Snökoll">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./kanon-192.png">
<link rel="apple-touch-icon" href="./kanon-apple.png">
<!--
  Inloggningen är riktig (Google via Firebase, och medlemslistan i databasen
  avgör vem som kommer in), och vyerna visar det bryggan skickar från
  styrsystemet. Det som saknas i datan (flöde per enhet, driftläge, vilken
  brunn en enhet står vid) visas som saknat, aldrig som påhittade siffror.
  Dammen är en egen beräkning, och körfönstret är fortfarande ett exempel.
  Med ?demo i adressen visas i stället de gamla exempelsiffrorna överallt.
  Syfte: visa UX-förslag för övervakningsappen — välkomst, systemvy,
  vattenbalans, kanon-/lansvy, larm och körfönster.
  Chart.js hämtas från CDN. Allt annat ligger i den här filen, i samma anda
  som prognosappen (ingen bygg).
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --bg:#0a111e; --bg2:#0e1829; --panel:#13203360; --panel-solid:#132033;
  --panel-hi:#1a2a42; --border:#ffffff14; --border-hi:#ffffff26;
  /* muted2 var #64789b: 3,9:1 mot korten, för svagt för den lilla text den
     används till. #8296b5 ger drygt 5,5:1. */
  --text:#e9f0fa; --muted:#8ba0bd; --muted2:#8296b5;
  --ice:#38bdf8; --ice2:#22d3ee; --accent:#7dd3fc;
  --run:#34d399; --standby:#60a5fa; --limit:#fbbf24; --alarm:#f87171; --off:#5b6b82;
  --shadow:0 10px 30px -12px #000a, 0 2px 8px -4px #0008;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(1200px 600px at 80% -10%, #16304d55, transparent 60%),
    radial-gradient(900px 500px at -10% 10%, #0e2a3d55, transparent 55%),
    var(--bg);
  color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased;
  letter-spacing:.1px;
}
a{color:inherit}
.hidden{display:none!important}

/* ---------- Login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
.flakes{position:absolute;inset:0;pointer-events:none;opacity:.5}
.flake{position:absolute;top:-10px;color:#bfe4ff;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg)}}
.login-card{
  width:min(420px,100%);background:linear-gradient(180deg,#14233aee,#0e1829ee);
  border:1px solid var(--border-hi);border-radius:24px;padding:38px 30px;
  box-shadow:var(--shadow);backdrop-filter:blur(8px);text-align:center;position:relative;z-index:2
}
.logo{width:72px;height:72px;margin:0 auto 14px;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#1b3a5a,#0c1b2d);border:1px solid var(--border-hi);
  border-radius:20px;box-shadow:inset 0 1px 0 #ffffff22}
.login-card h1{margin:.1em 0 .1em;font-size:1.5rem;letter-spacing:.3px}
.login-card .sub{color:var(--muted);font-size:.92rem;margin-bottom:22px}
.btn{
  width:100%;border:0;border-radius:12px;padding:13px 16px;font-size:.98rem;font-weight:600;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
  transition:transform .12s ease, filter .12s ease
}
.btn:active{transform:translateY(1px)}
.btn-g{background:#fff;color:#1f2733}
.btn-g:hover{filter:brightness(.96)}
.login-msg{color:var(--muted);font-size:.9rem;line-height:1.5;margin:14px 0 0;overflow-wrap:anywhere}
.login-msg b{color:var(--text)}
.login-msg.err{color:var(--limit)}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border-hi);margin-top:14px}
.login-card .tiny{color:var(--muted2);font-size:.76rem;margin-top:18px;line-height:1.5}
.pill{display:inline-flex;align-items:center;gap:6px;background:#0c1a2b;border:1px solid var(--border);
  color:var(--accent);border-radius:999px;padding:4px 11px;font-size:.74rem;margin-bottom:18px}

/* ---------- App shell ---------- */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
#sidebar{
  background:linear-gradient(180deg,#0e1829,#0b1320);border-right:1px solid var(--border);
  padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px;border-bottom:1px solid var(--border);margin-bottom:10px}
.brand .logo{width:38px;height:38px;border-radius:11px;margin:0}
.brand b{font-size:1.02rem;letter-spacing:.3px}
.brand small{display:block;color:var(--muted2);font-size:.68rem;font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;color:var(--muted);
  font-size:.93rem;font-weight:500;cursor:pointer;transition:background .15s,color .15s;position:relative}
.nav a:hover{background:#ffffff0a;color:var(--text)}
.nav a.active{background:linear-gradient(90deg,#1b3250,#16263d);color:#fff}
.nav a.active::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--ice)}
.nav a .badge{margin-left:auto;background:var(--alarm);color:#fff;font-size:.68rem;font-weight:700;
  min-width:19px;height:19px;border-radius:999px;display:grid;place-items:center;padding:0 5px}
.side-foot{border-top:1px solid var(--border);padding-top:12px;margin-top:8px;display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#2a4a6f,#1b3a5a);
  display:grid;place-items:center;font-weight:700;font-size:.82rem;color:#cfe9ff}
.side-foot small{color:var(--muted2);font-size:.7rem;display:block}

#main{padding:22px 26px 90px;max-width:1180px;width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.topbar h2{margin:0;font-size:1.32rem;letter-spacing:.2px}
.topbar .crumb{color:var(--muted2);font-size:.8rem;margin-bottom:3px}
.live{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:.8rem;
  background:#0d1a2b;border:1px solid var(--border);padding:7px 13px;border-radius:999px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--run);box-shadow:0 0 0 0 #34d39977;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #34d39966}70%{box-shadow:0 0 0 9px #34d39900}100%{box-shadow:0 0 0 0 #34d39900}}

/* ---------- cards / grid ---------- */
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(185px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g-units{grid-template-columns:repeat(auto-fit,minmax(255px,1fr))}
.card{background:linear-gradient(180deg,#14233a99,#101b2c99);border:1px solid var(--border);
  border-radius:var(--r);padding:17px 18px;box-shadow:var(--shadow);backdrop-filter:blur(4px)}
.card h3{margin:0 0 2px;font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;display:flex;align-items:center;gap:8px}
.kpi .val{font-size:1.9rem;font-weight:700;letter-spacing:.3px;margin-top:6px;line-height:1.05}
.kpi .val small{font-size:.9rem;color:var(--muted);font-weight:600}
.kpi .foot{color:var(--muted2);font-size:.76rem;margin-top:5px;display:flex;align-items:center;gap:6px}
.up{color:var(--run)} .down{color:var(--alarm)} .warn{color:var(--limit)}

/* bars */
.bar{height:9px;border-radius:999px;background:#0c1626;overflow:hidden;margin-top:9px;border:1px solid var(--border)}
.bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--ice),var(--ice2));transition:width .6s cubic-bezier(.2,.7,.2,1)}
.bar.amber > i{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.bar.red > i{background:linear-gradient(90deg,#ef4444,#f87171)}
.bar.green > i{background:linear-gradient(90deg,#10b981,#34d399)}

/* status chip */
.chip{display:inline-flex;align-items:center;gap:7px;font-size:.76rem;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--border)}
.chip .d{width:8px;height:8px;border-radius:50%}
.s-run{color:#8ff0c6;background:#0e2a20} .s-run .d{background:var(--run);animation:pulse 2s infinite}
.s-standby{color:#bcd4ff;background:#132544} .s-standby .d{background:var(--standby)}
.s-limit{color:#ffe0a3;background:#2b2410} .s-limit .d{background:var(--limit)}
.s-alarm{color:#ffc2c2;background:#2b1414} .s-alarm .d{background:var(--alarm);animation:pulse 1.2s infinite}
.s-off{color:#9fb0c7;background:#161f2e} .s-off .d{background:var(--off)}

/* unit card */
.unit{cursor:pointer;transition:transform .14s ease,border-color .14s ease;position:relative;overflow:hidden}
.unit:hover{transform:translateY(-3px);border-color:var(--border-hi)}
.unit .u-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.unit .u-name{font-weight:700;font-size:1.02rem;display:flex;align-items:center;gap:10px}
.unit .u-well{color:var(--muted2);font-size:.73rem;font-weight:500}
.metric-row{display:flex;justify-content:space-between;gap:12px;margin-top:10px}
.metric{flex:1}
.metric .m-l{color:var(--muted);font-size:.72rem}
.metric .m-v{font-weight:700;font-size:1.05rem;margin-top:1px}
.metric .m-v small{font-size:.72rem;color:var(--muted);font-weight:600}

/* fan spin */
.fan{transform-origin:50% 50%}
.spin{animation:spin 2.4s linear infinite}
.spin.fast{animation-duration:.9s}
@keyframes spin{to{transform:rotate(360deg)}}
.droplet{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(2.5px)}}

/* water flow view */
.flow-row{display:grid;grid-template-columns:150px 1fr 96px;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--border)}
.flow-row:last-child{border-bottom:0}
.flow-row .fname{display:flex;align-items:center;gap:9px;font-weight:600;font-size:.9rem}
.flow-track{height:18px;border-radius:7px;background:#0b1626;border:1px solid var(--border);overflow:hidden;position:relative}
.flow-fill{height:100%;border-radius:6px 0 0 6px;background:linear-gradient(90deg,#0ea5e9,#22d3ee);position:relative}
.flow-fill::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,#ffffff00 0 10px,#ffffff22 10px 14px);
  animation:stream 1s linear infinite}
@keyframes stream{to{background-position:28px 0}}
.flow-fill.amber{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.flow-val{text-align:right;font-weight:700;font-size:.9rem}
.flow-val small{color:var(--muted);font-weight:600;font-size:.72rem}

/* pump gauge */
.pumpwrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.gauge{--p:0;position:relative;width:150px;height:150px;border-radius:50%;flex:0 0 auto;
  background:conic-gradient(var(--gcol,var(--ice)) calc(var(--p)*1%), #10203400 0);
  display:grid;place-items:center;transition:--p .6s}
.gauge::before{content:"";position:absolute;inset:12px;border-radius:50%;background:#0d1a2b;border:1px solid var(--border)}
.gauge .gv{position:relative;text-align:center}
.gauge .gv b{font-size:1.7rem;display:block;line-height:1}
.gauge .gv span{font-size:.72rem;color:var(--muted)}
.pstat{flex:1;min-width:200px}
.pstat .big{font-size:1.05rem;font-weight:700;margin-bottom:4px}
.pstat p{margin:.3em 0;color:var(--muted);font-size:.86rem;line-height:1.5}

/* alarms */
.alarm-item{display:flex;gap:13px;align-items:flex-start;padding:13px 4px;border-bottom:1px solid var(--border)}
.alarm-item:last-child{border-bottom:0}
.alarm-ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto}
.a-crit{background:#2b1414;color:var(--alarm)} .a-warn{background:#2b2410;color:var(--limit)} .a-info{background:#132544;color:var(--standby)}
.alarm-item .a-body{flex:1}
.alarm-item .a-title{font-weight:600;font-size:.95rem}
.alarm-item .a-meta{color:var(--muted2);font-size:.76rem;margin-top:2px}
.alarm-item.ack{opacity:.5}
.banner{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#2b1414,#1c1420);
  border:1px solid #f8717144;border-radius:14px;padding:13px 16px;margin-bottom:18px}
.banner.ok{background:linear-gradient(90deg,#0e2a20,#101f2c);border-color:#34d39944}

/* forecast window */
/* En ruta per timme utan mellanrum: 48 rutor med glipor åt upp halva bredden
   på en telefon. Etiketten ligger ovanpå rutan så att den inte gör den bredare. */
.timeline{display:flex;margin-top:14px;height:40px;border-radius:9px;overflow:hidden;border:1px solid var(--border)}
.tseg{flex:1 1 0;min-width:0;position:relative}
.tseg b{position:absolute;z-index:1;left:3px;bottom:3px;font-size:.62rem;font-weight:500;color:#ffffffc0;white-space:nowrap;pointer-events:none}
.tseg.mark{box-shadow:inset 1px 0 0 #ffffff45}
.tseg.good{background:linear-gradient(180deg,#0e3a2a,#10533a)} .tseg.ok{background:linear-gradient(180deg,#3a3010,#5a4712)}
.tseg.no{background:linear-gradient(180deg,#2a1a1a,#3a2020)} .tseg.na{background:#0c1626}
.legend{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap;color:var(--muted);font-size:.78rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.kf-win{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap;padding:9px 12px;border-radius:10px;
  background:#0e2a20;border:1px solid #34d39938;margin-top:8px;font-size:.9rem;font-weight:600}
.kf-win.marginal{background:#2b2410;border-color:#fbbf2438}
.kf-win.none{background:#0c1626;border-color:var(--border);color:var(--muted);font-weight:500}
.kf-win .d{color:var(--muted);font-size:.8rem;font-weight:500;font-variant-numeric:tabular-nums}
.kf-dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--off)}
.kf-dot.go{background:var(--run)} .kf-dot.marginal{background:var(--limit)} .kf-dot.stop{background:var(--alarm)}
/* width:0 + min-width:100%: tabellen får inte göra hela sidan bredare än
   telefonen. Är den för bred rullar den i sidled inne i kortet. */
.kf-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;width:0;min-width:100%}
.kf-day td{color:var(--muted2);font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px;padding-top:12px;border-top:1px solid var(--border-hi)}

canvas{max-width:100%}
/* Chart.js ritar efter FÖRÄLDERNS storlek. Ligger canvasen direkt i kortet
   mäter den hela kortet (rubrik och allt) och växer för varje omritning.
   Därför en egen låda med fast höjd runt varje graf. */
.chartbox{position:relative;height:190px;margin-top:10px}
.section-title{font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin:26px 2px 10px}

/* mobile bottom nav */
#botnav{display:none}
@media(max-width:860px){
  #app{grid-template-columns:1fr}
  #sidebar{display:none}
  #main{padding:16px 15px 86px}
  #botnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:#0c1626ee;border-top:1px solid var(--border);backdrop-filter:blur(10px);
    padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
  #botnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted2);
    font-size:.62rem;padding:5px 2px;cursor:pointer;position:relative}
  #botnav a.active{color:var(--ice)}
  #botnav a .badge{position:absolute;top:0;right:50%;margin-right:-22px;background:var(--alarm);color:#fff;
    font-size:.6rem;font-weight:700;min-width:15px;height:15px;border-radius:999px;display:grid;place-items:center;padding:0 3px}
  .topbar h2{font-size:1.15rem}
  /* smala skärmar: namnkolumnen får inte äta upp stapeln */
  .flow-row{grid-template-columns:104px 1fr 70px;gap:8px}
  .flow-row .u-well{display:none}
  .adv-row{grid-template-columns:1fr 62px 10px 88px;gap:6px}
  /* namnet på en rad, brunn och våttemperatur på raden under */
  .adv-row .fname{display:block;white-space:nowrap}
  .adv-row .fname svg{vertical-align:-3px;margin-right:5px}
  .adv-row .u-well{display:block;padding-left:23px}
  .chartbox{height:175px}
  .live{font-size:.74rem;padding:6px 10px}
}
.live.stale{color:#ffe0a3;background:#2b2410;border-color:#fbbf2455}
.view{animation:fade .35s ease}
.soft .view{animation:none}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.muted{color:var(--muted)} .small{font-size:.82rem}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.linkbtn{background:#132544;border:1px solid var(--border);color:var(--accent);border-radius:9px;
  padding:7px 12px;font-size:.82rem;font-weight:600;cursor:pointer}
.note{background:#0c1a2b;border:1px dashed var(--border-hi);border-radius:12px;padding:11px 14px;color:var(--muted);font-size:.8rem;line-height:1.55}

/* ---------- karta (Leaflet) ---------- */
#opsmap{height:min(72vh,720px);width:100%;background:#0a111e}
.leaflet-container{background:#0a111e;font-family:inherit}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel-solid);color:var(--text);border:1px solid var(--border-hi);box-shadow:var(--shadow)}
.leaflet-popup-content{margin:9px 12px;font-size:.82rem;line-height:1.5}
.leaflet-popup-content b{color:#fff}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.leaflet-bar a{background:#132033;color:var(--text);border-bottom:1px solid var(--border)}
.leaflet-bar a:hover{background:var(--panel-hi)}
.leaflet-control-attribution{background:#0c1a2bcc!important;color:var(--muted2)!important}
.leaflet-control-attribution a{color:var(--accent)!important}
.umark{min-width:26px;height:26px;padding:0 5px;border-radius:999px;display:grid;place-items:center;
  border:2px solid #0a111e;box-shadow:0 2px 8px #0009;font-weight:800;font-size:.7rem;color:#06121f;white-space:nowrap}
.map-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
/* Etiketten sitter i samma markör som ikonen, åt det håll brunnen har fritt
   (MSIDA). Markören är noll stor, så ikonen och etiketten placeras kring
   brunnens punkt med absolut läge. */
.mk{position:relative;width:0;height:0}
.mk .umark{position:absolute;left:0;top:0;transform:translate(-50%,-50%)}
.mk .umark.vanish{outline:2px solid #fbbf24;outline-offset:1px}
.mlab{position:absolute;background:#0a111ee6;border:1px solid #2a3d58;border-radius:7px;padding:2px 6px;
  font-size:.7rem;line-height:1.25;font-weight:700;white-space:nowrap;color:#e9f0fa;box-shadow:0 2px 8px #0008;
  font-variant-numeric:tabular-nums;pointer-events:auto;cursor:pointer}
.mlab small{font-weight:600;color:#9fb0c7;font-size:.62rem}
.mlab.e{left:17px;top:0;transform:translateY(-50%)}
.mlab.w{right:17px;top:0;transform:translateY(-50%)}
.mlab.n{bottom:16px;left:0;transform:translateX(-50%)}
.mlab.s{top:16px;left:0;transform:translateX(-50%)}
.mlab.ne{left:15px;bottom:13px}.mlab.nw{right:15px;bottom:13px}
.mlab.se{left:15px;top:13px}.mlab.sw{right:15px;top:13px}
.mlab.dim{opacity:.6;border-style:dashed}
.mlab.pump{border-color:#22d3ee;font-size:.74rem}
/* Utzoomat får etiketterna inte plats: då syns bara ikonerna. */
.zlow .mlab:not(.pump){display:none}
.map-legend .row{gap:7px}
.map-legend i{width:13px;height:13px;border-radius:50%;display:inline-block;flex:0 0 auto}

/* ---------- vattenrådgivare ---------- */
.strat{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:10px;margin-top:12px}
.strat button{text-align:left;background:#0e1c30;border:1px solid var(--border);border-radius:13px;
  padding:13px 14px;cursor:pointer;color:var(--text);transition:border-color .15s,background .15s}
.strat button:hover{border-color:var(--border-hi)}
.strat button.on{border-color:var(--ice);background:linear-gradient(180deg,#14304d,#102236)}
.strat button b{display:block;font-size:.92rem;margin-bottom:3px}
.strat button span{color:var(--muted);font-size:.75rem;line-height:1.45}
.daypills{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.daypills button{background:#0e1c30;border:1px solid var(--border);border-radius:999px;padding:6px 14px;
  cursor:pointer;color:var(--muted);font-weight:600;font-size:.82rem}
.daypills button.on{border-color:var(--ice);color:var(--text);background:#13304d}
.adv-row{display:grid;grid-template-columns:1fr 74px 22px 104px;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.adv-row:last-child{border-bottom:0}
.adv-cur{text-align:right;color:var(--muted);font-weight:600;font-size:.9rem}
.adv-cur small,.adv-sug small{font-size:.7rem;font-weight:600;color:var(--muted)}
.adv-arrow{text-align:center;color:var(--muted2)}
.adv-sug{text-align:right;font-weight:700;font-size:.95rem}
.adv-sug.up{color:var(--run)} .adv-sug.dn{color:var(--limit)} .adv-sug.off{color:var(--off)}

/* ---------- damm-koll (digital tvilling av magasinet) ---------- */
.dam-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-top:14px}
@media(max-width:820px){.dam-grid{grid-template-columns:1fr}}
/* Pumphuset: liggande skiss på bred skärm, stående på telefon. Den liggande
   behöver 700 px och fick annars rullas i sidled. */
.pump-tall{display:none}
@media(max-width:760px){.pump-wide{display:none}.pump-tall{display:block}}
.dam-svg{width:100%;height:auto;display:block;margin-top:4px}
.dam-ctrl label{display:block;color:var(--muted);font-size:.76rem;margin:12px 0 5px}
.dam-ctrl input[type=number],.dam-ctrl input[type=text],.dam-ctrl input[type=datetime-local]{width:100%;background:#0c1626;
  border:1px solid var(--border);color:var(--text);border-radius:9px;padding:9px 11px;font-size:.9rem}
.dam-ctrl input[type=datetime-local]{color-scheme:dark}
.dam-ctrl input:disabled{opacity:.45}
.dtrow{display:flex;gap:10px;margin-top:4px}
.dtrow>div{flex:1 1 0;min-width:0}
.dtrow label{margin-top:8px}
.dam-ctrl input[type=range]{width:100%;accent-color:var(--ice);margin-top:4px}
.seg{display:inline-flex;background:#0c1626;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--muted);padding:7px 13px;font-size:.82rem;font-weight:600;cursor:pointer}
.seg button.on{background:#13304d;color:var(--text)}
/* Periodvalet över kurvorna: fem knappar ska rymmas på en telefon. */
.seg.sm{max-width:100%;overflow-x:auto}
.seg.sm button{padding:6px 10px;flex:0 0 auto}
.histbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:10px}
/* Historikrutan: glider upp nerifrån på telefon, mitt på skärmen på dator. */
.sheet-bg{position:fixed;inset:0;z-index:60;background:#020812b3;display:flex;align-items:flex-end;justify-content:center;
  padding:0 max(0px,env(safe-area-inset-right,0px)) 0 max(0px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:720px;background:#0f1c2e;border:1px solid var(--border);border-bottom:0;border-radius:16px 16px 0 0;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:sheetUp .2s ease}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-head h3{margin:0;font-size:1rem;font-weight:700}
@keyframes sheetUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:861px){.sheet-bg{align-items:center}.sheet{border-radius:16px;border-bottom:1px solid var(--border)}}
/* Värden som går att trycka på för att se historiken. */
.histable{cursor:pointer;border-radius:6px}
.histable:hover{background:#ffffff0d}
.histable .m-v,.histable.val{text-decoration:underline dotted #7dd3fc66;text-underline-offset:4px}
/* Inte live: nedtonat, streckad kant, klocka med åldern. */
.ago{display:inline-flex;align-items:center;gap:4px;color:var(--muted2);font-size:.73rem;font-weight:500}
.card.old{border:1px dashed #8aa2c459;background:#0c1422}
.card.old .m-v,.card.old .val,.card.old .metric .m-v small,.card.old .val small{color:#6f7f96}
.card.old .u-name{color:#a7b4c8}
.card.old .fan,.card.old svg[role=img]{opacity:.55}
.livedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 0 0 #34d39988;animation:livepulse 2s infinite}
@keyframes livepulse{0%{box-shadow:0 0 0 0 #34d39977}70%{box-shadow:0 0 0 6px #34d39900}100%{box-shadow:0 0 0 0 #34d39900}}
@media(prefers-reduced-motion:reduce){.livedot,.sheet{animation:none}}
.readout{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px}
.readout div b{display:block;font-size:1.1rem;color:var(--text)}
.readout div span{color:var(--muted2);font-size:.7rem}
/* inmätningen mot ritningen, under dammen */
.kron-tab{width:100%;border-collapse:collapse;margin-top:10px;font-size:.84rem}
.kron-tab th{color:var(--muted2);font-weight:600;font-size:.72rem;text-align:left;padding:0 6px 6px 0}
.kron-tab td{padding:6px 6px 6px 0;border-top:1px solid var(--border);color:var(--muted)}
.kron-tab td b{color:var(--text)}
/* vattenmätaren och kalibreringarna i Damm-koll */
.mt-tab{font-size:.78rem}
.mt-tab th.r,.mt-tab td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mt-tab td:first-child{white-space:nowrap}
.mt-tab tr.kan{cursor:pointer}
.mt-tab tr.kan:hover td{background:#ffffff08}
.mt-msg{margin:10px 0 0;font-size:.8rem;color:var(--accent)}
.mt-msg.fel{color:#f87171}
.linkbtn.fram{background:#13304d;border-color:#38bdf8;color:var(--text)}
.linkbtn:disabled{opacity:.5}
.xbtn{background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:.85rem;padding:2px 4px}
</style>
</head>

<script>
/* ============================================================
   SIMULERAD DATA  (exempelvärden — ersätts av Firebase senare)
   ============================================================ */
// Pumparna som förser kanonerna maxar på 70 m³/h — det är också det högsta
// flödet UT ur dammen (Kristian, verkligt värde). All vattenflödesskala i appen
// är m³/h, så som snögruppen själv pratar om flöden.
const PUMP_MAX = 70;        // m³/h — verkligt pumptak / dammens maxuttag
// 70 är ABSOLUT max: går uttaget över det börjar pumparna slå av och på. Därför
// siktar snögruppen på högst 69. Allt som planerar eller varnar (rådgivaren,
// mätare, färger) räknar mot målet; taket visas som gränsen man inte får nå.
const PUMP_TARGET = 69;     // m³/h — det vi siktar på som mest
// Läge mot pumpen: 'over' = över taket (pumparna kan börja pendla),
// 'at' = över målet, 'near' = inom 10 % under målet, annars 'ok'.
function pumpState(q){ return q>PUMP_MAX?'over':q>PUMP_TARGET?'at':q>PUMP_TARGET*0.9?'near':'ok'; }
const PUMP_TXT={over:'Över pumptaket — pumparna kan börja slå av och på',
  at:'Över målet 69 — ingen marginal kvar till taket', near:'Nära målet 69 m³/h', ok:'Inom kapacitet'};
// Vattenmagasinets nivå och drifttid räknas numera ur dammodellen (se Damm-koll
// längre ner): damPct() och damDaysAt(m³/h), grundade på byggritningens geometri.

// fmax = enhetens fulla vattenflöde vid rådande förhållanden (m³/h). Summan av
// alla fmax är större än pumptaket 70 m³/h — det är själva poängen: alla kan inte
// köra för fullt samtidigt, utan vattnet måste fördelas. Värdena är exempel,
// skalade så summan ligger realistiskt kring pumptaket tills vi har driftdatan.
let cannons = [
  {id:'K1', typ:'kanon', namn:'Kanon 1', brunn:3,  state:'run',   steg:'8/12', eau:12, air:11.0, tw:-6.4, stryp:0,  fmax:13},
  {id:'K2', typ:'kanon', namn:'Kanon 2', brunn:5,  state:'limit', steg:'5/12', eau:7,  air:7.5,  tw:-6.1, stryp:42, fmax:12},
  {id:'K3', typ:'kanon', namn:'Kanon 3', brunn:8,  state:'run',   steg:'9/12', eau:13, air:11.4, tw:-6.6, stryp:0,  fmax:14},
  {id:'K4', typ:'kanon', namn:'Kanon 4', brunn:11, state:'limit', steg:'4/12', eau:6,  air:6.8,  tw:-5.9, stryp:45, fmax:11},
  {id:'K5', typ:'kanon', namn:'Kanon 5', brunn:14, state:'run',   steg:'7/12', eau:10, air:10.2, tw:-6.3, stryp:15, fmax:12},
  {id:'K6', typ:'kanon', namn:'Kanon 6', brunn:18, state:'off',   steg:'0/12', eau:0,  air:0,    tw:-5.8, stryp:0,  fmax:12},
  {id:'L1', typ:'lans',  namn:'Lans 1',  brunn:6,  state:'run',   steg:'10/12',eau:9,  air:3.1,  tw:-6.2, stryp:0,  fmax:10},
  {id:'L2', typ:'lans',  namn:'Lans 2',  brunn:15, state:'limit', steg:'6/12', eau:5,  air:1.9,  tw:-6.0, stryp:44, fmax:9},
];

let alarms = [
  {id:1, sev:'warn', title:'Kanon 2 — begränsat vattenflöde', meta:'Strypt pga pumpkapacitet · sedan 21:42', ack:false},
  {id:2, sev:'info', title:'Lans 2 — låg lufttemperatur, nära startgräns', meta:'Våttemp -6.0 °C · 22:05', ack:false},
  {id:3, sev:'crit', title:'Pumphus — uttag nära kapacitetstak', meta:'62 m³/h · mål 69, tak 70 · automatisk strypning aktiv', ack:false},
];

/* ============================================================
   RIKTIG DATA
   Utan ?demo i adressen visas bara det bryggan skickat. Listorna ovan töms,
   så att ingen exempelsiffra kan se ut som ett mätvärde medan den riktiga
   datan är på väg in.
   ============================================================ */
const DEMO=/[?&]demo\b/.test(location.search);
let real=!DEMO;
if(real){cannons=[];alarms=[];}
let wx=null, pumps=null, lines=null, events=[], histPts=[], metaLive=null;
// En enhet räknas ha kontakt om styrsystemet hört den inom en kvart, mätt mot
// styrsystemets egen klocka (gssTid) så att en felgående klocka i telefonen
// inte spelar in.
const CONTACT_MS=15*60000;
const parseT=x=>{const d=x?new Date(x):null;return d&&!isNaN(d)?d:null};
// Året skrivs ut när det inte är i år: en kanon som tystnade 2022 ska inte
// se ut att ha hörts i höstas.
const dm=d=>d?d.getDate()+'/'+(d.getMonth()+1)+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'):'okänt';
// Kvitteringar är personliga och sparas i telefonen (docs/anvandarhantering.md).
let acked=new Set(); try{acked=new Set(JSON.parse(localStorage.getItem('snokollAck')||'[]'))}catch(e){}
function saveAck(){try{localStorage.setItem('snokollAck',JSON.stringify([...acked]))}catch(e){}}
const asList=x=>Array.isArray(x)?x.filter(Boolean):Object.values(x||{});

function applyLive(v){
  if(!real)return;
  v=v||{};
  metaLive=v.meta||null;
  // Stämpeln är molnets klocka för bryggans senaste hjärtslag.
  lastData=metaLive&&metaLive.ts?metaLive.ts:0;
  const ref=parseT(metaLive&&metaLive.gssTid), list=[];
  for(const [key,e] of Object.entries(v.enheter||{})){
    if(!e)continue;
    // Kanonen på adress 2 (det äldre kortet) finns inte längre, men ska stå
    // kvar i styrsystemets databas. Appen struntar i den.
    if(key==='SGC300-2')continue;
    const m=/^(SGC\d+)-(\d+)$/.exec(key)||[], old=m[1]==='SGC300', nr=+(m[2]||0);
    const lans=/TAURUS/i.test(e.typ||''), heard=parseT(e.senastHord);
    // Enheterna heter efter Modbus-adressen, som styrsystemets skärm visar
    // och som snögruppen talar om. På SGC400 är adressen n° + 2 (bekräftat
    // mot skärmen Gun searching 25 november); på det äldre kortet är den n°.
    const adr=old?nr:nr+2;
    list.push({key, id:(lans?'L':'K')+adr, typ:lans?'lans':'kanon', nr, adr, old,
      namn:(lans?'Lans ':'Kanon ')+adr, modell:e.typ||'',
      state:(ref&&heard&&Math.abs(ref-heard)<CONTACT_MS)?'conn':'nocon', heard,
      t:e.t, rh:e.rh, tw:e.tw, fmax:Number.isFinite(e.flodeTeori)?e.flodeTeori:null,
      // Flöde och tryck från bryggans version 7. Kanonerna har ingen
      // flödesgivare: q är styrsystemets "Real water flow", räknat ur
      // trycket vid kanonen (teoretiskt × √(tryck/börtryck)), och 0 när den
      // står. Det läggs i ett eget fält och inte i eau, som dammens modell
      // räknar uttaget på — det ska inte ändras utan att någon bestämt det.
      q:Number.isFinite(e.flode)?e.flode:null, tryck:Number.isFinite(e.tryck)?e.tryck:null,
      tryckBor:Number.isFinite(e.tryckBor)&&e.tryckBor>0?e.tryckBor:null,
      // Lamporna som tända bitar ("453:0,1;454:4") eller flaggkolumner
      // ("25,37,65=3") på det äldre kortet. Se LAMPOR.
      bits:typeof e.bitar==='string'?e.bitar:typeof e.flaggor==='string'?e.flaggor:null,
      // Vattnet sedan enheten kom till brunnen och för säsongen (bryggan 8).
      vb:Number.isFinite(e.vattenBrunn)?e.vattenBrunn:null, vs:Number.isFinite(e.vattenSasong)?e.vattenSasong:null,
      brunnSedan:parseT(e.brunnSedan)||null,
      // Brunnen ("Shelter") från bryggans version 6. Läget är kolumn 415:
      // 6 kör (alla fem som gick 26 november), 2 stoppad, 1 fel.
      // Det äldre kortet har ingen lägeskolumn. Där räknas den som körande
      // när vatten går: flödet räknas ur uppmätt tryck och är 0 när den står.
      brunn:Number.isFinite(e.brunn)?e.brunn:null,
      lage:Number.isFinite(e.k415)?e.k415:(old&&e.flode>0?6:null),
      // Inställningarna (bryggan 12): snökvalitet 1-10 och start-/stoppgräns i våttemperatur.
      kval:Number.isFinite(e.kvalitet)?e.kvalitet:null, startT:Number.isFinite(e.startTemp)?e.startTemp:null, stoppT:Number.isFinite(e.stoppTemp)?e.stoppTemp:null,
      // Finns inte i datan än. null och inte 0: noll vore ett påstående.
      eau:null, air:null, steg:null, stryp:0});
  }
  list.sort((a,b)=>a.adr-b.adr);
  cannons=list;
  wx=v.vader?Object.assign({},v.vader,{vind:v.vindStation||null}):null;
  pumps=v.pump||null; lines=v.ledningar||null;
  events=asList(v.handelser);
  // Larmet "SGC300 0 2 general fault" har stått sedan 2024 och gäller kanonen
  // på adress 2, som inte finns längre.
  alarms=asList(v.larm).filter(a=>!/^SGC300_.*_2$/.test(String(a.id))).map(a=>({id:String(a.id), sev:'warn',
    title:[a.maskin,a.namn].filter(Boolean).join(' ')+' — '+(a.text||''),
    meta:'Aktivt sedan '+(a.sedan||'okänt'), ack:acked.has(String(a.id))}));
  if(metaLive&&metaLive.skrivkonto)alarms.push({id:'avsteg',sev:'info',
    title:'Bryggan går med styrsystemets skrivande konto',
    meta:'Tillfälligt avsteg tills läs-only-kontot finns. Bryggan läser bara.',ack:acked.has('avsteg')});
  // Har pushlarmet för samma sak gått ut står det i stället (pushAlarms).
  if(metaLive&&metaLive.sqlOk===false&&!larmlage.sql)alarms.unshift({id:'sqlnere',sev:'crit',
    title:'Bryggan når inte styrsystemets databas',
    meta:'Värdena i appen är de senast lästa.',ack:false});
  alarms.unshift(...pushAlarms());
  liveRefresh();
}

/* ---------- pushlarm ----------
   Larmen räknas fram i molnet (functions/larm.js) och skickas som notiser
   till alla i snögruppen som slagit på dem. Det som pågår står i
   /larmlage/aktiva och visas överst under Larm. Kvittering här är gemensam,
   till skillnad från styrsystemets larm: alla får en tyst notis om vem som
   tar det. Ingenting här styr anläggningen. */
let larmlage={};
const klo=ms=>Number.isFinite(ms)?hhmm(new Date(ms)):'okänt';
function pushAlarms(){
  return Object.entries(larmlage).filter(([,a])=>a&&a.titel).map(([id,a])=>({id:'push-'+id, pid:id, push:true, sev:'crit',
    title:a.titel,
    meta:(a.text?a.text+' ':'')+'Sedan '+klo(a.sedan)+(a.kvitt?' · '+(a.kvitt.namn||'Någon')+' tar det ('+klo(a.kvitt.ts)+')':' · skickat till telefonerna'),
    ack:!!a.kvitt}));
}
function applyLarmlage(v){
  if(!real)return;
  larmlage=v||{};
  alarms=alarms.filter(a=>!a.push&&!(a.id==='sqlnere'&&larmlage.sql));
  alarms.unshift(...pushAlarms());
  liveRefresh();
}
// Telefonens läge för notiser. pa = adressen ligger i /notis för den här
// telefonen. VAPID-nyckeln står i inloggningsskriptet (window.notisNyckel).
let notisSt={pa:false, laddad:false, arbetar:false, msg:'', err:false};
function applyNotis(pa){notisSt.pa=!!pa;notisSt.laddad=true;if(current==='alarms')render();}
function notisHinder(){
  if(!('Notification' in window)||!('serviceWorker' in navigator)||!('PushManager' in window)){
    // iPhone visar bara notiser för en app som lagts på hemskärmen.
    if(/iPhone|iPad|iPod/.test(navigator.userAgent)&&!navigator.standalone)
      return 'På iPhone kommer larmen bara till appen på hemskärmen: tryck Dela → Lägg till på hemskärmen, öppna Snökoll därifrån och slå på larmen där. Det kräver iOS 16.4 eller senare.';
    return 'Den här webbläsaren kan inte ta emot notiser. Prova Chrome, eller appen från hemskärmen.';
  }
  if(!window.notisNyckel)return 'Larmen är inte påslagna i Firebase än — nyckeln för webbnotiser saknas.';
  if(Notification.permission==='denied')return 'Notiser är avstängda för Snökoll i telefonens eller webbläsarens inställningar. Slå på dem där först.';
  return '';
}
async function notisKlick(vad){
  if(notisSt.arbetar||!window.notisGor)return;
  notisSt.arbetar=true;notisSt.msg='';notisSt.err=false;render();
  try{
    await window.notisGor(vad);
    notisSt.msg=vad==='pa'?'Larmen är påslagna på den här telefonen.':vad==='av'?'Larmen är avstängda på den här telefonen.':'Provnotisen är beställd. Den kommer inom någon minut.';
  }catch(e){
    const c=String(e&&e.message||e);
    notisSt.err=true;
    notisSt.msg=c==='nekad'?'Telefonen sa nej till notiser. Slå på dem för Snökoll i inställningarna och försök igen.'
      :c==='stod'?'Den här webbläsaren kan inte ta emot notiser.'
      :'Det gick inte: '+c;
  }
  notisSt.arbetar=false;render();
}
function vNotis(){
  if(!real)return '';
  const hinder=notisHinder(), pa=notisSt.pa&&!hinder;
  const b=(vad,txt,fram)=>`<button class="linkbtn${fram?' fram':''}" style="flex:0 0 auto" ${notisSt.arbetar?'disabled':''} onclick="notisKlick('${vad}')">${txt}</button>`;
  return `<div class="card" style="margin-bottom:16px"><h3>${icon('bell','#7dd3fc',15)} Larm till den här telefonen</h3>
    <div class="row" style="margin-top:10px">
      ${pa?'<span class="chip s-run"><span class="d"></span>Påslagna</span>':'<span class="chip s-off"><span class="d"></span>Avstängda</span>'}
      ${hinder?'':pa?b('prov','Skicka en provnotis')+b('av','Stäng av'):notisSt.laddad?b('pa','Slå på larmen',true):''}
    </div>
    ${hinder?`<p class="muted small" style="margin:10px 0 0;line-height:1.55">${esc(hinder)}</p>`:''}
    ${notisSt.msg?`<p class="small" style="margin:10px 0 0;color:${notisSt.err?'var(--alarm)':'var(--muted)'}">${esc(notisSt.msg)}</p>`:''}
    <p class="muted small" style="margin:10px 0 0;line-height:1.55">Alla i snögruppen får samma larm, dygnet runt: en kanon som stannar, står i fel eller tystnar, bryggan som tystnar, och nya larm i styrsystemet. Vill du ha tyst på natten, använd telefonens Stör ej. Larmen är ett komplement — de styr ingenting, och anläggningens egna skydd gäller som förut.</p>
  </div>`;
}
function applyHist(h){
  if(!real)return;
  histLive=h||{};
  rebuildHist();
}

/* Längre historik (25 november 2026). Bryggan sparar hela säsongen sedan
   version 4, men appen lyssnar bara på det senaste dygnet — det är läsningen
   som kostar, inte lagringen. En längre period hämtas en gång när man väljer
   den, och igen först när man väljer om efter en halvtimme. Valet sparas
   INTE till nästa gång: den som lämnat "Säsong" valt skulle annars hämta
   flera MB varje gång appen öppnas. */
const HIST_RANGES=[{h:24,t:'24 h'},{h:72,t:'3 dygn'},{h:168,t:'Vecka'},{h:720,t:'Månad'},{h:0,t:'Säsong'}];
const SLOT=5*60e3, MAXPTS=600;
let histRange=24, histLive={}, histOld={}, histOldRange=null, histOldAt=0, histTok=0, histLoading=false, histErr='', histInfo='';
// Nyckeln är bryggans femminutersslag i UTC (yyyyMMddHHmm). Kurvorna räknas
// på den och inte på ts, som kommer några sekunder efter slaget och annars
// kan lägga två punkter i samma fack och lämna ett hål bredvid.
const keyMs=k=>Date.UTC(+k.slice(0,4),+k.slice(4,6)-1,+k.slice(6,8),+k.slice(8,10),+k.slice(10,12));
const HIST_F=['t','tw','tryckUt','k125','k126','flodeSum'];
let histUnitF=new Set();
function rebuildHist(){
  histUnitF=new Set();
  const all=Object.assign({},histRange===24?{}:histOld,histLive);
  const keys=Object.keys(all).filter(k=>/^\d{12}$/.test(k)&&all[k]).sort();
  const now=Date.now();
  let from=histRange?now-histRange*3600e3:(keys.length?keyMs(keys[0]):now);
  // Fler än 600 punkter gör inte kurvan tydligare på en telefon, bara
  // långsammare. Långa perioder visas därför som medelvärden, i fack som är
  // jämna steg (20 min, 2 h …) och ligger på jämna slag.
  const need=(now-from)/MAXPTS/60e3;
  const step=([5,10,15,20,30,60,120,180,360,720,1440].find(m=>m>=need)||1440)*60e3;
  from=Math.floor(from/step)*step;
  const n=Math.ceil((now-from)/step)+1, acc=Array.from({length:n},()=>({c:{},s:{}}));
  for(const k of keys){
    const i=Math.floor((keyMs(k)-from)/step); if(i<0||i>=n)continue;
    const p=all[k], a=acc[i], add=(f,v)=>{if(Number.isFinite(v)){a.s[f]=(a.s[f]||0)+v;a.c[f]=(a.c[f]||0)+1;}};
    for(const f of HIST_F)add(f,f==='k125'?ft01(p[f],keyMs(k)):p[f]);
    // Enheternas värden (bryggan 5) ligger under e, och plattas ut till
    // "SGC400-3.tw" — samma namn som historikrutan frågar efter.
    if(p.e)for(const [u,o] of Object.entries(p.e))if(o)for(const [f,v] of Object.entries(o)){add(u+'.'+f,v);
      // Snön vid brunnen räknas ur vattnet (vb), så att faktorn bara står på ett ställe.
      if(f==='vb')add(u+'.sno',sno(v));}
    for(const f in a.c)if(!HIST_F.includes(f))histUnitF.add(f);
  }
  // Tomma fack blir hål i kurvan — där har bryggan inte hörts. Tomt i början
  // betyder bara att historiken inte gick så långt tillbaka, och klipps bort.
  let pts=acc.map((a,i)=>{const o={ts:from+i*step,n:Object.keys(a.c).length};
    for(const f of HIST_F)o[f]=a.c[f]?+(a.s[f]/a.c[f]).toFixed(2):null;
    for(const f of histUnitF)o[f]=a.c[f]?+(a.s[f]/a.c[f]).toFixed(2):null;return o;});
  // Det sista facket är det pågående, som bryggan inte hunnit fylla än.
  if(pts.length&&!pts[pts.length-1].n)pts.pop();
  const first=pts.findIndex(p=>p.n);
  histPts=first<0?[]:pts.slice(first);
  const info=[];
  if(histLoading)info.push('Hämtar historiken …');
  else if(histErr)info.push(histErr);
  else if(histRange!==24&&histPts.length&&(histRange===0||first*step>step))
    info.push('Sparat sedan '+fmtDay(new Date(histPts[0].ts)));
  if(step>SLOT&&histPts.length)info.push('medelvärde per '+(step<3600e3?step/60e3+' min':(step/3600e3).toLocaleString('sv-SE',{maximumFractionDigits:1})+' h'));
  histInfo=info.join(' · ');
  liveRefresh();
  drawSheet();
}
const fmtDay=d=>d.getDate()+' '+['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'][d.getMonth()];
function setHistRange(h){
  histRange=h; histErr='';
  if(h===24||!real||!window.loadHist){histLoading=false;rebuildHist();return;}
  const covers=histOldRange!==null&&(histOldRange===0||(h!==0&&histOldRange>=h));
  if(covers&&Date.now()-histOldAt<30*60e3){rebuildHist();return;}
  const tok=++histTok;
  histLoading=true; rebuildHist();
  window.loadHist(h).then(v=>{if(tok!==histTok)return;histOld=v||{};histOldRange=h;histOldAt=Date.now();},
    ()=>{if(tok===histTok)histErr='Kunde inte hämta historiken. Försök igen.';})
    .finally(()=>{if(tok!==histTok)return;histLoading=false;rebuildHist();});
}
/* Historikrutan (25 november 2026): tryck på ett värde och se dess kurva.
   Samma periodval och samma hämtning som kurvorna i vyerna. Enheternas
   värden finns i historiken först från bryggans version 5. */
let sheet=null;   // {f:'tw' eller 'SGC400-3.tw', title, unit}
function openHist(f,title,unit){
  if(!real)return;
  sheet={f,title,unit};
  let el=document.getElementById('histSheet');
  if(!el){el=document.createElement('div');el.id='histSheet';el.className='sheet-bg';
    el.onclick=e=>{if(e.target===el)closeHist()};document.body.appendChild(el);}
  el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sheet-head"><h3>${esc(title)}</h3><button class="linkbtn" onclick="closeHist()" aria-label="Stäng">Stäng</button></div>
    <div id="sheetSeg"></div><div id="sheetBody"></div></div>`;
  document.addEventListener('keydown',sheetKey);
  drawSheet();
}
function sheetKey(e){if(e.key==='Escape')closeHist()}
function closeHist(){
  sheet=null; document.removeEventListener('keydown',sheetKey);
  if(charts.cHist){charts.cHist.destroy();delete charts.cHist;}
  const el=document.getElementById('histSheet'); if(el)el.remove();
}
function drawSheet(){
  if(!sheet)return;
  const seg=document.getElementById('sheetSeg'), body=document.getElementById('sheetBody'); if(!seg||!body)return;
  seg.innerHTML=histSeg();
  // Klipp bort tomt i början: för en enhet är det tiden innan bryggan
  // började spara enheternas värden, inte ett avbrott.
  const first=histPts.findIndex(p=>Number.isFinite(p[sheet.f]));
  const pts=first<0?[]:histPts.slice(first);
  if(pts.length<2){
    if(charts.cHist){charts.cHist.destroy();delete charts.cHist;}
    body.innerHTML=`<p class="muted small" style="margin-top:14px;line-height:1.6">${histLoading?'Hämtar …':sheet.f.includes('.')
      ?'Ingen historik för den här enheten under perioden. Enheternas värden sparas sedan bryggans version 5, och bara när styrsystemet hör enheten.'
      :'Ingen historik för det här värdet under perioden.'}</p>`;
    return;
  }
  if(!document.getElementById('cHist'))body.innerHTML='<div class="chartbox" style="margin-top:12px"><canvas id="cHist"></canvas></div>';
  const ts=pts.map(x=>new Date(x.ts)), d=pts.map(x=>Number.isFinite(x[sheet.f])?x[sheet.f]:null);
  const ds=[series(d,sheet.title,'#38bdf8')];
  if(/(^|\.)tw$/.test(sheet.f))ds.push(flat(ts.length,FTHRESH,'Startgräns','#fbbf2499'));
  chart('cHist',ts,ds,chOpts(ts,sheet.unit,histTick(ts)));
}
// Ett värde som går att trycka på. stopPropagation: på enhetskortet öppnar
// ett tryck annars hela enhetsvyn i stället.
// Klassen "histable" (prickad understrykning) läggs till för hand där
// elementet redan har en klass.
const histAttr=(f,title,unit)=>real?` onclick="event.stopPropagation();openHist('${esc(f)}','${esc(title)}','${esc(unit)}')" title="Visa historiken"`:'';
const HC=real?' histable':'';

/* Gamla värden. Ett värde som inte är live tonas ned och får en klocka med
   hur gammalt det är — det ska inte gå att tro att en kanon kör för att
   dess sista siffror står kvar. Gult och rött sparas till larm. */
const bridgeOld=()=>real&&(!lastData||(Date.now()-lastData)/1000>STALE_S);
function ago(t){
  if(!t)return 'okänt när';
  const m=Math.round((Date.now()-t)/60000);
  if(m<2)return 'nyss';
  if(m<60)return 'för '+m+' min sedan';
  if(m<48*60)return 'för '+Math.round(m/60)+' h sedan';
  return 'för '+Math.round(m/1440)+' dygn sedan';
}
const agoHTML=(t,abs)=>`<span class="ago" title="${esc(abs||'')}">${icon('clock','currentColor',12)} ${ago(t)}</span>`;

const histSeg=()=>real?`<div class="histbar"><div class="seg sm">${HIST_RANGES.map(r=>`<button class="${histRange===r.h?'on':''}" onclick="setHistRange(${r.h})">${r.t}</button>`).join('')}</div>${histInfo?`<span class="muted small">${histInfo}</span>`:''}</div>`:'';
// Ny data ritar om vyn, men inte medan någon skriver i ett fält (dammen) och
// inte kartan, som annars hoppar tillbaka till utgångsläget.
function liveRefresh(){
  if(document.getElementById('app').classList.contains('hidden'))return;
  const typing=document.activeElement&&/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
  if(current!=='map'&&!typing)safeRender(true);
  else{refreshLive(); if(current==='map')drawMapUnits();}
}

function fanSVG(run,fast){return `<svg width="22" height="22" viewBox="0 0 24 24" fill="#7dd3fc" class="fan ${run?('spin'+(fast?' fast':'')):''}"><circle cx="12" cy="12" r="2.1"/><path d="M12 10c0-3 .5-6-1.5-7.5C8 4 9 7 12 10zM12 14c0 3-.5 6 1.5 7.5C16 20 15 17 12 14zM10 12c-3 0-6-.5-7.5 1.5C4 16 7 15 10 12zM14 12c3 0 6 .5 7.5-1.5C20 8 17 9 14 12z"/></svg>`}

const STATE={run:['s-run','Körs'],standby:['s-standby','Redo'],limit:['s-limit','Strypt'],alarm:['s-alarm','Larm'],off:['s-off','Av'],
  // "Kontakt" i blått såg ut som att enheten körde. Det betyder bara att
  // styrsystemet hört den de senaste 15 minuterna; om den kör läses inte.
  conn:['s-standby','Hörs'],nocon:['s-off','Tyst']};
/* Två skydd inför riktig data. Texter ur styrsystemets databas (namn, larm)
   är fritext och får aldrig tolkas som HTML — esc() gör dem ofarliga. Och ett
   värde som saknas (en kanon utan kontakt) ska visas som ett streck, inte
   krascha hela vyn så att sidan fryser med gamla siffror. */
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const num=(v,d=1)=>Number.isFinite(v)?v.toLocaleString('sv-SE',{minimumFractionDigits:d,maximumFractionDigits:d}):'–';
function chip(st){const[c,l]=STATE[st]||['s-off',esc(st)];return `<span class="chip ${c}"><span class="d"></span>${l}</span>`}
// Läget (kolumn 415) visas bara när enheten hörs och bryggan går: en enhet
// som försvinner behåller sitt sista läge i tabellen, och "Fel" på en
// urkopplad kanon vore lika fel som "Hörs". 11 betyder troligen OK och visas
// som "Hörs" — vi vet inte om enheten kör.
const LAGE={1:['s-alarm','Fel'],2:['s-off','Stoppad'],6:['s-run','Kör']};
/* Snömängd = vatten × 1,5, uppmätt. Styrsystemet räknar med 2,2 ("Flows m³/h:
   Water 41, Snow 90,2", och statistiken för Råda 2023 med 2,20 överallt),
   alltså snö på ungefär 455 kg/m³ utan svinn. Högen vid brunn 5 (kanon 8)
   mättes med pucken 27 november: 190 ± 15 m³ snö, plus troligen 10–20 m³ i
   skogskanten, på 133 m³ räknat vatten. Det blir 1,4–1,6 (Kristian valde 1,5
   den 28 november). Faktorn gäller kanonernas räknade vatten, som var
   108–115 % av dammens minskning 24–27 november enligt flytpunkten (cirka
   120 % av rättat FT01). Den bygger på en hög och
   en mätning. Bryggan summerar bara vattnet, så faktorn kan bytas här. */
const SNO_FAKTOR=1.5;
const sno=v=>Number.isFinite(v)?v*SNO_FAKTOR:null;
/* Lamporna. Facit är Sufags egna kolumnbeskrivningar, som sonden läste på
   styrdatorn 28 november (version 3, del 7).
   Det äldre kortet (SGC300) har en kolumn per lampa, och bryggan skickar de
   tända som "25,37,42,43,44,65=3". Alla namn nedan är Sufags, kolumn för
   kolumn: säkra. 26 november, gående, var 25, 37, 42, 43 och 44 tända
   (automatik, 2 ringar, kompressor, fläkt, redo), som på skärmen.
   SGC400 har lamporna som bitar i "Mot Etat 1-2" (453-454), "Défaut 1-2"
   (450-451) och så vidare; bryggan skickar "453:0,1,5;454:0,4". Vad varje
   bit är står inte i databasen. 453 bit 11 och 12 följer flödet som två
   vattensteg: för kanon 8 26-28 november gav bara bit 11 cirka 5,1 m³/h,
   bara bit 12 cirka 6,5 och båda cirka 8,3. Det är tolkat ur flödet, inte
   jämfört med skärmens Ring 1-4, och visas så. 453 bit 0 och 1 är tända
   hela tiden kanonen går; de visades förut som ring 1 och 2. */
const LAMPOR={
  SGC300:{
    ringar:[[35,0],[36,1],[37,2],[38,3],[39,4]],     // "0-4 rings open"
    lampor:[{n:'Automatik',b:'25',s:'Man - Auto'},{n:'Startad',b:'29',s:'Gun started'},{n:'Ström',b:'30',s:'Power ON'},
            {n:'Hydrant OK',b:'28',s:'Hydrant OK'},{n:'Hydrant öppen',b:'33',s:'Hydrant open'},{n:'Hydrant stängd',b:'34',s:'Hydrant closed'},
            {n:'Pressostat',b:'27',s:'Pressostat'},{n:'Kompressor',b:'42',s:'Compressor ON'},{n:'Fläkt',b:'43',s:'Fan ON'},
            {n:'Redo att starta',b:'44',s:'Ready to start (temp OK)'}],
    fel:[{n:'Allmänt fel',b:'26'},{n:'Överreglering',b:'67'},{n:'Lågt lufttryck',b:'68'},{n:'Startfel',b:'69'},{n:'Stoppfel',b:'70'},
         {n:'Slangen frusen',b:'71'},{n:'Slangen urkopplad',b:'72'},{n:'Lågt vattentryck',b:'73'},{n:'Hydrantfel',b:'74'},
         {n:'Fläkten överbelastad',b:'75'},{n:'Kompressorn överbelastad',b:'76'},{n:'Överlastskydd',b:'77'},{n:'Fel 380 V',b:'78'},
         {n:'Fel 4–20 mA',b:'79'},{n:'Hydranten urkopplad',b:'80'},{n:'Smutsigt filter',b:'81'}]
  },
  SGC400:{
    steg:[{n:'Litet steg',b:'453:11'},{n:'Stort steg',b:'453:12'}]   // tolkat ur flödet
  }
};
function bitSet(s){const o=new Set();if(!s||s==='0')return o;
  if(/:/.test(s)){for(const g of s.split(';')){const[c,l]=g.split(':');(l||'').split(',').forEach(b=>b!==''&&o.add(c+':'+b));}}
  else s.split(',').forEach(x=>x&&o.add(x.split('=')[0]));
  return o;}
function snoPanel(c){
  if(c.vb==null)return missing('Snömängden per kanon kommer när bryggan på styrdatorn är version 8.');
  const t=c.brunn?'brunn '+c.brunn:'brunnen';
  return `<div class="grid g-2" style="margin-top:14px">
    <div class="card kpi${HC}"${histAttr(c.key+'.sno','Snö vid '+t+' (vatten × '+num(SNO_FAKTOR)+')','m³')}><h3>❄ Snö vid ${t}</h3><div class="val">${num(sno(c.vb),0)}<small> m³</small></div>
      <div class="foot">${num(c.vb,1)} m³ vatten${c.brunnSedan?' sedan '+dm(c.brunnSedan):''}</div></div>
    <div class="card kpi"><h3>❄ Snö i säsongen</h3><div class="val">${num(sno(c.vs),0)}<small> m³</small></div>
      <div class="foot">${num(c.vs,0)} m³ vatten, alla brunnar</div></div>
  </div>
  <p class="muted small" style="margin:8px 2px 0;line-height:1.6">Snö = vatten × ${num(SNO_FAKTOR)}, uppmätt med pucken på högen vid brunn 5 den 27 november. Styrsystemet räknar med 2,2. Ingen kanon mäter snö. Räkneverket vid brunnen börjar om när enheten kopplas till en annan brunn. Bryggan räknar själv sedan 26 november 09:53; tiden före är hämtad i efterhand ur styrsystemets statistik och journalens inkopplingar. Kurvan börjar 09:53. Tryck på snön vid brunnen för den.</p>`;
}
function lampPanel(c){
  if(c.bits==null)return missing('Lamporna (ringar, hydrant, kompressor …) kommer när bryggan på styrdatorn är version 7.');
  const on=bitSet(c.bits), live=c.state==='conn'&&!bridgeOld(), lit=b=>live&&on.has(b);
  const ch=(t,b,title,kl='s-run')=>`<span class="chip ${lit(b)?kl:'s-off'}" title="${esc(title)}"><span class="d"></span>${t}</span>`;
  const rad=x=>`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">${x}</div>`;
  // Inställningarna kommer med bryggan 12 (Sufags kolumner 704/702/703, på det äldre kortet 16/9).
  const inst=Number.isFinite(c.kval)?`<p class="muted small" style="margin:10px 0 0;line-height:1.6">Snökvalitet <b style="color:var(--text)">${c.kval}</b> (1 torr – 10 blöt)${Number.isFinite(c.startT)?` · startar under ${num(c.startT,1)} °C`:''}${Number.isFinite(c.stoppT)?` · stannar över ${num(c.stoppT,1)} °C`:''} våttemperatur, som den är inställd i styrsystemet.</p>`:'';
  let body;
  if(c.typ==='lans')body=`<p class="muted small" style="margin:10px 0 0">Lansarnas dyssteg är inte utpekade än.</p>`;
  else if(c.old){
    const M=LAMPOR.SGC300, r=M.ringar.filter(([b])=>lit(String(b))).map(([,n])=>n), fel=M.fel.filter(f=>lit(f.b));
    body=`<p class="muted small" style="margin:10px 0 0">Öppna ringar: <b style="color:var(--text)">${!live?'okänt just nu':r.length?r.join(', '):'ingen lampa tänd'}</b></p>
      ${rad(M.lampor.map(l=>ch(l.n,l.b,'Skärmen: '+l.s)).join(''))}
      ${fel.length?rad(fel.map(f=>ch(f.n,f.b,'Fellampa','s-alarm')).join('')):''}
      <p class="muted small" style="margin:10px 0 0;line-height:1.6">Namnen är Sufags egna, kolumn för kolumn (styrsystemets beskrivningar, 28 november).</p>`;
  }else{
    const M=LAMPOR.SGC400;
    body=`${rad(M.steg.map(l=>ch(l.n+' ?',l.b,'Tolkat ur flödet: bit '+l.b)).join(''))}
      <p class="muted small" style="margin:10px 0 0;line-height:1.6">Två extra vattensteg ovanpå grundsteget, tolkade ur flödet: för kanon 8 gav bara det lilla steget cirka 5 m³/h, bara det stora cirka 6,5 och båda cirka 8,3. Inte jämfört med skärmens Ring 1–4 än. Vad SGC400:s övriga bitar betyder står inte i styrsystemets databas.</p>`;
  }
  return `<div class="card${live?'':' old'}" style="margin-top:14px"><h3>${icon('sliders','#7dd3fc',15)} Ringar och lampor</h3>${body}${inst}
    <p class="muted small" style="margin:12px 0 0;line-height:1.6">Tända bitar just nu:</p>
    <div style="font-family:ui-monospace,Consolas,monospace;font-size:.78rem;color:var(--muted2);margin-top:6px;word-break:break-all">${esc(c.bits==='0'||c.bits===''?'inga':c.bits)}</div></div>`;
}
function uchip(c){
  if(real&&c.state==='conn'&&!bridgeOld()&&LAGE[c.lage]){const[k,l]=LAGE[c.lage];
    return `<span class="chip ${k}" title="Tolkat ur styrsystemets kolumn 415"><span class="d"></span>${l}</span>`;}
  return chip(c.state);
}

/* ---------- derived ---------- */
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
function totalWater(){return +sum(cannons,c=>c.eau).toFixed(1)}
function running(){return cannons.filter(c=>real?c.state==='conn':c.state!=='off')}
function activeAlarms(){return alarms.filter(a=>!a.ack)}

}

/* Hård regel: gammal data får aldrig se live ut. Stämpeln visar klockslaget
   för senaste värdet och slår om till varning när det är äldre än 90 s —
   då har bryggan eller nätet tystnat. (I prototypen kommer "värdena" från
   simuleringen var femte sekund.) */
let lastData=real?0:Date.now();
// Bryggan skickar ett hjärtslag i minuten, så 90 s vore för snålt med riktig
// data: ett enda försenat slag skulle slå om stämpeln till varning.
const STALE_S=real?150:90;
function liveHTML(){
  if(!lastData)return `<span class="live stale" id="liveChip">Väntar på data</span>`;
  const d=new Date(lastData), t=hhmm(d)+':'+String(d.getSeconds()).padStart(2,'0');
  return (Date.now()-lastData)/1000>STALE_S
    ? `<span class="live stale" id="liveChip">⚠ Gammal data · senast ${t}</span>`
    : `<span class="live" id="liveChip"><span class="dot"></span>Live · ${t}</span>`;
}
function refreshLive(){const e=document.getElementById('liveChip');if(e)e.outerHTML=liveHTML();}
function topbar(crumb,title,extra=''){
  return `<div class="topbar"><div><div class="crumb">${crumb}</div><h2>${title}</h2></div>
    <div class="row">${extra}${liveHTML()}</div></div>`;
}

/* ============================================================
   MEDLEMMAR — bara för administratörer
   Vyn göms för andra, men det är inte skyddet: databasens regler släpper bara
   igenom en administratörs ändringar under /members. Formuläret finns för att
   konsolen är lätt att göra fel i — ett stort F eller en punkt som blev kvar
   ger en rad som ser rätt ut men inte släpper in någon.
   ============================================================ */
let isAdmin=false, myKey='', members=null, memMsg='', memErr=false, memArm='', memArmT=0;
let memForm={email:'',name:'',role:'viewer'};
// Samma omskrivning som i reglerna: gemener, och varje punkt blir ett komma.
const emailKey=e=>String(e).trim().toLowerCase().split('.').join(',');
const keyEmail=k=>String(k).split(',').join('.');
function setAdmin(b,key){
  const was=isAdmin; isAdmin=!!b; myKey=key||'';
  if(!isAdmin){members=null; if(current==='members')current='overview';}
  if(was!==isAdmin&&!document.getElementById('app').classList.contains('hidden'))safeRender(true);
}
function applyMembers(o){members=o||{}; if(current==='members')liveRefresh();}
function memSay(t,err){memMsg=t;memErr=!!err;render();}
async function memWrite(key,data,done){
  try{await window.memberWrite(key,data);memSay(done,false);}
  catch(e){memSay('Databasen sa nej. Är du fortfarande administratör? ('+(e&&e.code||e)+')',true);}
}
function memAdd(){
  const email=memForm.email.trim(), name=memForm.name.trim(), role=memForm.role==='admin'?'admin':'viewer';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return memSay('Skriv hela e-postadressen, till exempel anna.andersson@gmail.com.',true);
  // Tecken som inte får stå i en nyckel i databasen (punkten byts ut, de här går inte).
  if(/[#$\[\]\/,]/.test(email))return memSay('Adressen innehåller ett tecken som inte går att spara (# $ [ ] / eller komma).',true);
  if(!name)return memSay('Skriv ett namn, så att listan går att läsa om ett år.',true);
  const key=emailKey(email);
  if(members&&members[key])return memSay(keyEmail(key)+' står redan i listan.',true);
  const d=new Date(), added=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  memForm={email:'',name:'',role:'viewer'};
  memWrite(key,{role,name,added},keyEmail(key)+' är tillagd. Åtkomsten gäller direkt — be personen logga in med Google.');
}
// Två tryck för det som tar bort eller ändrar åtkomst (inbyggda frågerutor
// visas inte i alla webbläsare, och då ser knappen bara död ut).
function memAsk(what,key){
  const tag=what+':'+key;
  if(memArm!==tag){memArm=tag;clearTimeout(memArmT);memArmT=setTimeout(()=>{memArm='';if(current==='members')render();},5000);render();return;}
  memArm='';clearTimeout(memArmT);
  // Spärren står här också, inte bara i att knapparna saknas på den egna raden.
  if(key===myKey)return memSay('Du kan inte ändra din egen rad — då kan gruppen bli utan administratör.',true);
  const m=members&&members[key]; if(!m)return render();
  if(what==='del')memWrite(key,null,keyEmail(key)+' är borttagen. Det gäller direkt.');
  else memWrite(key,Object.assign({},m,{role:what==='admin'?'admin':'viewer'}),keyEmail(key)+(what==='admin'?' är nu administratör.':' är nu vanlig medlem.'));
}

/* Pumphuset ritat som på styrsystemets egen skärm (MR1), med varje värde
   vid sin givare. Pumparna sitter i SERIE: P1 matar ur intagsbrunnen, P2
   trycker ut. Förut stod de som två rutor bredvid varandra, och det gick
   inte att förstå varför den ena visade 0,1 bar och den andra 7. Givarnas
   namn (PT01 …) är styrsystemets, så att skissen går att jämföra med
   skärmen i pumphuset. */
// FT01 = kolumn 125 i Water departure (dep12), utpekad 25 november när
// pumparna startade. Mätaren misstänks visa ungefär hälften; värdet visas
// orättat tills det kontrollerats mot dammen.
/* FT01 är fel inställd (avläst 28 november): omvandlaren saknar SENSORPROM
   och går på DN 40 med kalibreringsfaktorn 1,9634950, medan givaren i röret
   är DN 65 med 3,552451. Den visar därför 55 % av flödet. Felet är linjärt
   (FT01 / kanonernas summa 0,44–0,48 i alla flödesband 3–56 m³/h), och
   rättat stämde det inom 1 % med måttbandet 24–27 november. Appen rättar
   därför med 3,552451 / 1,9634950 = 1,809 (Kristian, 28 november).
   NÄR OMVANDLAREN ÄR INSTÄLLD: sätt FT01_RATTAD till tiden då det gjordes.
   Värden efter den visas som mätaren säger, äldre fortsätter att rättas. */
const FT01_FAKTOR=3.552451/1.9634950;
const FT01_RATTAD=null;   // till exempel Date.parse('2026-12-02T10:00:00+01:00')
const ft01Fel=(t=Date.now())=>FT01_RATTAD==null||t<FT01_RATTAD;
const ft01=(v,t=Date.now())=>Number.isFinite(v)?(ft01Fel(t)?v*FT01_FAKTOR:v):null;
const FT01_T=ft01Fel()?'Flöde ut, FT01 (rättat × 1,81: omvandlaren har fel kalibreringsfaktor)':'Flöde ut, FT01';
/* TT01 mäter det strömmande vattnet. Står pumparna (FT01 under 2 m³/h; den
   visar 0,1 när allt står) visar den vattnet som står i röret, och då blir
   värdet grått. Bryggan 12 skickar senaste värdet medan vattnet gick
   (vattenTempDrift, och -Tid med minuter i styrdatorns tid). */
const pumpGar=p2=>!!p2&&Number.isFinite(p2.k125)&&p2.k125>=2;
const tt01Still=p2=>real&&!!p2&&Number.isFinite(p2.vattenTemp)&&!pumpGar(p2);
const tt01Drift=p2=>p2&&Number.isFinite(p2.vattenTempDrift)?{v:p2.vattenTempDrift,tid:parseT(p2.vattenTempDriftTid)}:null;
function tt01Rad(p2){
  if(!tt01Still(p2))return '';
  const d=tt01Drift(p2);
  return `<p class="muted small" style="margin:8px 0 0;line-height:1.55">TT01 ${num(p2.vattenTemp,1)} °C <b style="color:var(--text)">(senast vid drift ${d?num(d.v,1)+' °C, '+dm(d.tid):'inte känd än'})</b>. Pumparna står, så givaren visar vattnet som står i röret.</p>`;
}

  </svg></div>${pumpSVGtall(p1,p2,L,LO,HI,pump)}`;

    ${pump(200,260,HI,'')}${lbl(176,256,'P2','end')}${sub(176,271,'högtryckspump','end')}
    ${tag(268,290,'TT01',p2.vattenTemp,'°C',1,null,null,tt01Still(p2))}

    ${tag(268,382,'FT01',ft01(p2.k125),'m³/h',1,'k125',FT01_T)}

/* ============================================================
   DAMM-KOLL — digital tvilling av vattenmagasinet vid Råda ås
   Geometrin är förankrad i byggritningen M16.1-0000 (Snixåsen, 2019-03-12):
   krön 36,5×44,5 m, lutning 1:1,5, djup 3,5 m, och 3543 m³ till ursprungligt
   bräddavlopp (+0 m) — ritningens egen siffra. Botten 26×34 m följer av krön
   minus slänt. Volymen räknas med den EXAKTA formeln för tvärsnittet (bredd och
   längd växer olika snabbt, så Geminis frustum-formel är en approximation —
   skillnaden är <1 m³, men den exakta är lika enkel):
        V(h) = 884·h + 90·h² + 3·h³     (h = vattendjup i m, 0..3,5)
   Snorkeln är anläggningens eget bräddavlopp, höjt jämfört med ritningen.
   Den mättes mot vattenytan 24 november 2026 (KANT nedan) och sitter på
   3,37 m, så 100 % är ca 4 110 m³. Förut antogs ritningens bräddrör plus
   20 cm, alltså 3,20 m och 3 850 m³. Det var därför vattenmätaren på
   påfyllningen visade ungefär 200 m³ mer än modellen.

   Krönet mättes in 22 november 2026 (KRON nedan, bara planen). Måtten i plan
   stämmer med ritningen: 36,65×44,67 m i stället för 36,5×44,5 skulle bara
   ge knappt 40 m³ mer till snorkeln, så formeln står kvar. Det som skiljer är
   höjden, där 10 cm är ca 160 m³. Höjderna kommer från mätningen 24 november,
   där krönet och vattenytan mättes på samma ställe. De fyra hörnens medel
   räknas som ritningens 3,50 m. Botten är inte mätt, och vattenmätaren är
   kontrollen. Måttbandet läses från det ställe man mätt vid.
   (Förut: ATV:ns höjder 22 november, och före det ”normalt krön” 3,50 och
   ett ”10 cm lägre hörn” 3,40, ur minnet.)
   ============================================================ */
const DAM={slope:1.5, hMax:3.50};                    // hMax = krönets medel i de fyra hörnen
const SF=Math.sqrt(1+DAM.slope*DAM.slope);          // släntfaktor 1,80278
const volAt=h=>884*h+90*h*h+3*h*h*h;                // exakt, m³
const areaAt=h=>(26+3*h)*(34+3*h);                  // vattenytans area, m²
function hFromVol(v){                               // invers via binärsökning
  if(v<=0)return 0; if(v>=volAt(DAM.hMax))return DAM.hMax;
  let lo=0,hi=DAM.hMax; for(let i=0;i<44;i++){const m=(lo+hi)/2; volAt(m)<v?lo=m:hi=m;} return (lo+hi)/2;
}

/* Krönet mot vattenytan, inmätt 24 november 2026 med GPS:en i en låda som
