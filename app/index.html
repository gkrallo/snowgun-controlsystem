/* ============================================================
   KÖRFÖNSTER — prognosen, räknad som i Snöprognos
   Samma väderdata (Open-Meteo, samma punkt), samma våttemperatur
   (psykrometrisk, Buck 1996), samma startgräns, kvalitetslinje, kapacitet,
   vindgränser och sidodrift som i snowgun-forecast/index.html (avsnitt 2–7).
   Ändras något där ska det ändras här också.

   Det som skiljer: spåret och brunnarna är Snökolls egna (TRACK, WELLS), och
   med enheter vid brunnarna räknas tvärvinden där de står — som Snöprognos
   gör med utplacerade kanoner. Ingen kalibrering mot väderstationen: den
   visar 0,3–1,7 grader för varmt och ojämnt, så en fast rättning vore fel.
   Prognosen sparas aldrig i telefonen. Den hämtas när vyn öppnas och var
   30:e minut, och det står alltid när den hämtades.
   ============================================================ */
// Snöprognos förval (DEFAULTS). Vattnet och kvaliteten går att ändra i vyn.
const KF={fanBase:FTHRESH, lanceBase:-4.0, windWarn:5, windStop:9, trailWidth:8,
  fanHeight:5, fanDist:30, lanceHeight:7, lanceDist:8};
// Spårets mittpunkt, samma punkt som Snöprognos använder för Sparbanksspåret.
const KF_PLATS={lat:TRACK.centre[0], lon:TRACK.centre[1]};
const KF_ORD=['','torr puder','torr snö','torr snö','lätt allround','allroundsnö','allroundsnö','fuktig snö','blöt snö','bassnö','blöt bassnö'];
// Per telefon, som inställningarna i Snöprognos. Inga mätvärden.
let kfVal={q:5, vt:1.5};
try{const s=JSON.parse(localStorage.getItem('snokollKorf')||'{}');
  if(s.q>=1&&s.q<=10)kfVal.q=Math.round(s.q); if(Number.isFinite(s.vt)&&s.vt>=0&&s.vt<=15)kfVal.vt=s.vt;}catch(e){}
function kfSet(k,v){
  v=parseFloat(String(v).replace(',','.')); if(!Number.isFinite(v))return render();
  if(k==='q')kfVal.q=Math.max(1,Math.min(10,Math.round(v)));
  if(k==='vt')kfVal.vt=Math.max(0,Math.min(15,Math.round(v*10)/10));
  try{localStorage.setItem('snokollKorf',JSON.stringify(kfVal))}catch(e){}
  render();
}

/* --- våttemperatur: psykrometrisk jämvikt, mättnadsångtryck enligt Buck 1996 --- */
const satVP=T=>6.1121*Math.exp((18.678-T/234.5)*T/(257.14+T));
function wetBulb(T,rh,P){
  if(!Number.isFinite(T)||!Number.isFinite(rh))return NaN;
  P=Number.isFinite(P)?P:1013.25;
  const e=Math.max(0.01,rh/100*satVP(T));
  const res=Tw=>satVP(Tw)-6.53e-4*(1+0.000944*Tw)*P*(T-Tw)-e;
  let lo=T-45,hi=T; if(res(lo)>0)return lo;
  for(let i=0;i<60;i++){const m=(lo+hi)/2; if(res(m)<0)lo=m; else hi=m;}
  return (lo+hi)/2;
}

/* --- gränser och kapacitet --- */
// Torrare snö kräver kallare: 0,4 grader per steg under 10 (bassnö).
const qualityOffset=q=>(10-q)*0.40;
// Varmt vatten skjuter startgränsen nedåt, 0,15 grader per grad över 0,5.
const waterOffset=w=>Math.max(0,w-0.5)*0.15;
function thresholds(){
  const w=waterOffset(kfVal.vt), q=qualityOffset(kfVal.q);
  return {base:KF.fanBase-w, target:KF.fanBase-w-q, lance:KF.lanceBase-w, lanceTarget:KF.lanceBase-w-q, quality:q, water:w};
}
// Andel av vad kanonen klarar, mättar mot 100 % ungefär 5 grader under gränsen.
// Säger hur mycket av maxflödet som går, inte hur mycket snö det blir per vatten.
function capacity(wb,th,vt){
  if(!Number.isFinite(wb)||wb>th)return 0;
  const base=100*(1-Math.exp(-(th-wb)/1.9)), pen=1-Math.min(0.35,Math.max(0,vt-0.5)*0.015);
  return Math.max(0,Math.min(100,base*pen));
}
function achievableQuality(wb,vt){
  const m=KF.fanBase-waterOffset(vt)-wb; if(m<0)return null;
  return Math.max(1,Math.min(10,Math.round(10-m/0.40)));
}

/* --- vind och sidodrift --- */
const toRad=d=>d*Math.PI/180, normDeg=d=>((d%360)+360)%360;
const DIRS16=['N','NNO','NO','ONO','O','OSO','SO','SSO','S','SSV','SV','VSV','V','VNV','NV','NNV'];
const dirName=d=>Number.isFinite(d)?DIRS16[Math.round(normDeg(d)/22.5)%16]:'–';
// Tvärvinden mot en sträcka med bäringen b. Vindriktningen är varifrån det blåser.
const crossOf=(wind,dir,b)=>Math.abs(wind*Math.sin(toRad(normDeg(normDeg(dir+180)-b))));
// Snön faller ungefär 1,2 m/s. Fläktens fana landar med tyngdpunkten före
// svansen (0,6), lansen släpper från huvudets höjd (0,9).
function driftDistance(cross,typ){
  const lans=typ==='lans', hang=Math.max(1,lans?KF.lanceHeight:KF.fanHeight)/1.2;
  return {hang, centre:cross*hang*(lans?0.9:0.6), tail:cross*hang};
}
const aimCorrection=(c,d)=>Math.atan2(c,Math.max(3,d))*180/Math.PI;

// Spårets sträckor i meter kring mitten. Platt jord räcker på två kilometer.
const kfXY=p=>[(p[1]-TRACK.centre[1])*111320*Math.cos(toRad(TRACK.centre[0])),(p[0]-TRACK.centre[0])*111320];
let kfSegs=null;
function trackSegs(){
  if(kfSegs)return kfSegs;
  kfSegs=[];
  for(let i=1;i<TRACK.pts.length;i++){
    const a=kfXY(TRACK.pts[i-1]), b=kfXY(TRACK.pts[i]), len=Math.hypot(b[0]-a[0],b[1]-a[1]);
    if(len>=1)kfSegs.push({a,b,len,bearing:normDeg(Math.atan2(b[0]-a[0],b[1]-a[1])*180/Math.PI)});
  }
  return kfSegs;
}
function segDist(p,s){
  const dx=s.b[0]-s.a[0], dy=s.b[1]-s.a[1];
  const t=Math.max(0,Math.min(1,((p[0]-s.a[0])*dx+(p[1]-s.a[1])*dy)/(dx*dx+dy*dy)));
  return Math.hypot(p[0]-(s.a[0]+t*dx),p[1]-(s.a[1]+t*dy));
}
// Riktningarna på den bit av spåret en enhet vid brunnen når: närmaste
// sträckan och därifrån åt båda hållen så länge spåret är inom räckhåll.
// Inte allt inom radien — slingan viker tillbaka, och returbenet ska inte
// räknas som om kanonen siktade på det (Snöprognos gunCoverage).
function wellBearings(no,typ){
  const w=WELLS.find(x=>x.no===no), S=trackSegs(); if(!w||!S.length)return null;
  const p=kfXY([w.lat,w.lon]), r=typ==='lans'?KF.lanceDist+12:KF.fanDist;
  let idx=0,bd=Infinity; S.forEach((s,i)=>{const d=segDist(p,s); if(d<bd){bd=d;idx=i;}});
  const out=[S[idx].bearing];
  for(let i=idx-1;i>=0&&segDist(p,S[i])<=r;i--)out.push(S[i].bearing);
  for(let i=idx+1;i<S.length&&segDist(p,S[i])<=r;i++)out.push(S[i].bearing);
  return out;
}
// Enheterna som räknas: de som hörs och står vid en känd brunn.
function kfUnits(){
  if(bridgeOld())return [];
  return running().filter(c=>WELLS.some(w=>w.no===c.brunn)).map(c=>({c,b:wellBearings(c.brunn,c.typ)})).filter(u=>u.b);
}
let kfProf=null, kfProfKey=null;
function windProfile(){
  const u=kfUnits(), key=u.map(x=>x.c.typ+x.c.brunn).join();
  if(kfProf&&key===kfProfKey)return kfProf;
  kfProfKey=key;
  kfProf=u.length?{mode:'enheter', sets:u.map(x=>x.b), units:u}
    :{mode:'spar', rows:trackSegs().map(s=>({b:s.bearing,w:s.len}))};
  return kfProf;
}
// Med enheter: värsta riktningen inom varje enhets räckvidd, medianen över
// enheterna. Annars medianen längs spåret, viktad efter längd.
function crossStats(wind,dir){
  const p=windProfile();
  const rows=p.mode==='enheter'?p.sets.map(set=>({c:Math.max(...set.map(b=>crossOf(wind,dir,b))),w:1}))
    :p.rows.map(r=>({c:crossOf(wind,dir,r.b),w:r.w}));
  rows.sort((a,b)=>a.c-b.c);
  const half=rows.reduce((a,r)=>a+r.w,0)/2; let acc=0, median=rows[rows.length-1].c;
  for(const r of rows){acc+=r.w; if(acc>half){median=r.c;break;}}
  return {median, min:rows[0].c, max:rows[rows.length-1].c, mode:p.mode, count:rows.length};
}

/* --- bedömning av en tidpunkt (Snöprognos assess) --- */
const fmt1=v=>num(v,1);
// Gränserna med två decimaler när det behövs: −2,65 avrundat till −2,7 ser
// ut att ligga under en våttemperatur på −2,66 som faktiskt räcker.
const fmtG=v=>Number.isFinite(v)?v.toLocaleString('sv-SE',{minimumFractionDigits:1,maximumFractionDigits:2}):'–';
function assess(pt){
  const th=thresholds(), wc=crossStats(pt.wind,pt.dir), drift=driftDistance(wc.median,'kanon');
  const fanCap=capacity(pt.wb,th.base,kfVal.vt), lanceCap=capacity(pt.wb,th.lance,kfVal.vt);
  let state='go'; const reasons=[];
  if(!(pt.wb<=th.base)){state='stop'; reasons.push(`våttemp ${fmt1(pt.wb)} °C är över startgränsen ${fmtG(th.base)} °C`);}
  else if(pt.wb>th.target){state='marginal'; reasons.push(`${fmt1(pt.wb)} °C räcker till kvalitet ${achievableQuality(pt.wb,kfVal.vt)} men målet är ${kfVal.q}`);}
  else if(pt.wb>th.base-0.5){state='marginal'; reasons.push(`våttemp ${fmt1(pt.wb)} °C ligger precis på gränsen`);}
  const gust=Number.isFinite(pt.gust)?pt.gust:pt.wind;
  if(gust>=KF.windStop||pt.wind>=KF.windStop){state='stop'; reasons.push(`vinden ${fmt1(pt.wind)} m/s (byar ${fmt1(gust)}) är över stoppgränsen ${KF.windStop} m/s`);}
  else if(pt.wind>=KF.windWarn&&state!=='stop'){state='marginal'; reasons.push(`${fmt1(pt.wind)} m/s kräver att kanonerna riktas om`);}
  // Driver snön längre i sidled än halva spårbredden hamnar den utanför.
  if(state!=='stop'&&drift.centre>KF.trailWidth/2){if(state==='go')state='marginal';
    reasons.push(`snön driver ca ${Math.round(drift.centre)} m i sidled, spåret är ${KF.trailWidth} m brett`);}
  if(state==='stop'&&wc.min<wc.max*0.5)reasons.push(`tvärvinden varierar ${fmt1(wc.min)}–${fmt1(wc.max)} m/s längs spåret`);
  return {state, reasons, wc, drift, fanCap, lanceCap, th};
}
const KF_WORD={go:'Går att köra', marginal:'Marginellt', stop:'Vänta'};
const KF_CHIP={go:'s-run', marginal:'s-limit', stop:'s-alarm'};
const kfChip=s=>`<span class="chip ${KF_CHIP[s]}"><span class="d"></span>${KF_WORD[s]}</span>`;
const kfCap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):'';

/* --- hämtning ---
   timeformat=unixtime: ISO-tider utan tidszon tolkas som lokal tid fast
   Open-Meteo menar UTC, och då hamnar hela prognosen en till två timmar fel.
   Kvartsdata i tre dygn, timdata därefter i tio. */
const FC_VARS='temperature_2m,relative_humidity_2m,wind_speed_10m,wind_gusts_10m,wind_direction_10m,surface_pressure';
const FC_EVERY=30*60000, FC_RETRY=2*60000, FC_OLD=2*3600000;
let fc={pts:[], at:0, err:'', busy:false, tried:0}, fcToken=0;
function fcUrl(kind){
  const q=new URLSearchParams({latitude:KF_PLATS.lat.toFixed(4), longitude:KF_PLATS.lon.toFixed(4),
    wind_speed_unit:'ms', timeformat:'unixtime', models:'best_match'});
  if(kind==='h'){q.set('hourly',FC_VARS);q.set('forecast_days','10');}
  else{q.set('minutely_15',FC_VARS);q.set('forecast_days','3');}
  return 'https://api.open-meteo.com/v1/forecast?'+q;
}
function fcBlock(b){
  if(!b||!b.time)return [];
  return b.time.map((t,i)=>{
    const temp=b.temperature_2m[i], rh=b.relative_humidity_2m[i], pres=b.surface_pressure?b.surface_pressure[i]:undefined;
    return {x:t*1000, temp, rh, pressure:pres, wind:b.wind_speed_10m[i],
      gust:b.wind_gusts_10m?b.wind_gusts_10m[i]:null, dir:b.wind_direction_10m[i], wb:wetBulb(temp,rh,pres)};
  }).filter(d=>Number.isFinite(d.temp));
}
async function fcFetch(){
  const tok=++fcToken; fc.busy=true; fc.tried=Date.now();
  try{
    const [rH,rF]=await Promise.all([fetch(fcUrl('h'),{cache:'no-store'}),fetch(fcUrl('f'),{cache:'no-store'}).catch(()=>null)]);
    if(!rH||!rH.ok)throw new Error('Vädertjänsten svarade '+(rH?rH.status:'inte'));
    const h=fcBlock((await rH.json()).hourly); if(!h.length)throw new Error('Prognosen kom tom');
    let f=[]; if(rF&&rF.ok){try{f=fcBlock((await rF.json()).minutely_15);}catch(e){}}
    if(tok!==fcToken)return;
    const cut=f.length?f[f.length-1].x:-Infinity;
    fc.pts=f.concat(h.filter(d=>d.x>cut)); fc.at=Date.now(); fc.err='';
  }catch(e){
    if(tok!==fcToken)return;
    console.error(e); fc.err='Ingen kontakt med vädertjänsten.';
  }finally{
    if(tok===fcToken){fc.busy=false; if(current==='forecast'||current==='overview')safeRender(true);}
  }
}
// Anropas vid varje ritning av vyerna som visar prognosen.
function fcEnsure(){
  if(fc.busy)return;
  const now=Date.now();
  if(fc.at&&now-fc.at<FC_EVERY)return;
  if(fc.tried&&now-fc.tried<FC_RETRY)return;
  fcFetch();
}
const fcOld=()=>!fc.at||Date.now()-fc.at>FC_OLD;
function fcNow(){
  const now=Date.now(); let best=null, bd=Infinity;
  for(const d of fc.pts){const df=Math.abs(d.x-now); if(df<bd){bd=df;best=d;}}
  return bd<=3*3600000?best:null;
}
// Timpunkterna från innevarande timme och n timmar framåt.
function fcHours(n){
  const h0=new Date(); h0.setMinutes(0,0,0); const a=+h0, b=a+n*3600000;
  return fc.pts.filter(d=>d.x>=a&&d.x<=b&&new Date(d.x).getMinutes()===0);
}

/* --- körfönster: sammanhängande perioder som går att köra --- */
function findWindows(from,to){
  const out=[]; let open=null;
  for(const pt of fc.pts){
    if(pt.x<from||pt.x>to)continue;
    const a=assess(pt), ok=a.state!=='stop';
    if(ok&&!open)open={start:pt.x,end:pt.x,marginal:a.state==='marginal',minWb:pt.wb};
    else if(ok){open.end=pt.x; if(a.state==='marginal')open.marginal=true; open.minWb=Math.min(open.minWb,pt.wb);}
    else if(open){out.push(open);open=null;}
  }
  if(open)out.push(open);
  // Glapp under en timme är inte värda att bryta produktionen för.
  const merged=[];
  for(const w of out){const p=merged[merged.length-1];
    if(p&&w.start-p.end<75*60000){p.end=w.end;p.marginal=p.marginal||w.marginal;p.minWb=Math.min(p.minWb,w.minWb);}
    else merged.push({...w});}
  return merged.filter(w=>w.end-w.start>=60*60000);
}
function durText(ms){const m=Math.round(ms/60000), h=Math.floor(m/60), r=m%60; return h?(r?`${h} h ${r} min`:`${h} h`):`${r} min`;}
function daysAhead(ts){const s=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime(); return Math.round((s(new Date(ts))-s(new Date()))/864e5);}
function dayPrefix(ts){
  const d=new Date(ts), n=daysAhead(ts);
  if(n===0)return d.getHours()>=18||d.getHours()<5?'i natt':'i dag';
  if(n===1)return d.getHours()<5?'i natt':'i morgon';
  if(n===2)return 'i övermorgon';
  return d.toLocaleDateString('sv-SE',{weekday:'long',day:'numeric',month:'short'});
}
const kfWhen=ts=>hhmm(new Date(ts));
function winLabel(w){
  const now=Date.now(), end=daysAhead(w.end)===daysAhead(w.start)?kfWhen(w.end):kfWhen(w.end)+' '+WD[new Date(w.end).getDay()];
  return w.start<=now+20*60000?`Kör nu → ${end}`:`${kfCap(dayPrefix(w.start))} ${kfWhen(w.start)} → ${end}`;
}
const kfWins=()=>{const now=Date.now(); return fc.pts.length?findWindows(now,now+10*864e5):[]};

/* --- tidslinjen: en ruta per timme, sämsta läget inom timmen --- */
const KF_RANK={go:0,marginal:1,stop:2}, KF_SEG={go:'good',marginal:'ok',stop:'no'};
function timelineHTML(hours=48){
  const h0=new Date(); h0.setMinutes(0,0,0);
  let segs='';
  for(let i=0;i<hours;i++){
    const a=+h0+i*3600000, b=a+3600000, d=new Date(a);
    const pts=fc.pts.filter(p=>p.x>=a&&p.x<b);
    let st=null, wb=null;
    for(const p of pts){const s=assess(p).state; if(st===null||KF_RANK[s]>KF_RANK[st])st=s; if(wb===null||p.wb>wb)wb=p.wb;}
    const h=d.getHours(), lab=i===0?'nu':(h%6===0&&i>2&&i<hours-2)?(h===0?WD[d.getDay()]:String(h).padStart(2,'0')):'';
    segs+=`<div class="tseg ${st?KF_SEG[st]:'na'}${lab&&i?' mark':''}" title="${WD[d.getDay()]} ${hhmm(d)}${st?' · '+KF_WORD[st]+', våttemp upp till '+fmt1(wb)+' °C':' · ingen prognos'}">${lab?`<b>${lab}</b>`:''}</div>`;
  }
  return `<div class="timeline">${segs}</div>
    <div class="legend"><span><i style="background:#10533a"></i>Går att köra</span><span><i style="background:#5a4712"></i>Marginellt</span><span><i style="background:#3a2020"></i>Vänta</span></div>`;
}

// Kort sammanfattning för översikten.
function fcBrief(){
  fcEnsure();
  if(!fc.pts.length)return `<p class="muted small" style="line-height:1.6;margin:11px 0 0">${fc.err?esc(fc.err)+' Prognosen försöker igen om en stund.':'Hämtar prognosen …'}</p>`;
  const pt=fcNow(), a=pt?assess(pt):null, w=kfWins()[0], now=Date.now();
  const txt=!w?'Inget körfönster inom tio dygn — för varmt eller för blåsigt.'
    :w.start<=now+20*60000?`Prognosen håller <b style="color:var(--text)">till ${kfWhen(w.end)}${daysAhead(w.end)?' '+WD[new Date(w.end).getDay()]:''}</b> (${durText(w.end-now)}${w.marginal?', delvis marginellt':''}).`
    :`Nästa fönster: <b style="color:var(--text)">${dayPrefix(w.start)} ${kfWhen(w.start)}</b>, ${durText(w.end-w.start)}.`;
  return `<div class="row" style="margin-top:10px">${a?kfChip(a.state):''}<span class="muted small">enligt prognosen${a?' · våttemp '+fmt1(pt.wb)+' °C':''}</span>${fcOld()?agoHTML(fc.at):''}</div>
    <p class="muted small" style="line-height:1.6;margin:10px 0 0">${txt}</p>${timelineHTML(24)}`;
}

function vForecast(){
  fcEnsure();
  const head=topbar('Prognos','Körfönster',`<button class="linkbtn" onclick="fcFetch();render()"${fc.busy?' disabled':''}>${fc.busy?'Hämtar …':'Hämta nu'}</button>`);
  if(!fc.pts.length)return head+`<div class="view"><div class="card"><p class="muted" style="margin:0">${fc.err?esc(fc.err)+' Kontrollera nätet och tryck <b>Hämta nu</b>.':'Hämtar prognosen …'}</p></div></div>`;
  const pt=fcNow(), a=pt?assess(pt):null, th=thresholds(), wins=kfWins().slice(0,5), now=Date.now(), old=fcOld();
  const stamp=`Prognos från Open-Meteo, hämtad ${hhmm(new Date(fc.at))}${fc.err?' · '+esc(fc.err)+' Visar den senast hämtade.':''}`;
  // Väderstationens mätning bredvid, inte inräknad.
  const st=real&&wx&&Number.isFinite(wx.tw)?(bridgeOld()?`Väderstationen mätte ${fmt1(wx.tw)} °C ${agoHTML(lastData)}`:`Väderstationen mäter ${fmt1(wx.tw)} °C`):'';
  let why='';
  if(a){
    if(a.state==='go'){const q=achievableQuality(pt.wb,kfVal.vt);
      why=`${Math.round(a.fanCap)} % kapacitet på fläkt`+(a.lanceCap>0?`, ${Math.round(a.lanceCap)} % på lans`:', ännu för varmt för lans')+(q?` · räcker till kvalitet ${q}`:'')+'.';}
    else why=a.reasons.slice(0,2).map(r=>kfCap(r)+'.').join(' ');
  }
  const corr=a?aimCorrection(a.drift.centre,KF.fanDist):0, lansD=a?driftDistance(a.wc.median,'lans'):null;
  const prof=windProfile();
  const unitRows=a&&prof.mode==='enheter'?prof.units.map(u=>{
    const c=Math.max(...u.b.map(b=>crossOf(pt.wind,pt.dir,b))), dr=driftDistance(c,u.c.typ).centre, ok=dr<=KF.trailWidth/2;
    return `<tr><td><b>${esc(u.c.namn)}</b></td><td class="r">${u.c.brunn}</td><td class="r">${fmt1(c)}</td><td class="r">${Math.round(dr)} m</td><td>${ok?'<span class="kf-dot go"></span> i spåret':dr<=KF.trailWidth?'<span class="kf-dot marginal"></span> i kanten':'<span class="kf-dot stop"></span> utanför'}</td></tr>`;}).join(''):'';
  const hrs=fcHours(24);
  let lastDay=null;
  // Dagen som en egen rad: i tidskolumnen gjorde den tabellen för bred för en telefon.
  const hourRows=hrs.map(p=>{const s=assess(p), d=new Date(p.x), nd=d.getDate()!==lastDay; lastDay=d.getDate();
    return `${nd?`<tr class="kf-day"><td colspan="8">${d.toLocaleDateString('sv-SE',{weekday:'long',day:'numeric',month:'long'})}</td></tr>`:''}<tr title="${esc(s.reasons.map(kfCap).join(' · ')||'Alla villkor uppfyllda')}"><td>${hhmm(d)}</td><td class="r"><b style="color:var(--ice)">${fmt1(p.wb)}</b></td><td class="r">${fmt1(p.temp)}</td><td class="r">${num(p.rh,0)}</td><td class="r">${num(p.wind,0)}${Number.isFinite(p.gust)?' ('+num(p.gust,0)+')':''} ${dirName(p.dir)}</td><td class="r">${fmt1(s.wc.median)}</td><td class="r">${Math.round(s.fanCap)}</td><td><span class="kf-dot ${s.state}" title="${KF_WORD[s.state]}"></span></td></tr>`;}).join('');
  const p2=pumps&&pumps.dep12||{}, pumpsGo=real&&!bridgeOld()&&Number.isFinite(p2.vattenTemp)&&cannons.some(c=>c.state==='conn'&&c.q>0);

       :'<div class="kf-win none"><span>Inget körfönster inom tio dygn</span><span class="d">för varmt eller för blåsigt</span></div>'}
     ${timelineHTML(48)}
     <p class="muted small" style="margin:10px 0 0">${stamp}</p>
   </div>

   <div class="grid g-kpi" style="margin-top:14px">
     <div class="card kpi${old?' old':''}"><h3>${icon('temp','#7dd3fc',15)} Våttemp nu</h3><div class="val">${a?fmt1(pt.wb):'–'}<small> °C</small></div><div class="foot">${a?'luft '+fmt1(pt.temp)+' °C, '+num(pt.rh,0)+' %':''}${st?'<br>'+st:''}</div></div>
     <div class="card kpi"><h3>${icon('sliders','#7dd3fc',15)} Startgräns</h3><div class="val">${fmtG(th.base)}<small> °C</small></div><div class="foot">kvalitet ${kfVal.q}: ${fmtG(th.target)} °C · lans ${fmtG(th.lance)} °C</div></div>
     <div class="card kpi${old?' old':''}"><h3>${icon('fan','#7dd3fc',15)} Kapacitet</h3><div class="val">${a?Math.round(a.fanCap):'–'}<small> % fläkt</small></div><div class="foot">${a?Math.round(a.lanceCap)+' % lans · av maxflödet, inte snö per vatten':''}</div></div>
     <div class="card kpi${old?' old':''}"><h3>${icon('track','#7dd3fc',15)} Vind</h3><div class="val">${a?num(pt.wind,0):'–'}<small> m/s ${a?dirName(pt.dir):''}</small></div><div class="foot">${a?'byar '+num(pt.gust,0)+' · tvärs spåret '+fmt1(a.wc.median)+' m/s':''}</div></div>

     <div class="card${old?' old':''}"><h3>${icon('track','#7dd3fc',15)} Vind och sidodrift — 48 h</h3><div class="chartbox"><canvas id="cWind"></canvas></div>

         ${Number.isFinite(pt.gust)&&pt.gust>pt.wind*1.7&&pt.gust>6?' Byarna går upp i '+fmt1(pt.gust)+' m/s — så byig vind går inte att kompensera bort.':''}</p>`:''}

   <div class="grid g-2" style="margin-top:14px">
     <div class="card"><h3>${icon('sliders','#7dd3fc',15)} Räknat med</h3>
       <div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:10px">

         <label class="small muted">Vattentemperatur, °C<input type="number" inputmode="decimal" step="0.1" min="0" max="15" style="${inp}" value="${kfVal.vt}" onchange="kfSet('vt',this.value)"></label>

       ${pumpsGo?`<p class="muted small" style="line-height:1.55;margin:10px 0 0">TT01 i pumphuset visar ${fmt1(p2.vattenTemp)} °C nu, med pumparna igång. <button class="linkbtn" onclick="kfSet('vt',${p2.vattenTemp})">Använd ${fmt1(p2.vattenTemp)} °C</button></p>`
         :real&&tt01Drift(p2)?`<p class="muted small" style="line-height:1.55;margin:10px 0 0">Pumparna står. TT01 i pumphuset visade ${fmt1(tt01Drift(p2).v)} °C senast vattnet gick (${dm(tt01Drift(p2).tid)}). <button class="linkbtn" onclick="kfSet('vt',${tt01Drift(p2).v})">Använd ${fmt1(tt01Drift(p2).v)} °C</button></p>`:''}
       <p class="muted small" style="line-height:1.6;margin:10px 0 0">Sparas i den här telefonen. Startgränsen är ${fmt1(KF.fanBase)} °C för fläkt och ${fmt1(KF.lanceBase)} °C för lans, skjuten ${fmtG(th.water)} grader nedåt av vattnet. Målkvaliteten lägger till 0,4 grader per steg under 10 (${fmt1(th.quality)} nu). Vind ${KF.windWarn} m/s kräver omriktning, ${KF.windStop} m/s stoppar.</p>
     </div>
     <div class="card${damUtanUttag()?' old':''}"><h3>${icon('dam','#7dd3fc',15)} Vattenmagasin — så länge räcker det</h3>
       ${damUtanUttag()?`<p class="muted small" style="margin:10px 0 0">Uttaget saknas sedan mätningen ${fmtDT(dam.t0)}.</p>`
         :`<div class="val" style="font-size:1.7rem;font-weight:700;margin-top:6px">≈ ${fmtDur(damH)} <small class="muted" style="font-size:.85rem">vid nuvarande uttag</small></div>`}
       <div class="bar ${damPct()<30?'red':damPct()<50?'amber':'green'}" style="margin-top:10px"><i style="width:${Math.min(100,damPct())}%"></i></div>
       <p class="muted small" style="line-height:1.6;margin-top:12px">${winH!==null&&!damUtanUttag()?`Fönstret är öppet ${durText(winH*3600000)} till; vattnet räcker ${damH<winH?'<b style="color:var(--limit)">kortare</b>':'längre'}. `:''}Kör hårt medan fönstret är öppet och magasinet räcker.</p>
     </div>
   </div>
   <div class="note" style="margin-top:14px">Samma beräkning som i Snöprognos. Prognosen gäller tio meter över öppen mark; väderstationen vid brunn 7 visar 0,3–1,7 grader för varmt och räknas inte in. Kapaciteten är en allmän mättande kurva (ca 90 % fyra grader under gränsen), inte Sufags data. Sidodriften är tvärvinden gånger tiden snön hänger i luften (${KF.fanHeight} m fallhöjd för fläkt, ${KF.lanceHeight} m för lans, 1,2 m/s). ${prof.mode==='enheter'?'Tvärvinden räknas där enheterna står: värsta riktningen på den bit spåret de når, medianen över enheterna.':'Tvärvinden räknas längs hela spåret, viktad efter längd, tills enheter hörs vid brunnarna.'} Appen visar bara — inställningar görs i styrsystemet.</div>
  </div>`;
}

   routern visste om det, och uppdateringen var femte sekund ritade då om

  const c=cannons.find(x=>x.id===unitId); if(!c)return vOverview();

    <div class="grid g-kpi">
      <div class="card kpi"><h3>Status</h3><div style="margin-top:10px">${chip(c.state)}</div><div class="foot" style="margin-top:9px">Brunn ${c.brunn} · steg ${esc(c.steg)}</div></div>
      <div class="card kpi"><h3>Vattenflöde</h3><div class="val">${num(c.eau)}<small> m³/h</small></div>${c.stryp?`<div class="foot warn">Strypt ${c.stryp}%</div>`:'<div class="foot">Full</div>'}</div>
      <div class="card kpi"><h3>Luft</h3><div class="val">${num(c.air)}<small> ${c.typ==='kanon'?'m³/min':'l/s'}</small></div></div>
      <div class="card kpi"><h3>Våttemp vid enheten</h3><div class="val">${num(c.tw)}<small> °C</small></div></div>
    </div>
    <div class="card" style="margin-top:14px"><h3>${icon('drop','#7dd3fc',15)} Vattenflöde — senaste timmen</h3><div class="chartbox"><canvas id="cUnit"></canvas></div></div>
    <div class="note" style="margin-top:14px">Trenden hjälper att se om en strypning håller eller om flödet vandrar — t.ex. när pumptrycket pressas av att fler enheter startar.</div>
  </div>`;

/* ============================================================
   CHARTS
   ============================================================ */
/* Tidsaxlar visar KLOCKSLAG, inte "−6 h": den som tittar vill veta när något
   hände ("uttaget steg vid 03") och jämföra med vad som gjordes då. Punkterna
   läggs på jämna klockslag och den sista är "nu". */
const WD=['sön','mån','tis','ons','tor','fre','lör'];
const hhmm=d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
const isEven=d=>d.getSeconds()===0&&d.getMilliseconds()===0;
function timeAxis(hoursBack,stepMin){
  const step=stepMin*60000, now=Date.now(), last=Math.floor(now/step)*step, n=Math.round(hoursBack*60/stepMin);
  const ts=[]; for(let i=n;i>=0;i--)ts.push(new Date(last-i*step));
  if(now-last>60000)ts.push(new Date(now));         // sista punkten = nu
  return ts;
}
// Skriv bara ut etikett på jämna klockslag — annars blir axeln oläslig på en
// telefon. null = ingen etikett och ingen stödlinje där.
const tickHours=(ts,h)=>(v,i)=>{const d=ts[i];return d&&isEven(d)&&d.getMinutes()===0&&d.getHours()%h===0?hhmm(d):null};
const tickMins=(ts,m)=>(v,i)=>{const d=ts[i];return d&&isEven(d)&&d.getMinutes()%m===0?hhmm(d):null};
// sträck ut några hållpunkter till m värden (exempeldata tills historiken finns)
const interp=(a,m)=>Array.from({length:m},(_,i)=>{const x=i/(m-1)*(a.length-1),k=Math.min(a.length-2,Math.floor(x));
  return +(a[k]+(a[k+1]-a[k])*(x-k)).toFixed(1)});

let softRender=false;   // sant när vyn bara fräschas upp med nya värden
function chOpts(ts,unit,xTick,yExtra){
  // Över ett dygn räcker inte veckodagen i rutan — då står datumet med.
  const long=ts.length>1&&ts[ts.length-1]-ts[0]>1.1*864e5;
  return {responsive:true,maintainAspectRatio:false,animation:softRender?false:{duration:450},
    interaction:{mode:'index',intersect:false},   // ett finger var som helst på grafen räcker
    plugins:{legend:{display:false},tooltip:{callbacks:{
      title:it=>{const d=ts[it[0].dataIndex];return d?WD[d.getDay()]+' '+(long?fmtDay(d)+' ':'')+hhmm(d):''},
      label:c=>`${c.dataset.label}: ${c.parsed.y.toLocaleString('sv-SE',{maximumFractionDigits:1})} ${unit}`}}},
    scales:{x:{grid:{color:'#ffffff0c'},ticks:{color:'#8ba0bd',maxRotation:0,autoSkip:false,font:{size:11},callback:xTick}},
            y:Object.assign({grid:{color:'#ffffff0c'},ticks:{color:'#8ba0bd',font:{size:11}}},yExtra||{})}};
}
function mkGrad(ctx,c1,c2){const g=ctx.createLinearGradient(0,0,0,190);g.addColorStop(0,c1);g.addColorStop(1,c2);return g}
const flat=(n,v,label,col)=>({data:Array(n).fill(v),label,borderColor:col,borderWidth:1.5,borderDash:[5,4],tension:0,pointRadius:0,pointHoverRadius:0});
function chart(id,ts,datasets,opts){
  const el=document.getElementById(id);if(!el||!window.Chart)return;
  if(charts[id])charts[id].destroy();
  const ctx=el.getContext('2d');
  datasets.forEach(d=>{if(d.fill)d.backgroundColor=mkGrad(ctx,d.borderColor+'44','#ffffff00')});
  charts[id]=new Chart(ctx,{type:'line',data:{labels:ts.map(hhmm),datasets},options:opts});
}
const series=(data,label,col)=>({data,label,borderColor:col,borderWidth:2,tension:.4,pointRadius:0,pointHoverRadius:4,fill:true});

// Etikett vid första punkten i varje ny timme (varannan om kurvan är lång).
// Riktiga punkter ligger inte på jämna klockslag, så tickHours passar inte.
function histTick(ts){
  // Längre än ett par dygn: datum vid varje nytt dygn, glesare ju längre
  // perioden är, så att axeln går att läsa på en telefon.
  const span=ts.length>1?ts[ts.length-1]-ts[0]:0;
  if(span>2.5*864e5){
    const days=span/864e5, every=days>60?14:days>20?7:days>8?2:1;
    const dayNo=d=>Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5);
    return (v,i)=>{const d=ts[i],q=ts[i-1];if(!d||!q)return null;const a=dayNo(d);
      return a!==dayNo(q)&&a%every===0?d.getDate()+'/'+(d.getMonth()+1):null};
  }
  // Ett dygn på en telefon: var fjärde timme, annars flyter klockslagen ihop.
  const step=ts.length>72?(innerWidth<600?4:2):1, b=d=>d.getDate()*100+Math.floor(d.getHours()/step);
  return (v,i)=>{const d=ts[i],q=ts[i-1];return d&&q&&b(d)!==b(q)?String(d.getHours()).padStart(2,'0')+':00':null};
}
function drawCharts(){
  if(real&&current!=='forecast'){
    if(histPts.length<2)return;
    const ts=histPts.map(x=>new Date(x.ts)), col=k=>histPts.map(x=>Number.isFinite(x[k])?x[k]:null);
    if(current==='overview')chart('cTw',ts,[series(col('tw'),'Våttemp','#38bdf8'),
      flat(ts.length,FTHRESH,'Startgräns','#fbbf2499')],chOpts(ts,'°C',histTick(ts)));
    if(current==='water'){chart('cWater',ts,[series(col('tryckUt'),'Tryck ut','#22d3ee')],chOpts(ts,'bar',histTick(ts)));
      // Kanonernas summa streckad och utan fyllning: den är räknad, inte mätt,
      // och ska gå att läsa ovanpå FT01.
      chart('cFlow',ts,[series(col('k125'),'Flöde FT01','#38bdf8'),
        Object.assign(series(col('flodeSum'),'Kanonerna ihop','#a78bfa'),{fill:false,borderDash:[5,4],spanGaps:false})],
        chOpts(ts,'m³/h',histTick(ts),{beginAtZero:true}));}
    return;
  }
  if(current==='overview'){
    const ts=timeAxis(12,30);
    chart('cTw',ts,[series(interp([-3.1,-3.8,-4.6,-5.2,-5.9,-6.1,-6.4],ts.length),'Våttemp','#38bdf8'),
      flat(ts.length,FTHRESH,'Startgräns','#fbbf2499')],chOpts(ts,'°C',tickHours(ts,2)));
  }
  if(current==='water'){
    const ts=timeAxis(12,30);
    const d=interp([44,52,60,65,67,64,totalWater()],ts.length); d[d.length-1]=totalWater();
    // Y-axeln börjar inte på noll: det som spelar roll är avståndet upp till
    // målet och taket, och det syns inte om hela skalan 0–70 ska få plats.
    const lo=Math.max(0,Math.floor((Math.min(...d)-8)/10)*10);
    chart('cWater',ts,[series(d,'Uttag','#22d3ee'),
      flat(ts.length,PUMP_TARGET,'Mål','#fbbf24'),
      Object.assign(flat(ts.length,PUMP_MAX,'Tak','#f87171'),{borderDash:[]})],
      chOpts(ts,'m³/h',tickHours(ts,2),{min:lo,max:PUMP_MAX+4,ticks:{color:'#8ba0bd',font:{size:11},stepSize:10,includeBounds:false}}));
  }
  if(current==='forecast'){
    // Prognosens timpunkter 48 h framåt från innevarande timme (lokal tid,
    // så att etiketterna hamnar på jämna svenska klockslag).
    const pts=fcHours(48); if(pts.length<2)return;
    const ts=pts.map(p=>new Date(p.x)), th=thresholds(), n=ts.length, r1=v=>Number.isFinite(v)?+v.toFixed(1):null;
    const tick=(v,i)=>{const t=ts[i];if(!t||t.getHours()%6!==0)return null;return t.getHours()===0?WD[t.getDay()]:hhmm(t)};
    chart('cFc',ts,[series(pts.map(p=>r1(p.wb)),'Våttemp','#38bdf8'),
      Object.assign(series(pts.map(p=>r1(p.temp)),'Luft','#8ba0bd'),{fill:false,borderWidth:1,borderDash:[4,4]}),
      flat(n,r1(th.base),'Startgräns','#fbbf24aa'),
      flat(n,r1(th.target),'Kvalitet '+kfVal.q,'#60a5faaa')],chOpts(ts,'°C',tick));
    chart('cWind',ts,[Object.assign(series(pts.map(p=>r1(p.wind)),'Medelvind','#fbbf24'),{fill:false}),
      Object.assign(series(pts.map(p=>r1(p.gust)),'Byar','#fbbf2488'),{fill:false,borderWidth:1,borderDash:[4,4]}),
      series(pts.map(p=>r1(crossStats(p.wind,p.dir).median)),'Tvärs spåret','#38bdf8'),
      flat(n,KF.windWarn,'Omriktning','#fbbf2466'),
      Object.assign(flat(n,KF.windStop,'Stopp','#f8717199'),{borderDash:[]})],chOpts(ts,'m/s',tick,{beginAtZero:true}));
  }
  if(current==='unit'){
    const c=cannons.find(x=>x.id===unitId); if(!c)return;
    const ts=timeAxis(1,5);
    // historiken är påhittad men ska stå stilla mellan uppfräschningarna
    // (sparas per klockslag: antalet punkter växlar när "nu" ligger mellan två
    // jämna slag, och då slumpades allt om)
    const hist=unitHist[c.id]||(unitHist[c.id]={}), base=c.eau||4;
    const d=ts.map(t=>hist[+t]??(hist[+t]=+(base+Math.sin(t/6e5)*0.5+(Math.random()-.5)*0.3).toFixed(1)));
    d[d.length-1]=c.eau;
    chart('cUnit',ts,[series(d,'Vattenflöde','#22d3ee')],chOpts(ts,'m³/h',tickMins(ts,15)));
  }
}
let unitHist={};

/* ============================================================
   RENDER + LIVE
   ============================================================ */
/* soft = vyn fräschas bara upp med nya värden (var femte sekund). Då ska
   varken sidan tona in på nytt eller graferna rita upp sig från noll — det
   blinkade hela tiden annars. */
function render(soft){
  softRender=!!soft;
  buildNav();
  const m=document.getElementById('main');
  m.classList.toggle('soft',softRender);
  if(current==='unit')m.innerHTML=real?vUnitR():vUnit();
  else if(current==='overview')m.innerHTML=real?vOverviewR():vOverview();
  else if(current==='water')m.innerHTML=real?vWaterR():vWater();
  else if(current==='dam')m.innerHTML=vDam();
  else if(current==='advisor')m.innerHTML=vAdvisor();
  else if(current==='map')m.innerHTML=vMap();
  else if(current==='cannons')m.innerHTML=vUnits('kanon');
  else if(current==='lances')m.innerHTML=vUnits('lans');
  else if(current==='alarms')m.innerHTML=vAlarms();
  else if(current==='forecast')m.innerHTML=vForecast();
  else if(current==='members')m.innerHTML=vMembers();
  // Grafer och karta som hör till en vy man lämnat ska bort, annars ligger de
  // kvar i minnet mot en canvas som inte längre finns.
  for(const k in charts){if(!document.getElementById(k)){charts[k].destroy();delete charts[k];}}
  if(current!=='map'&&mapInst){try{mapInst.remove();}catch(e){} mapInst=null;}
  // Bara EN väntande ritning åt gången. setTimeout och inte
  // requestAnimationFrame: den senare körs inte alls när sidan inte syns
  // (dold flik, inbäddad panel), och då blev graferna aldrig ritade.
  clearTimeout(drawTimer);
  drawTimer=setTimeout(()=>{drawCharts();if(current==='map')initMap();},0);
}
let drawTimer=0;
/* Går något snett när en vy byggs (ett värde av oväntad sort i datan) ska det
   synas — inte lämna gamla siffror kvar under en stämpel som säger "live". */
function safeRender(soft){
  try{render(soft);}
  catch(e){
    console.error(e);
    lastData=0;   // tvingar stämpeln till "gammal data"
    document.getElementById('main').innerHTML=topbar('Driftövervakning','Kunde inte visa vyn')+
      `<div class="banner">${icon('bell','#f87171')}<div style="flex:1"><b>Något i datan gick inte att visa.</b> <span class="muted small">Siffrorna kan vara gamla. Prova att ladda om sidan.</span></div></div>`;
  }
}
function ackOne(id){const a=alarms.find(x=>String(x.id)===String(id));
  // Pushlarm kvitteras för alla, i databasen. Listan uppdateras när det
  // kommer tillbaka därifrån, inte här.
  if(a&&a.push){if(window.kvittera)window.kvittera(a.pid).catch(e=>{notisSt.msg='Kvitteringen gick inte: '+(e&&e.message||e);notisSt.err=true;render();});return;}
  if(a){a.ack=true;if(real){acked.add(String(a.id));saveAck();}}render()}
function ackAll(){alarms.forEach(a=>{if(a.push)return;a.ack=true;if(real)acked.add(String(a.id));});if(real)saveAck();render()}

/* gentle live simulation */
let lastTick=Date.now();
setInterval(()=>{
  // Simuleringen hör bara till ?demo. Riktig data ritar om när den kommer.
  if(real)return;
  const now=Date.now();
  // det som tagits ur dammen sedan förra värdet (m³/h × timmar)
  dam.drawn+=totalWater()*(now-lastTick)/3600e3; lastTick=now;
  cannons.forEach(c=>{if(c.state==='off')return;
    c.eau=Math.max(0,+(c.eau+(Math.random()-.5)*0.25).toFixed(1));
    c.tw=+(c.tw+(Math.random()-.5)*0.3).toFixed(1);
  });
  lastData=now;
  if(document.hidden||document.getElementById('app').classList.contains('hidden'))return;
  // Vyer med mätvärden ritas om. Vyer med inmatningsfält (dammen) ritas bara
  // om när ingen skriver i dem — annars försvinner det man håller på med.
  // Kartan ritas inte om; den skulle hoppa tillbaka till utgångsläget.
  const typing=document.activeElement&&/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
  if(current!=='map'&&!typing) safeRender(true);
  else{refreshLive(); if(current==='map')drawMapUnits();}
},5000);
// Stämpeln ska åldras även om inga nya värden kommer — det är hela poängen.
setInterval(refreshLive,15000);

/* ---------- login ---------- */
// showApp och clearApp anropas bara av inloggningskoden längst ner, när
// databasen har bekräftat att kontot står i medlemslistan.
function showApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');safeRender()}
// Vid utloggning töms vyn — annars ligger siffrorna kvar i sidan bakom
// inloggningsrutan.
function clearApp(){
  document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');
  for(const k in charts){charts[k].destroy();delete charts[k];}
  if(mapInst){try{mapInst.remove();}catch(e){} mapInst=null;}
  document.getElementById('main').innerHTML='';
  // Riktig data ska inte ligga kvar i minnet åt nästa som loggar in.
  if(real){cannons=[];alarms=[];wx=pumps=lines=metaLive=null;events=[];histPts=[];lastData=0;
    histLive={};histOld={};histOldRange=null;histRange=24;histTok++;histLoading=false;histErr='';histInfo='';closeHist();
    dammData={avlas:{},kalib:{}};dammErr='';damSync();
    calForm={cm:'',ts:'',edit:null,msg:'',err:false};mtForm={m3:'',ts:'',typ:'avl',edit:null,msg:'',err:false,sparar:false};loggAlla=false;
    larmlage={};notisSt={pa:false,laddad:false,arbetar:false,msg:'',err:false};}
  isAdmin=false;myKey='';members=null;memMsg='';memForm={email:'',name:'',role:'viewer'};
  if(current==='members')current='overview';
}

/* ---------- installerad app ---------- */
/* Service workern gör appen installerbar (sw.js). En installerad app laddas
   nästan aldrig om — telefonen håller den vid liv i dagar — så en ny version
   skulle annars inte komma fram. När appen kommer fram på skärmen frågar den
   därför servern om sidan har ändrats (bara huvudet, inte hela sidan) och
   laddar om i så fall. Inget versionsnummer att komma ihåg att höja. */
(function(){
  const secure=location.protocol==='https:'||location.hostname==='localhost';
  if(!('serviceWorker' in navigator)||!secure)return;
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
  // Ett tryck på en larmnotis när appen redan är öppen (sw.js).
  navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.vy==='alarms')go('alarms');});
  let etag=null, last=0;
  async function check(){
    if(document.hidden||Date.now()-last<10*60000)return;
    last=Date.now();
    try{
      const r=await fetch('./index.html',{method:'HEAD',cache:'no-store'});
      const t=r.ok?(r.headers.get('etag')||r.headers.get('last-modified')):null;
      if(!t)return;
      if(etag===null){etag=t;return;}
      if(t===etag)return;
      // Inte mitt i något man skriver (dammens fält, medlemsformuläret), och
      // inte under inloggningen.
      const typing=document.activeElement&&/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
      if(typing||document.getElementById('app').classList.contains('hidden')){last=0;return;}
      location.reload();
    }catch(e){}
  }
  document.addEventListener('visibilitychange',check);
  check();
})();

/* snowflakes */
(function(){const f=document.getElementById('flakes');let h='';for(let i=0;i<22;i++){const x=Math.random()*100,d=6+Math.random()*8,s=8+Math.random()*12,o=Math.random();h+=`<div class="flake" style="left:${x}%;animation-duration:${d}s;animation-delay:${-Math.random()*d}s;font-size:${s}px;opacity:${o}">❄</div>`}f.innerHTML=h})();
</script>
<script type="module">
/* ============================================================
   INLOGGNING
   Att logga in är inte att få åtkomst: vem som helst med ett Google-konto kan
   logga in i projektet. Det som släpper in är att adressen står under
   /members i databasen, och den kontrollen gör databasens regler - koden här
   visar bara rätt sida. Se docs/anvandarhantering.md.
   ============================================================ */
const $ = id => document.getElementById(id);
const msg = (html, err) => { const m = $('loginMsg'); m.innerHTML = html; m.classList.toggle('err', !!err); };
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Sidans tre lägen utan app: väntar, utloggad, inloggad utan åtkomst.
function gate(state, html, err) {
  if (window.clearApp) window.clearApp();
  $('btnLogin').classList.toggle('hidden', state !== 'out');
  $('btnSwitch').classList.toggle('hidden', state !== 'noaccess');
  msg(html || '', err);
}

// Inloggningens adress ska vara samma som appens egen, annars går det inte
// att logga in i samma flik på en telefon (se fbLogin). På den egna domänen
// används därför den; överallt annars Firebases egen adress.
const AUTH_HOST = location.hostname === 'snow.pettersson.app' ? 'snow.pettersson.app' : 'snoprognos.firebaseapp.com';
let fb = null;
const V = 'https://www.gstatic.com/firebasejs/10.12.2/';
try {
  const [app, auth, dbm] = await Promise.all([
    import(V + 'firebase-app.js'), import(V + 'firebase-auth.js'), import(V + 'firebase-database.js')]);
  // Nyckeln är offentlig av design och får stå här. Skyddet är reglerna.
  const a = app.initializeApp({
    apiKey: 'AIzaSyC0TZQEb2f3ihslleOBK9KfJFMCsI4DoQQ',
    authDomain: AUTH_HOST,
    databaseURL: 'https://snoprognos-default-rtdb.europe-west1.firebasedatabase.app',
    projectId: 'snoprognos',
    // Behövs för notiserna (Cloud Messaging). Projektets nummer.
    messagingSenderId: '726097160825',
    appId: '1:726097160825:web:ce47e8aeb011d958b082a8'
  });
  fb = { app: a, auth: auth.getAuth(a), db: dbm.getDatabase(a), authm: auth, dbm };
} catch (e) {
  gate('wait', 'Kunde inte nå inloggningen. Kontrollera nätet och ladda om sidan.', true);
}

const MOBILE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
// Appar som Messenger, Instagram och Facebook öppnar länkar i en egen
// inbyggd webbläsare. Google vägrar logga in där, och felet som visas säger
// inget om varför.
const INAPP = /FBAN|FBAV|FB_IAB|Instagram|Messenger|Line\/|; wv\)/i.test(navigator.userAgent);
let stopMember = null, stopMeta = null, stopHist = null, stopMembers = null, stopDamm = null, stopVatten = null, curRoll = 'Snögruppen';
let stopLarm = null, stopNotis = null;
function stopData() {
  if (stopLarm) { stopLarm(); stopLarm = null; }
  if (stopNotis) { stopNotis(); stopNotis = null; }
  if (stopVatten) { stopVatten(); stopVatten = null; }
  if (stopMeta) { stopMeta(); stopMeta = null; }
  if (stopHist) { stopHist(); stopHist = null; }
  if (stopDamm) { stopDamm(); stopDamm = null; }
  if (stopMembers) { stopMembers(); stopMembers = null; }
  if (window.setAdmin) window.setAdmin(false, '');
}
// Längre historik hämtas en gång, inte med en lyssnare: den ändras bara i
// änden, och änden täcks redan av dygnslyssnaren. Nycklarna är UTC
// yyyyMMddHHmm, så en startnyckel räcker för att bara få perioden.
window.loadHist = hours => {
  if (!fb) return Promise.reject(new Error('Inget Firebase'));
  const r = fb.dbm.ref(fb.db, 'hist');
  const start = new Date(Date.now() - hours * 3600e3).toISOString().replace(/\D/g, '').slice(0, 12);
  const q = hours ? fb.dbm.query(r, fb.dbm.orderByKey(), fb.dbm.startAt(start)) : r;
  return fb.dbm.get(q).then(s => s.val());
};
// Dammens avläsningar och kalibreringar (/damm). Reglerna släpper igenom en
// medlem som lägger till eller ändrar sitt eget, och en administratör.
// Ett nytt id kommer från push(), som också sorterar i tidsordning.
window.dammWrite = (lista, id, data) => {
  if (!fb || !fb.auth.currentUser) return Promise.reject(new Error('Inte inloggad'));
  const bas = fb.dbm.ref(fb.db, 'damm/' + lista);
  if (data === null) return fb.dbm.remove(fb.dbm.child(bas, id));
  return fb.dbm.set(id ? fb.dbm.child(bas, id) : fb.dbm.push(bas), data);
};
window.dammMe = () => {
  const u = fb && fb.auth.currentUser;
  return u ? { uid: u.uid, namn: String(u.displayName || u.email || '').slice(0, 80) } : null;
};
/* Notiser (pushlarm). Telefonens adress hos Firebase Cloud Messaging sparas
   under /notis/<uid>/<telefon>, och molnfunktionen skickar till alla som
   står där och fortfarande är medlemmar. "telefon" är ett slumpat id som
   sparas i telefonen, så att samma person kan ha larm på flera telefoner.

   Nyckeln är den offentliga halvan av projektets nyckel för webbnotiser
   (Firebase → Projektinställningar → Cloud Messaging → Web Push
   certificates). Den är offentlig av design och får stå här. Tom = larmen
   är inte påslagna, och appen säger det. */
window.notisNyckel = 'BFezUgRDC0UKkxRTljSfQk1vXRnyfBcVvkDgaX1mVk2SGRk_sk0X0jkvg1G2tJXaCNOEo-HsKEvPt_FeiNjTbD4';
let msgMod = null, msging = null;
async function messaging() {
  if (msging) return msging;
  msgMod = await import(V + 'firebase-messaging.js');
  if (!(await msgMod.isSupported())) return null;
  msging = msgMod.getMessaging(fb.app);
  return msging;
}
function telefonId() {
  let id = '';
  try { id = localStorage.getItem('snokollTelefon') || ''; } catch (e) { }
  if (!/^[a-z0-9]{8,40}$/.test(id)) {
    id = Array.from(crypto.getRandomValues(new Uint8Array(16)), b => (b % 36).toString(36)).join('');
    try { localStorage.setItem('snokollTelefon', id); } catch (e) { }
  }
  return id;
}
const notisRef = () => fb.dbm.ref(fb.db, 'notis/' + fb.auth.currentUser.uid + '/' + telefonId());
async function notisAdress() {
  const m = await messaging();
  if (!m) throw new Error('stod');
  const reg = await navigator.serviceWorker.ready;
  return msgMod.getToken(m, { vapidKey: window.notisNyckel, serviceWorkerRegistration: reg });
}
async function notisSpara() {
  const token = await notisAdress();
  const u = fb.auth.currentUser;
  await fb.dbm.set(notisRef(), { token, ts: Date.now(), namn: String(u.displayName || u.email || '').slice(0, 80), ua: navigator.userAgent.slice(0, 200) });
}
window.notisGor = async vad => {
  if (!fb || !fb.auth.currentUser) throw new Error('Inte inloggad');
  if (vad === 'pa') {
    // Frågan om lov måste komma direkt på trycket, annars visar iPhone den inte.
    const svar = await Notification.requestPermission();
    if (svar !== 'granted') throw new Error('nekad');
    await notisSpara();
  } else if (vad === 'av') {
    await fb.dbm.remove(notisRef());
    try { const m = await messaging(); if (m) await msgMod.deleteToken(m); } catch (e) { }
  } else if (vad === 'prov') {
    await fb.dbm.set(fb.dbm.child(notisRef(), 'prov'), Date.now());
  }
};
// Gemensam kvittering: reglerna släpper bara igenom den första, och bara
// med ens eget uid.
window.kvittera = id => {
  const u = fb && fb.auth.currentUser;
  if (!u) return Promise.reject(new Error('Inte inloggad'));
  return fb.dbm.set(fb.dbm.ref(fb.db, 'larmlage/aktiva/' + id + '/kvitt'),
    { uid: u.uid, namn: String(u.displayName || u.email || '').slice(0, 80), ts: Date.now() });
};
// Adressen kan bytas av webbläsaren. Var gång appen öppnas med larmen på
// hämtas den igen och sparas om den ändrats, och tiden visar att telefonen
// lever.
let notisKollad = false;
function notisFornya(v) {
  if (notisKollad || !v || !window.notisNyckel || !('Notification' in window) || Notification.permission !== 'granted') return;
  notisKollad = true;
  notisAdress().then(token => {
    if (token !== v.token || Date.now() - (v.ts || 0) > 7 * 864e5) return notisSpara();
  }).catch(() => { });
}

// Skrivningen prövas av databasens regler: bara en administratör kommer igenom.
window.memberWrite = (key, data) => {
  const r = fb.dbm.ref(fb.db, 'members/' + key);
  return data === null ? fb.dbm.remove(r) : fb.dbm.set(r, data);
};
function stopListening() {
  if (stopMember) { stopMember(); stopMember = null; }
  stopData();
}

window.fbLogin = async function () {
  if (!fb) return;
  msg('Öppnar Googles inloggning …');
  try {
    const prov = new fb.authm.GoogleAuthProvider();
    // Utan detta väljer Google tyst det konto som redan är inloggat, och den
    // som har flera konton hamnar på fel utan att få välja.
    prov.setCustomParameters({ prompt: 'select_account' });
    // På telefon går inloggningen i samma flik i stället för i ett eget
    // fönster. Ett fönster på en iPhone tappar ofta kopplingen till sidan
    // som öppnade det, och Firebase svarar då "Unable to process request due
    // to missing initial state" - det hände första gången någon loggade in
    // från en telefon, 16 november. Samma flik fungerar bara där appen ligger
    // på inloggningens egen adress, därför inte på localhost.
    if (MOBILE && location.hostname === AUTH_HOST) { await fb.authm.signInWithRedirect(fb.auth, prov); return; }
    await fb.authm.signInWithPopup(fb.auth, prov);
  } catch (e) {
    const c = e && e.code || '';
    if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') msg('');
    else if (c === 'auth/popup-blocked') msg('Webbläsaren stoppade inloggningsfönstret. Tillåt popup-fönster för sidan och försök igen.', true);
    else if (c === 'auth/unauthorized-domain') msg('Den här adressen är inte godkänd för inloggning i Firebase (Authentication → Settings → Authorized domains).', true);
    // Kommer när "Enable create (sign-up)" är avstängt i Firebase: då får inget
    // nytt konto skapas, och första inloggningen med Google ÄR att skapa ett.
    else if (c === 'auth/admin-restricted-operation') msg('Det här kontot har aldrig loggat in förut, och projektet tillåter just nu inga nya konton. Be en administratör slå på "Enable create (sign-up)" i Firebase.', true);
    else if (c === 'auth/network-request-failed') msg('Inget nät. Försök igen.', true);
    else msg('Inloggningen gick inte: ' + esc(c || e.message || e), true);
  }
};

window.logout = async function () {
  stopListening();
  if (window.clearApp) window.clearApp();
  if (fb) { try { await fb.authm.signOut(fb.auth); } catch (e) { } }
};

function initials(name) {
  const p = String(name).trim().split(/\s+/).filter(Boolean);
  return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
}

// Svaret från en inloggning i samma flik. Gick den snett ska det synas på
// inloggningssidan, inte försvinna.
let redirectErr = '';
if (fb) fb.authm.getRedirectResult(fb.auth).catch(e => {
  const c = e && e.code || '';
  redirectErr = c === 'auth/admin-restricted-operation'
    ? 'Det här kontot har aldrig loggat in förut, och projektet tillåter just nu inga nya konton.'
    : 'Inloggningen gick inte: ' + esc(c || e.message || e);
  if (!fb.auth.currentUser) msg(redirectErr, true);
});
const outHint = () => redirectErr || (INAPP
  ? 'Du har öppnat sidan inifrån en annan app. Google loggar inte in där — öppna <b>snoprognos.firebaseapp.com</b> i Safari eller Chrome i stället.'
  : '');

if (fb) fb.authm.onAuthStateChanged(fb.auth, user => {
  stopListening();
  if (!user) { gate('out', outHint(), !!(redirectErr || INAPP)); return; }
  gate('wait', 'Kontrollerar åtkomst …');
  const email = user.email || '';
  const noAccess = () => gate('noaccess',
    'Du är inloggad som <b>' + esc(email) + '</b> men har inte åtkomst.<br>Be en administratör i snögruppen lägga till dig.');
  // Samma omskrivning som i reglerna: gemener, och alla punkter till komma
  // (databasnycklar får inte innehålla punkt).
  const key = email.toLowerCase().split('.').join(',');
  let inne = false;
  // Lyssnar i stället för att läsa en gång: tas raden bort medan appen är
  // öppen ska den stängas direkt, inte vid nästa omladdning.
  stopMember = fb.dbm.onValue(fb.dbm.ref(fb.db, 'members/' + key), snap => {
    const m = snap.val();
    if (!m) { inne = false; stopData(); noAccess(); return; }
    const name = user.displayName || m.name || email;
    $('userName').textContent = name;
    $('userInit').textContent = initials(name);
    // Rollen kan ändras medan appen är öppen (någon gör en till administratör).
    const adm = m.role === 'admin';
    curRoll = adm ? 'Administratör' : 'Snögruppen';
    $('userSub').textContent = curRoll;
    window.setAdmin(adm, key);
    if (adm && !stopMembers) stopMembers = fb.dbm.onValue(fb.dbm.ref(fb.db, 'members'),
      s4 => window.applyMembers(s4.val()), () => window.applyMembers(null));
    if (!adm && stopMembers) { stopMembers(); stopMembers = null; }
    if (inne) return;
    inne = true;
    window.showApp();
    // Hela nuläget. Efter första hämtningen skickar databasen bara det som
    // ändrats, så det kostar lite att lyssna.
    stopMeta = fb.dbm.onValue(fb.dbm.ref(fb.db, 'live'), s2 => {
      const v = s2.val();
      $('userSub').textContent = curRoll + (v && v.meta && v.meta.ts
        ? ' · bryggan hördes ' + new Date(v.meta.ts).toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' })
        : ' · ingen driftdata än');
      window.applyLive(v);
    }, () => { $('userSub').textContent = 'Får inte läsa driftdatan'; });
    // Ett dygn kurvor: 288 punkter om fem minuter.
    stopHist = fb.dbm.onValue(fb.dbm.query(fb.dbm.ref(fb.db, 'hist'), fb.dbm.limitToLast(288)),
      s3 => window.applyHist(s3.val()), () => { });
    // Dammens avläsningar och kalibreringar: några rader i veckan, så hela
    // grenen går att lyssna på.
    stopDamm = fb.dbm.onValue(fb.dbm.ref(fb.db, 'damm'),
      s5 => window.applyDamm(s5.val()), () => window.applyDamm(null, true));
    // Kanonernas vatten per timme, för dammens uttag. Några hundra tal på en
    // säsong, så hela grenen.
    stopVatten = fb.dbm.onValue(fb.dbm.ref(fb.db, 'vattenTimme'),
      s6 => window.applyVattenTimme(s6.val()), () => window.applyVattenTimme(null, true));
    // Pushlarm som pågår, och om den här telefonen har larmen på.
    stopLarm = fb.dbm.onValue(fb.dbm.ref(fb.db, 'larmlage/aktiva'),
      s7 => window.applyLarmlage(s7.val()), () => window.applyLarmlage(null));
    notisKollad = false;
    stopNotis = fb.dbm.onValue(notisRef(),
      s8 => { window.applyNotis(s8.exists()); notisFornya(s8.val()); }, () => window.applyNotis(false));
  }, () => noAccess());   // nekad läsning = inte medlem (eller obekräftad adress)
});
</script>
