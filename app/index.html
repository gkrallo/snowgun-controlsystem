<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snökoll — driftövervakning</title>
<!--
  PROTOTYP med simulerad data. Ingen riktig uppkoppling mot styrsystem eller
  Firebase. Alla siffror är påhittade exempel (märkta där det är viktigt).
  Syfte: visa UX-förslag för övervakningsappen — välkomst, systemvy,
  vattenbalans, kanon-/lansvy, larm och körfönster.
  Chart.js hämtas från CDN. Allt annat ligger i den här filen, i samma anda
  som prognosappen (ingen bygg).
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --bg:#0a111e; --bg2:#0e1829; --panel:#13203360; --panel-solid:#132033;
  --panel-hi:#1a2a42; --border:#ffffff14; --border-hi:#ffffff26;
  --text:#e9f0fa; --muted:#8ba0bd; --muted2:#64789b;
  --ice:#38bdf8; --ice2:#22d3ee; --accent:#7dd3fc;
  --run:#34d399; --standby:#60a5fa; --limit:#fbbf24; --alarm:#f87171; --off:#5b6b82;
  --shadow:0 10px 30px -12px #000a, 0 2px 8px -4px #0008;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(1200px 600px at 80% -10%, #16304d55, transparent 60%),
    radial-gradient(900px 500px at -10% 10%, #0e2a3d55, transparent 55%),
    var(--bg);
  color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased;
  letter-spacing:.1px;
}
a{color:inherit}
.hidden{display:none!important}

/* ---------- Login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
.flakes{position:absolute;inset:0;pointer-events:none;opacity:.5}
.flake{position:absolute;top:-10px;color:#bfe4ff;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg)}}
.login-card{
  width:min(420px,100%);background:linear-gradient(180deg,#14233aee,#0e1829ee);
  border:1px solid var(--border-hi);border-radius:24px;padding:38px 30px;
  box-shadow:var(--shadow);backdrop-filter:blur(8px);text-align:center;position:relative;z-index:2
}
.logo{width:72px;height:72px;margin:0 auto 14px;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#1b3a5a,#0c1b2d);border:1px solid var(--border-hi);
  border-radius:20px;box-shadow:inset 0 1px 0 #ffffff22}
.login-card h1{margin:.1em 0 .1em;font-size:1.5rem;letter-spacing:.3px}
.login-card .sub{color:var(--muted);font-size:.92rem;margin-bottom:22px}
.btn{
  width:100%;border:0;border-radius:12px;padding:13px 16px;font-size:.98rem;font-weight:600;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
  transition:transform .12s ease, filter .12s ease
}
.btn:active{transform:translateY(1px)}
.btn-g{background:#fff;color:#1f2733}
.btn-g:hover{filter:brightness(.96)}
.login-card .tiny{color:var(--muted2);font-size:.76rem;margin-top:18px;line-height:1.5}
.pill{display:inline-flex;align-items:center;gap:6px;background:#0c1a2b;border:1px solid var(--border);
  color:var(--accent);border-radius:999px;padding:4px 11px;font-size:.74rem;margin-bottom:18px}

/* ---------- App shell ---------- */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
#sidebar{
  background:linear-gradient(180deg,#0e1829,#0b1320);border-right:1px solid var(--border);
  padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px;border-bottom:1px solid var(--border);margin-bottom:10px}
.brand .logo{width:38px;height:38px;border-radius:11px;margin:0}
.brand b{font-size:1.02rem;letter-spacing:.3px}
.brand small{display:block;color:var(--muted2);font-size:.68rem;font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;color:var(--muted);
  font-size:.93rem;font-weight:500;cursor:pointer;transition:background .15s,color .15s;position:relative}
.nav a:hover{background:#ffffff0a;color:var(--text)}
.nav a.active{background:linear-gradient(90deg,#1b3250,#16263d);color:#fff}
.nav a.active::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--ice)}
.nav a .badge{margin-left:auto;background:var(--alarm);color:#fff;font-size:.68rem;font-weight:700;
  min-width:19px;height:19px;border-radius:999px;display:grid;place-items:center;padding:0 5px}
.side-foot{border-top:1px solid var(--border);padding-top:12px;margin-top:8px;display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#2a4a6f,#1b3a5a);
  display:grid;place-items:center;font-weight:700;font-size:.82rem;color:#cfe9ff}
.side-foot small{color:var(--muted2);font-size:.7rem;display:block}

#main{padding:22px 26px 90px;max-width:1180px;width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.topbar h2{margin:0;font-size:1.32rem;letter-spacing:.2px}
.topbar .crumb{color:var(--muted2);font-size:.8rem;margin-bottom:3px}
.live{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:.8rem;
  background:#0d1a2b;border:1px solid var(--border);padding:7px 13px;border-radius:999px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--run);box-shadow:0 0 0 0 #34d39977;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #34d39966}70%{box-shadow:0 0 0 9px #34d39900}100%{box-shadow:0 0 0 0 #34d39900}}

/* ---------- cards / grid ---------- */
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(185px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g-units{grid-template-columns:repeat(auto-fit,minmax(255px,1fr))}
.card{background:linear-gradient(180deg,#14233a99,#101b2c99);border:1px solid var(--border);
  border-radius:var(--r);padding:17px 18px;box-shadow:var(--shadow);backdrop-filter:blur(4px)}
.card h3{margin:0 0 2px;font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;display:flex;align-items:center;gap:8px}
.kpi .val{font-size:1.9rem;font-weight:700;letter-spacing:.3px;margin-top:6px;line-height:1.05}
.kpi .val small{font-size:.9rem;color:var(--muted);font-weight:600}
.kpi .foot{color:var(--muted2);font-size:.76rem;margin-top:5px;display:flex;align-items:center;gap:6px}
.up{color:var(--run)} .down{color:var(--alarm)} .warn{color:var(--limit)}

/* bars */
.bar{height:9px;border-radius:999px;background:#0c1626;overflow:hidden;margin-top:9px;border:1px solid var(--border)}
.bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--ice),var(--ice2));transition:width .6s cubic-bezier(.2,.7,.2,1)}
.bar.amber > i{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.bar.red > i{background:linear-gradient(90deg,#ef4444,#f87171)}
.bar.green > i{background:linear-gradient(90deg,#10b981,#34d399)}

/* status chip */
.chip{display:inline-flex;align-items:center;gap:7px;font-size:.76rem;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--border)}
.chip .d{width:8px;height:8px;border-radius:50%}
.s-run{color:#8ff0c6;background:#0e2a20} .s-run .d{background:var(--run);animation:pulse 2s infinite}
.s-standby{color:#bcd4ff;background:#132544} .s-standby .d{background:var(--standby)}
.s-limit{color:#ffe0a3;background:#2b2410} .s-limit .d{background:var(--limit)}
.s-alarm{color:#ffc2c2;background:#2b1414} .s-alarm .d{background:var(--alarm);animation:pulse 1.2s infinite}
.s-off{color:#9fb0c7;background:#161f2e} .s-off .d{background:var(--off)}

/* unit card */
.unit{cursor:pointer;transition:transform .14s ease,border-color .14s ease;position:relative;overflow:hidden}
.unit:hover{transform:translateY(-3px);border-color:var(--border-hi)}
.unit .u-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.unit .u-name{font-weight:700;font-size:1.02rem;display:flex;align-items:center;gap:10px}
.unit .u-well{color:var(--muted2);font-size:.73rem;font-weight:500}
.metric-row{display:flex;justify-content:space-between;gap:12px;margin-top:10px}
.metric{flex:1}
.metric .m-l{color:var(--muted);font-size:.72rem}
.metric .m-v{font-weight:700;font-size:1.05rem;margin-top:1px}
.metric .m-v small{font-size:.72rem;color:var(--muted);font-weight:600}

/* fan spin */
.fan{transform-origin:50% 50%}
.spin{animation:spin 2.4s linear infinite}
.spin.fast{animation-duration:.9s}
@keyframes spin{to{transform:rotate(360deg)}}
.droplet{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(2.5px)}}

/* water flow view */
.flow-row{display:grid;grid-template-columns:150px 1fr 96px;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--border)}
.flow-row:last-child{border-bottom:0}
.flow-row .fname{display:flex;align-items:center;gap:9px;font-weight:600;font-size:.9rem}
.flow-track{height:18px;border-radius:7px;background:#0b1626;border:1px solid var(--border);overflow:hidden;position:relative}
.flow-fill{height:100%;border-radius:6px 0 0 6px;background:linear-gradient(90deg,#0ea5e9,#22d3ee);position:relative}
.flow-fill::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,#ffffff00 0 10px,#ffffff22 10px 14px);
  animation:stream 1s linear infinite}
@keyframes stream{to{background-position:28px 0}}
.flow-fill.amber{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.flow-val{text-align:right;font-weight:700;font-size:.9rem}
.flow-val small{color:var(--muted);font-weight:600;font-size:.72rem}

/* pump gauge */
.pumpwrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.gauge{--p:0;position:relative;width:150px;height:150px;border-radius:50%;flex:0 0 auto;
  background:conic-gradient(var(--gcol,var(--ice)) calc(var(--p)*1%), #10203400 0);
  display:grid;place-items:center;transition:--p .6s}
.gauge::before{content:"";position:absolute;inset:12px;border-radius:50%;background:#0d1a2b;border:1px solid var(--border)}
.gauge .gv{position:relative;text-align:center}
.gauge .gv b{font-size:1.7rem;display:block;line-height:1}
.gauge .gv span{font-size:.72rem;color:var(--muted)}
.pstat{flex:1;min-width:200px}
.pstat .big{font-size:1.05rem;font-weight:700;margin-bottom:4px}
.pstat p{margin:.3em 0;color:var(--muted);font-size:.86rem;line-height:1.5}

/* alarms */
.alarm-item{display:flex;gap:13px;align-items:flex-start;padding:13px 4px;border-bottom:1px solid var(--border)}
.alarm-item:last-child{border-bottom:0}
.alarm-ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto}
.a-crit{background:#2b1414;color:var(--alarm)} .a-warn{background:#2b2410;color:var(--limit)} .a-info{background:#132544;color:var(--standby)}
.alarm-item .a-body{flex:1}
.alarm-item .a-title{font-weight:600;font-size:.95rem}
.alarm-item .a-meta{color:var(--muted2);font-size:.76rem;margin-top:2px}
.alarm-item.ack{opacity:.5}
.banner{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#2b1414,#1c1420);
  border:1px solid #f8717144;border-radius:14px;padding:13px 16px;margin-bottom:18px}
.banner.ok{background:linear-gradient(90deg,#0e2a20,#101f2c);border-color:#34d39944}

/* forecast window */
.timeline{display:flex;gap:4px;margin-top:14px;height:40px;border-radius:9px;overflow:hidden;border:1px solid var(--border)}
.tseg{flex:1;display:flex;align-items:flex-end;justify-content:center;font-size:.6rem;color:#ffffffaa;padding-bottom:3px;position:relative}
.tseg.good{background:linear-gradient(180deg,#0e3a2a,#10533a)} .tseg.ok{background:linear-gradient(180deg,#1b3250,#24476f)}
.tseg.no{background:linear-gradient(180deg,#2a1a1a,#3a2020)}
.legend{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap;color:var(--muted);font-size:.78rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

canvas{max-width:100%}
.section-title{font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin:26px 2px 10px}

/* mobile bottom nav */
#botnav{display:none}
@media(max-width:860px){
  #app{grid-template-columns:1fr}
  #sidebar{display:none}
  #main{padding:16px 15px 86px}
  #botnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:#0c1626ee;border-top:1px solid var(--border);backdrop-filter:blur(10px);
    padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
  #botnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted2);
    font-size:.62rem;padding:5px 2px;cursor:pointer;position:relative}
  #botnav a.active{color:var(--ice)}
  #botnav a .badge{position:absolute;top:0;right:50%;margin-right:-22px;background:var(--alarm);color:#fff;
    font-size:.6rem;font-weight:700;min-width:15px;height:15px;border-radius:999px;display:grid;place-items:center;padding:0 3px}
  .topbar h2{font-size:1.15rem}
}
.view{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.muted{color:var(--muted)} .small{font-size:.82rem}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.linkbtn{background:#132544;border:1px solid var(--border);color:var(--accent);border-radius:9px;
  padding:7px 12px;font-size:.82rem;font-weight:600;cursor:pointer}
.note{background:#0c1a2b;border:1px dashed var(--border-hi);border-radius:12px;padding:11px 14px;color:var(--muted);font-size:.8rem;line-height:1.55}

/* ---------- karta (Leaflet) ---------- */
#opsmap{height:min(62vh,560px);width:100%;background:#0a111e}
.leaflet-container{background:#0a111e;font-family:inherit}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel-solid);color:var(--text);border:1px solid var(--border-hi);box-shadow:var(--shadow)}
.leaflet-popup-content{margin:9px 12px;font-size:.82rem;line-height:1.5}
.leaflet-popup-content b{color:#fff}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.leaflet-bar a{background:#132033;color:var(--text);border-bottom:1px solid var(--border)}
.leaflet-bar a:hover{background:var(--panel-hi)}
.leaflet-control-attribution{background:#0c1a2bcc!important;color:var(--muted2)!important}
.leaflet-control-attribution a{color:var(--accent)!important}
.umark{min-width:26px;height:26px;padding:0 5px;border-radius:999px;display:grid;place-items:center;
  border:2px solid #0a111e;box-shadow:0 2px 8px #0009;font-weight:800;font-size:.7rem;color:#06121f;white-space:nowrap}
.map-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
.map-legend .row{gap:7px}
.map-legend i{width:13px;height:13px;border-radius:50%;display:inline-block;flex:0 0 auto}

/* ---------- vattenrådgivare ---------- */
.strat{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:10px;margin-top:12px}
.strat button{text-align:left;background:#0e1c30;border:1px solid var(--border);border-radius:13px;
  padding:13px 14px;cursor:pointer;color:var(--text);transition:border-color .15s,background .15s}
.strat button:hover{border-color:var(--border-hi)}
.strat button.on{border-color:var(--ice);background:linear-gradient(180deg,#14304d,#102236)}
.strat button b{display:block;font-size:.92rem;margin-bottom:3px}
.strat button span{color:var(--muted);font-size:.75rem;line-height:1.45}
.daypills{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.daypills button{background:#0e1c30;border:1px solid var(--border);border-radius:999px;padding:6px 14px;
  cursor:pointer;color:var(--muted);font-weight:600;font-size:.82rem}
.daypills button.on{border-color:var(--ice);color:var(--text);background:#13304d}
.adv-row{display:grid;grid-template-columns:1fr 74px 22px 104px;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.adv-row:last-child{border-bottom:0}
.adv-cur{text-align:right;color:var(--muted);font-weight:600;font-size:.9rem}
.adv-cur small,.adv-sug small{font-size:.7rem;font-weight:600;color:var(--muted)}
.adv-arrow{text-align:center;color:var(--muted2)}
.adv-sug{text-align:right;font-weight:700;font-size:.95rem}
.adv-sug.up{color:var(--run)} .adv-sug.dn{color:var(--limit)} .adv-sug.off{color:var(--off)}

/* ---------- damm-koll (digital tvilling av magasinet) ---------- */
.dam-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-top:14px}
@media(max-width:820px){.dam-grid{grid-template-columns:1fr}}
.dam-svg{width:100%;height:auto;display:block;margin-top:4px}
.dam-ctrl label{display:block;color:var(--muted);font-size:.76rem;margin:12px 0 5px}
.dam-ctrl input[type=number],.dam-ctrl input[type=datetime-local]{width:100%;background:#0c1626;
  border:1px solid var(--border);color:var(--text);border-radius:9px;padding:9px 11px;font-size:.9rem}
.dam-ctrl input[type=datetime-local]{color-scheme:dark}
.dam-ctrl input:disabled{opacity:.45}
.dtrow{display:flex;gap:10px;margin-top:4px}
.dtrow>div{flex:1 1 0;min-width:0}
.dtrow label{margin-top:8px}
.dam-ctrl input[type=range]{width:100%;accent-color:var(--ice);margin-top:4px}
.seg{display:inline-flex;background:#0c1626;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--muted);padding:7px 13px;font-size:.82rem;font-weight:600;cursor:pointer}
.seg button.on{background:#13304d;color:var(--text)}
.readout{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px}
.readout div b{display:block;font-size:1.1rem;color:var(--text)}
.readout div span{color:var(--muted2);font-size:.7rem}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="login">
  <div class="flakes" id="flakes"></div>
  <div class="login-card">
    <div class="logo">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#7dd3fc" stroke-width="1.6" stroke-linecap="round">
        <path d="M12 2v20M12 2l3 3M12 2L9 5M12 22l3-3M12 22l-3-3"/>
        <path d="M2 12h20M2 12l3-3M2 12l3 3M22 12l-3-3M22 12l-3 3"/>
        <path d="M4.5 4.5l15 15M4.5 19.5l15-15" stroke-width="1.1" opacity=".6"/>
      </svg>
    </div>
    <div class="pill"><span class="dot"></span> snow.pettersson.app</div>
    <h1>Snökoll</h1>
    <div class="sub">Driftövervakning för snögruppen<br>Lidköpings Vintersportklubb</div>
    <button class="btn btn-g" onclick="login()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#4285F4" d="M45 24c0-1.6-.1-3.1-.4-4.6H24v9.3h11.8c-.5 2.7-2 5-4.3 6.6v5.5h7C42.6 37 45 31 45 24z"/><path fill="#34A853" d="M24 46c5.8 0 10.7-1.9 14.3-5.2l-7-5.5c-1.9 1.3-4.4 2.1-7.3 2.1-5.6 0-10.4-3.8-12.1-8.9H4.7v5.6C8.3 41.6 15.6 46 24 46z"/><path fill="#FBBC05" d="M11.9 28.5c-.4-1.3-.7-2.7-.7-4.5s.3-3.2.7-4.5v-5.6H4.7C3.6 16.6 3 20.2 3 24s.6 7.4 1.7 10.6l7.2-6.1z"/><path fill="#EA4335" d="M24 10.8c3.1 0 5.9 1.1 8.1 3.2l6.1-6.1C34.7 4.3 29.8 2 24 2 15.6 2 8.3 6.4 4.7 13.4l7.2 5.6C13.6 14.6 18.4 10.8 24 10.8z"/></svg>
      Logga in med Google
    </button>
    <div class="tiny">Endast inbjudna konton i snögruppen.<br>All data kräver inloggning — inget visas publikt.</div>
  </div>
</section>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <aside id="sidebar">

   bräddavlopp (+0 m) — ritningens egen siffra. Botten 26×34 m följer av krön
   minus slänt. Volymen räknas med den EXAKTA formeln för tvärsnittet (bredd och
   längd växer olika snabbt, så Geminis frustum-formel är en approximation —
   skillnaden är <1 m³, men den exakta är lika enkel):
        V(h) = 884·h + 90·h² + 3·h³     (h = vattendjup i m, 0..3,5)
   Snorkeln (+20 cm, 100 % = 3850 m³) och det 10 cm lägre hörnet är anläggningens
   verkliga tillägg, inte ritningens — därför ligger de som inställbara värden.
   ============================================================ */
const DAM={slope:1.5, hMax:3.50, lowDrop:0.10, crestArea:1624.25};
const SF=Math.sqrt(1+DAM.slope*DAM.slope);          // släntfaktor 1,80278
const volAt=h=>884*h+90*h*h+3*h*h*h;                // exakt, m³
const areaAt=h=>(26+3*h)*(34+3*h);                  // vattenytans area, m²
const V100=volAt(3.20);                             // ≈3850 m³ = nominell 100 %
function hFromVol(v){                               // invers via binärsökning
  if(v<=0)return 0; if(v>=volAt(DAM.hMax))return DAM.hMax;
  let lo=0,hi=DAM.hMax; for(let i=0;i<44;i++){const m=(lo+hi)/2; volAt(m)<v?lo=m:hi=m;} return (lo+hi)/2;
}
const tapeNormal=h=>(DAM.hMax-h)*SF*100;            // cm längs duk från normalt krön
const tapeLow=h=>((DAM.hMax-DAM.lowDrop)-h)*SF*100; // cm från låga hörnet (3,40 m)
const hFromTape=(cm,low)=>(low?DAM.hMax-DAM.lowDrop:DAM.hMax)-cm/(SF*100);

// nivåmarkörer (h i m, etikett, färg) — från botten och upp
const DAMLV=[
  [3.50,'Normalt krön','#fbbf24'],
  [3.40,'Låga hörnet bräddar','#f59e0b'],
  [3.25,'Varning · 15 cm marginal','#f87171'],
  [3.20,'Snorkel · 100 %','#38bdf8'],
  [3.00,'Ursprungligt bräddrör','#8ba0bd'],
];

/* tillstånd — simulerat i prototypen. Senaste kalibrering = "nu".
   Riktig app: V0/t0 i localStorage eller Firebase, uttaget från driftdatan. */
let dam={ V0:3743, t0:Date.now(), fill:false, fillStart:null, fillStop:null, fillRate:213, leak:2.0, floorH:0.5, calMode:'normal' };
let damTape=Math.round(tapeNormal(hFromVol(dam.V0)));  // måttbandsreglagets läge

/* flöden */
const L2M3H=3.6, L2M3D=86.4;                         // l/s → m³/h, m³/dygn
const damUttakM3h=()=>totalWater()*L2M3H;            // snökanonernas uttag
const damInflowM3d=()=>(dam.fill?dam.fillRate:0);    // påfyllningspump, m³/dygn (regn tillkommer)
const damNetM3h=()=>damInflowM3d()/24 - damUttakM3h() - dam.leak/24;
const floorVol=()=>volAt(dam.floorH);               // lägsta driftnivå (pumpintag)
const usableVol=v=>Math.max(0,v-floorVol());
function damPct(){return Math.round(dam.V0/V100*100);}
function damDaysAt(lps){const net=lps*L2M3D - damInflowM3d(); return net<=0?99:usableVol(dam.V0)/net;}

/* påfyllningens klockslag. Man glömmer ofta trycka igång när fyllningen startar
   och kommer på det först efter en stund — därför går både start och stopp att
   sätta i efterhand, så den faktiska pumptiden (och tillförd volym) blir rätt. */
const toLocalDT=ts=>{ if(!ts)return ''; const d=new Date(ts), p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
const fmtDT=ts=>{ if(!ts)return '–'; const d=new Date(ts), p=n=>String(n).padStart(2,'0');
  const wd=['sön','mån','tis','ons','tor','fre','lör'][d.getDay()];
  return `${wd} ${p(d.getDate())}/${d.getMonth()+1} ${p(d.getHours())}:${p(d.getMinutes())}`; };
function damFillSession(){ const start=dam.fillStart; if(!start)return null;
  const stop=dam.fill?Date.now():dam.fillStop; if(!stop||stop<=start)return null;
  const h=(stop-start)/3600e3; return {h, vol:h/24*dam.fillRate}; }

function fmtDur(h){ if(!isFinite(h)||h>24*30)return '30+ dygn'; if(h>=24)return (h/24).toFixed(1)+' dygn'; if(h>=1)return h.toFixed(1)+' h'; return Math.max(1,Math.round(h*60))+' min'; }
function etaStr(h){ if(!isFinite(h)||h>24*30||h<=0)return ''; const d=new Date(Date.now()+h*3600e3);
  const wd=['sön','mån','tis','ons','tor','fre','lör'][d.getDay()];
  return wd+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

function damSVG(h){
  const cx=150, topY=16, botY=176, Hpx=botY-topY;
  const yAt=hh=>botY-(hh/DAM.hMax)*Hpx, half=hh=>60+70*(hh/DAM.hMax);
  const lx=hh=>cx-half(hh), rx=hh=>cx+half(hh);
  const wy=yAt(h), wl=lx(h), wr=rx(h);
  // nivåerna 3,0–3,5 ligger alla i översta halvmetern, så markörlinjerna hamnar
  // tätt. Etiketterna sprids ut i egna rader med tunna ledarlinjer.
  const labelX=rx(DAM.hMax)+9;
  const mk=DAMLV.map(([mh,lab,col],i)=>{const y=yAt(mh), ly=topY+11+i*13;
    return `<line x1="${lx(mh).toFixed(1)}" y1="${y.toFixed(1)}" x2="${rx(mh).toFixed(1)}" y2="${y.toFixed(1)}" stroke="${col}" stroke-width="1" stroke-dasharray="3 3" opacity=".85"/>`+
      `<line x1="${rx(mh).toFixed(1)}" y1="${y.toFixed(1)}" x2="${(labelX-3).toFixed(1)}" y2="${ly.toFixed(1)}" stroke="${col}" stroke-width=".6" opacity=".45"/>`+
      `<text x="${labelX.toFixed(1)}" y="${(ly+3).toFixed(1)}" fill="${col}" font-size="8">${lab}</text>`;}).join('');
  return `<svg viewBox="0 0 440 196" class="dam-svg" preserveAspectRatio="xMinYMid meet">
    <defs><linearGradient id="dw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".8"/><stop offset="1" stop-color="#0e5a7a" stop-opacity=".95"/></linearGradient></defs>
    <polygon points="${lx(0).toFixed(1)},${botY} ${rx(0).toFixed(1)},${botY} ${wr.toFixed(1)},${wy.toFixed(1)} ${wl.toFixed(1)},${wy.toFixed(1)}" fill="url(#dw)"/>
    <line x1="${wl.toFixed(1)}" y1="${wy.toFixed(1)}" x2="${wr.toFixed(1)}" y2="${wy.toFixed(1)}" stroke="#7dd3fc" stroke-width="1.6"/>
    ${mk}
    <path d="M${lx(DAM.hMax).toFixed(1)},${topY} L${lx(0).toFixed(1)},${botY} L${rx(0).toFixed(1)},${botY} L${rx(DAM.hMax).toFixed(1)},${topY}" fill="none" stroke="#5b6b82" stroke-width="2"/>
    <circle cx="${wr.toFixed(1)}" cy="${wy.toFixed(1)}" r="3" fill="#7dd3fc"/>
    <text x="${cx}" y="${botY+14}" fill="#64789b" font-size="8" text-anchor="middle">Tvärsnitt — ej skalenligt på bredden</text>
  </svg>`;
}

function vDam(){
  const V=dam.V0, h=hFromVol(V), pct=damPct();
  const net=damNetM3h(), uttak=damUttakM3h();
  let proj, projEta='';
  if(net>0.01){const t=(V100-V)/net, tv=(volAt(3.25)-V)/net; proj=`Fyller ≈ ${fmtDur(t)} till snorkeln, ≈ ${fmtDur(tv)} till varningsnivå`; projEta=etaStr(t);}
  else if(net<-0.01){const t=usableVol(V)/(-net); proj=`Sjunker ≈ ${fmtDur(t)} till lägsta driftnivå`; projEta=etaStr(t);}
  else proj='I det närmaste i balans';
  const wh=hFromTape(damTape, dam.calMode==='low'), wv=volAt(Math.max(0,Math.min(DAM.hMax,wh)));
  return topbar('Vattenbalans','Damm-koll — magasinet vid Råda ås')+`<div class="view">
   <div class="banner ok">${icon('dam','#34d399',20)}<div style="flex:1"><b>Digital tvilling av dammen.</b> <span class="muted small">Geometrin är hämtad ur byggritningen. Uttaget kommer från driftdatan; påfyllning och kalibrering matar du in — appen räknar, den styr aldrig pumparna.</span></div></div>

   <div class="grid g-kpi">
     <div class="card kpi"><h3>${icon('drop','#7dd3fc',15)} Aktuell volym</h3><div class="val">${Math.round(V).toLocaleString('sv-SE')}<small> m³</small></div><div class="bar ${pct>101?'amber':pct<30?'red':'green'}"><i style="width:${Math.min(100,pct)}%"></i></div><div class="foot">${pct}% av snorkelnivån (${Math.round(V100).toLocaleString('sv-SE')} m³)</div></div>
     <div class="card kpi"><h3>${icon('sliders','#7dd3fc',15)} Nivå & måttband</h3><div class="val">${h.toFixed(2)}<small> m djup</small></div><div class="foot">${Math.round(tapeNormal(h))} cm längs duk · ${Math.round(tapeLow(h))} cm i låga hörnet</div></div>
     <div class="card kpi"><h3>${icon('gauge','#7dd3fc',15)} Nettoflöde nu</h3><div class="val ${net<0?'down':'up'}">${net>=0?'+':''}${net.toFixed(1)}<small> m³/h</small></div><div class="foot">${proj}${projEta?' · '+projEta:''}</div></div>
     <div class="card kpi"><h3>${icon('clock','#7dd3fc',15)} Drifttid vid nuvarande uttag</h3><div class="val">≈ ${fmtDur(damDaysAt(totalWater())*24)}</div><div class="foot">uttag ${uttak.toFixed(0)} m³/h (${totalWater()} l/s)${dam.fill?' · pump på':' · pump av'}</div></div>
   </div>

   <div class="dam-grid">
     <div class="card">
       <h3>${icon('dam','#7dd3fc',15)} Tvärsnitt — vattennivå och bräddnivåer</h3>
       ${damSVG(h)}
     </div>
     <div class="card dam-ctrl">
       <h3>${icon('sliders','#7dd3fc',15)} Måttband — snabbkoll</h3>
       <p class="muted small" style="margin:8px 0 2px">Dra måttbandet (0–631 cm längs duken) och se vilken volym det motsvarar.</p>
       <input type="range" min="0" max="631" value="${damTape}" oninput="damSlide(this.value)">
       <div class="readout">
         <div><b id="ro_cm">${Math.round(damTape)} cm</b><span>längs duk</span></div>
         <div><b id="ro_v">${Math.round(wv).toLocaleString('sv-SE')} m³</b><span>volym</span></div>
         <div><b id="ro_p">${Math.round(wv/V100*100)} %</b><span>av 100 %</span></div>
         <div><b id="ro_h">${Math.max(0,Math.min(DAM.hMax,wh)).toFixed(2)} m</b><span>djup</span></div>
       </div>
       <button class="linkbtn" style="margin-top:14px" onclick="damCalibFromTape()">Spara som ny kalibrering</button>
     </div>
   </div>

   <div class="dam-grid">
     <div class="card dam-ctrl">
       <h3>${icon('temp','#7dd3fc',15)} Kalibrera med måttband</h3>
       <p class="muted small" style="margin:8px 0 2px">Mät nivån fysiskt och synka modellen. Nollställer ackumulerad drift.</p>
       <label>Mätt vid</label>
       <div class="seg"><button class="${dam.calMode==='normal'?'on':''}" onclick="damMode('normal')">Normalt krön</button><button class="${dam.calMode==='low'?'on':''}" onclick="damMode('low')">Låga hörnet</button></div>
       <label>Mått längs duken (cm)</label>
       <input type="number" id="cal_cm" value="${Math.round(dam.calMode==='low'?tapeLow(h):tapeNormal(h))}" min="0" max="631">
       <button class="linkbtn" style="margin-top:14px" onclick="damCalib()">Spara kalibrering</button>
       <p class="muted small" style="margin-top:10px">Senaste kalibrering: ${etaStr(0)||'nu'} (${Math.round(dam.V0).toLocaleString('sv-SE')} m³).</p>
     </div>
     <div class="card dam-ctrl">
       <h3>${icon('drop','#7dd3fc',15)} Påfyllningspump & förluster</h3>
       <label>Påfyllningspump</label>
       <div class="seg"><button class="${!dam.fill?'on':''}" onclick="damFill(false)">Av</button><button class="${dam.fill?'on':''}" onclick="damFill(true)">Pumpar nu</button></div>
       <div class="dtrow">
         <div><label>Start</label><input type="datetime-local" id="fill_start" value="${toLocalDT(dam.fillStart)}" onchange="damFillTime('start',this.value)"></div>
         <div><label>Stopp</label><input type="datetime-local" id="fill_stop" value="${toLocalDT(dam.fillStop)}" ${dam.fill?'disabled':''} onchange="damFillTime('stop',this.value)"></div>
       </div>
       <p class="muted small" style="margin:8px 0 0">${(()=>{const s=damFillSession();
         if(dam.fill)return s?`Pumpar sedan ${fmtDT(dam.fillStart)} — ${fmtDur(s.h)}, ca ${Math.round(s.vol).toLocaleString('sv-SE')} m³ tillfört hittills.`:`Pumpar nu. Glömde du trycka igång? Sätt den riktiga starttiden ovan.`;
         return s?`Senaste pass: ${fmtDT(dam.fillStart)} → ${fmtDT(dam.fillStop)} — ${fmtDur(s.h)}, ca ${Math.round(s.vol).toLocaleString('sv-SE')} m³ tillfört.`:`Pumpen är av. Klockslagen går att rätta i efterhand om de blev fel.`;})()}</p>
       <label>Pumpkapacitet (m³/dygn)</label>
       <input type="number" id="dam_rate" value="${dam.fillRate}" onchange="damNum('fillRate',this.value)">
       <label>Läckage / avdunstning (m³/dygn)</label>
       <input type="number" id="dam_leak" value="${dam.leak}" step="0.5" onchange="damNum('leak',this.value)">
       <p class="muted small" style="margin-top:10px">Vid 213 m³/dygn (≈2,5 l/s) fyller pumpen långsamt — den är mest en påfyllnad mellan passen, inte i takt med snökanonernas uttag.</p>
     </div>
   </div>

   <div class="note" style="margin-top:14px">⚠️ <b>Verklighetskoll att stämma av:</b> dammen rymmer ≈ ${Math.round(V100).toLocaleString('sv-SE')} m³ användbart, men vid fullt uttag (45 l/s ≈ 3 900 m³/dygn) töms den på ungefär <b>ett dygn</b>, medan påfyllningspumpen bara ger 213 m³/dygn. Att "vattnet räcker några dygn" förutsätter alltså ett snitt­uttag på ≈ 15 l/s — det är sannolikt därför kanonerna stryps. Siffrorna (pumptak, lägsta driftnivå ${dam.floorH} m, läckage) är exempel tills vi vet de verkliga. Volymmodellen däremot är exakt och förankrad i ritningen.</div>
  </div>`;
}
function damSlide(cm){cm=+cm; const h=Math.max(0,Math.min(DAM.hMax,hFromTape(cm,dam.calMode==='low'))); const v=volAt(h); damTape=cm;
  const set=(id,t)=>{const e=document.getElementById(id);if(e)e.textContent=t;};
  set('ro_cm',Math.round(cm)+' cm'); set('ro_v',Math.round(v).toLocaleString('sv-SE')+' m³');
  set('ro_p',Math.round(v/V100*100)+' %'); set('ro_h',h.toFixed(2)+' m');}
function damCalibFromTape(){dam.V0=volAt(Math.max(0,Math.min(DAM.hMax,hFromTape(damTape,dam.calMode==='low'))));dam.t0=Date.now();invalidateDerived();render();}
function damMode(m){dam.calMode=m;render();}
function damCalib(){const cm=+document.getElementById('cal_cm').value; const h=Math.max(0,Math.min(DAM.hMax,hFromTape(cm,dam.calMode==='low'))); dam.V0=volAt(h); dam.t0=Date.now(); damTape=Math.round(tapeNormal(h)); invalidateDerived(); render();}
function damFill(b){ if(b && !dam.fill){dam.fillStart=Date.now(); dam.fillStop=null;}
  if(!b && dam.fill){dam.fillStop=Date.now();} dam.fill=b; render(); }
function damFillTime(which,v){ const ts=v?new Date(v).getTime():null;
  if(which==='start')dam.fillStart=ts; else dam.fillStop=ts; render(); }
function damNum(k,v){const n=parseFloat(v); if(!isNaN(n))dam[k]=n; render();}
function invalidateDerived(){/* platshållare: här uppdateras översikt/rådgivare som läser dammens volym */}

/* ============================================================
   VATTENRÅDGIVARE
   Räknar fram ett FÖRSLAG på fördelning — appen styr aldrig. Hård gräns:
   summan av vattenuttaget får inte överstiga pumpkapaciteten. Enheter med
   lägst våttemperatur prioriteras (bäst snö per liter). Tre strategier.
   ============================================================ */
let advGoal='cover', advDays=5;
const FTHRESH=-2.5;  // startgräns (våttemp °C) — prototyp, samma som prognosen
const round1=x=>Math.round(x*10)/10;

function advise(){
  const rows=cannons.map(c=>({id:c.id,namn:c.namn,typ:c.typ,brunn:c.brunn,tw:c.tw,fmax:c.fmax,cur:c.eau,sug:0}));
  const elig=rows.filter(u=>u.tw<=FTHRESH);        // får köra
  const cold=[...elig].sort((a,b)=>a.tw-b.tw);     // kallast först
  const sumF=elig.reduce((s,u)=>s+u.fmax,0);
  const usable=usableVol(dam.V0), inflowD=damInflowM3d();  // m³ i magasinet resp. m³/dygn in

  let budget = advGoal==='last'
    ? Math.min(sumF, PUMP_MAX, (usable/advDays + inflowD)/L2M3D)  // håll volymen i advDays dygn
    : Math.min(sumF, PUMP_MAX);                      // kör mot pumptaket

  if(advGoal==='cover'){
    // sprid tunt på alla behöriga så fler brunnar täcks
    const k = sumF<=budget ? 1 : budget/sumF;
    elig.forEach(u=>u.sug=round1(u.fmax*k));
  }else{
    // koncentrera på de kallaste tills budgeten är slut (fast / last)
    let rem=budget;
    cold.forEach(u=>{const g=Math.min(u.fmax,Math.max(0,rem));u.sug=g>0.4?round1(g):0;rem-=u.sug;});
  }

  const sugTot=round1(rows.reduce((s,u)=>s+u.sug,0));
  const runN=rows.filter(u=>u.sug>0).length;
  const cov=Math.min(2.3, runN*0.30);              // fler enheter → längre bana
  const lastDays= sugTot>0 ? damDaysAt(sugTot) : 99;  // ur dammens volym + påfyllning
  return {rows,sugTot,runN,cov,lastDays,pumpPct:Math.round(sugTot/PUMP_MAX*100)};
}

function vAdvisor(){
  const r=advise();
  const goals={
    cover:['Täck mer sträcka','Sprid vattnet tunt på fler enheter — längre bana, lägre produktion per kanon.'],
    fast: ['Producera fort','Full effekt på de bästa enheterna tills pumpen är full — mest snö per timme, kortare bana.'],
    last: ['Få vattnet att räcka','Kör färre, kallaste enheter så magasinet håller fler dygn.'],
  };
  return topbar('Vattenbalans','Vattenrådgivare')+`<div class="view">
   <div class="banner ok">${icon('bolt','#34d399')}<div style="flex:1"><b>Förslag — inte styrning.</b> <span class="muted small">Appen räknar fram en fördelning utifrån våttemperatur och pumptak. Du ställer in den i styrsystemet; appen rör aldrig anläggningen.</span></div></div>

   <div class="card">
     <h3>${icon('sliders','#7dd3fc',15)} Vad vill du prioritera?</h3>
     <div class="strat">
       ${Object.entries(goals).map(([k,[t,d]])=>`<button class="${advGoal===k?'on':''}" onclick="setAdv('${k}')"><b>${t}</b><span>${d}</span></button>`).join('')}
     </div>
     ${advGoal==='last'?`<div class="daypills">${[3,4,5,7].map(d=>`<button class="${advDays===d?'on':''}" onclick="setDays(${d})">${d} dygn</button>`).join('')}</div>`:''}
   </div>

   <div class="grid g-kpi" style="margin-top:14px">
     <div class="card kpi"><h3>${icon('drop','#7dd3fc',15)} Föreslaget uttag</h3><div class="val">${r.sugTot}<small> / ${PUMP_MAX} l/s</small></div><div class="bar ${r.pumpPct>95?'red':r.pumpPct>85?'amber':''}"><i style="width:${Math.min(100,r.pumpPct)}%"></i></div><div class="foot">${r.pumpPct}% av pumpkapaciteten</div></div>
     <div class="card kpi"><h3>${icon('fan','#7dd3fc',15)} Enheter i drift</h3><div class="val">${r.runN}<small> / ${cannons.length}</small></div><div class="foot">${cannons.length-r.runN} vilande i förslaget</div></div>
     <div class="card kpi"><h3>${icon('track','#7dd3fc',15)} Täckning</h3><div class="val">≈ ${r.cov.toFixed(1)}<small> km</small></div><div class="bar"><i style="width:${Math.round(r.cov/2.3*100)}%"></i></div><div class="foot">av 2,3 km</div></div>
     <div class="card kpi"><h3>${icon('clock','#7dd3fc',15)} Vattnet räcker</h3><div class="val">≈ ${r.lastDays>30?'30+':r.lastDays.toFixed(1)}<small> dygn</small></div><div class="foot">vid föreslaget uttag</div></div>
   </div>

   <div class="section-title">Förslag per enhet — nuläge → föreslaget</div>
   <div class="card">
     <div class="adv-row" style="border-bottom:2px solid var(--border-hi);color:var(--muted2);font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;padding:6px 0 9px">
       <div>Enhet · brunn · våttemp</div><div class="adv-cur">Nu</div><div></div><div class="adv-sug">Förslag</div>
     </div>
     ${r.rows.map(u=>{
        const off=u.sug<=0;
        const cls=off?'off':(u.sug>u.cur+0.15?'up':(u.sug<u.cur-0.15?'dn':''));
        const thr=!off&&u.fmax?Math.round((1-u.sug/u.fmax)*100):0;
        return `<div class="adv-row">
          <div class="fname">${u.typ==='kanon'?icon('fan','#7dd3fc',17):icon('lance','#7dd3fc',17)} ${u.namn}<span class="u-well"> · br ${u.brunn} · ${u.tw.toFixed(1)}°C</span></div>
          <div class="adv-cur">${u.cur.toFixed(1)}<small> l/s</small></div>
          <div class="adv-arrow">→</div>
          <div class="adv-sug ${cls}">${off?'Av':`${u.sug.toFixed(1)} <small>l/s</small>${thr>3?` · −${thr}%`:''}`}</div>
        </div>`}).join('')}
   </div>

   <div class="note" style="margin-top:14px">Logiken är en <b>skiss</b>: hård gräns = summan ≤ pumpkapacitet, och enheter med lägst våttemperatur prioriteras (bäst snö per liter). Vilka rattar som faktiskt går att läsa och ställa (flöde, dyssteg, luft) bekräftas när uppkopplingen finns — tills dess är siffrorna exempel. Våttemperaturen per plats är tänkt att komma från samma modell som prognosappen.</div>
  </div>`;
}
function setAdv(g){advGoal=g;render()}
function setDays(d){advDays=d;render()}

function vMap(){
  return topbar('Driftövervakning','Karta — enheter på spåret')+`<div class="view">
   <div class="card" style="padding:0;overflow:hidden"><div id="opsmap"></div></div>
   <div class="map-legend">
     ${Object.keys(UCOL).map(k=>`<span class="row"><i style="background:${UCOL[k]};border:1px solid #0a111e"></i><span class="muted small">${STATE[k][1]}</span></span>`).join('')}
     <span class="row"><i style="background:#0e2a3d;border:2px solid #22d3ee"></i><span class="muted small">Väderstation (br 7)</span></span>
     <span class="row"><i style="background:#1a2a42;border:1px solid #8ba0bd;width:9px;height:9px"></i><span class="muted small">Brunn</span></span>
   </div>
   <div class="note" style="margin-top:12px">Enheterna sitter vid sin brunn, färgade efter läge — tryck för detaljer. Spårlinjen och brunnarna är desamma som i prognosappen (brunn 1, 10, 13, 16 och 17 ligger där spåret delar sig och hamnar därför lite utanför den inspelade linjen). Kartan speglar styrsystemet — appen visar bara, styr aldrig.</div>
  </div>`;
}
let mapInst=null;
function initMap(){
  const el=document.getElementById('opsmap'); if(!el||!window.L) return;
  if(mapInst){try{mapInst.remove();}catch(e){} mapInst=null;}
  mapInst=L.map(el,{zoomControl:true,attributionControl:true,scrollWheelZoom:true});
  // Flygbild från Esri (förval i prognosappen); referrerPolicy satt om OSM används
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {maxZoom:19,attribution:'Flygbild © Esri'}).addTo(mapInst);
  const line=L.polyline(TRACK.pts,{color:'#38bdf8',weight:3,opacity:.9}).addTo(mapInst);
  const fit=()=>{if(mapInst){mapInst.invalidateSize();mapInst.fitBounds(line.getBounds().pad(0.12));}};
  fit();
  // containern kan sakna sin höjd när kartan skapas (vyn fejdas in) — passa in igen
  // när layouten satt sig, annars hamnar zoomen på världsnivå.
  setTimeout(fit,60);
  // brunnar som små punkter, väderstationen (br 7) markerad
  WELLS.forEach(w=>{
    const st=!!w.station;
    L.circleMarker([w.lat,w.lon],{radius:st?6:4,color:st?'#22d3ee':'#8ba0bd',weight:st?2:1,
      fillColor:st?'#0e2a3d':'#1a2a42',fillOpacity:.95})
     .addTo(mapInst).bindPopup(st?`<b>Brunn ${w.no}</b><br>Styrsystemets väderstation`:`Brunn ${w.no}${w.spare?' · reserv':''}`);
  });
  // enheter vid sina brunnar, färgade efter läge
  cannons.forEach(c=>{
    const w=WELLS.find(x=>x.no===c.brunn); if(!w) return;
    const ic=L.divIcon({className:'',html:`<div class="umark" style="background:${UCOL[c.state]}">${c.id}</div>`,
      iconSize:[28,26],iconAnchor:[14,13]});
    L.marker([w.lat,w.lon],{icon:ic}).addTo(mapInst)
     .bindPopup(`<b>${c.namn}</b> · ${STATE[c.state][1]}<br>Brunn ${c.brunn} · steg ${c.steg}<br>`+
       `Vatten ${c.eau.toFixed(1)} l/s · Våttemp ${c.tw.toFixed(1)} °C`);
  });
}

function vUnits(typ){
  const list=cannons.filter(c=>c.typ===typ);
  const t=typ==='kanon'?'Kanoner':'Lansar';
  return topbar('Enheter',t)+`<div class="view"><div class="grid g-units">${list.map(unitCard).join('')}</div>
   <div class="note" style="margin-top:16px">Tryck på en enhet för detaljer och trendkurvor. Lägen och steg speglar styrsystemets egen inkoppling — appen bara visar, styr aldrig.</div></div>`;
}

function vAlarms(){
  const order={crit:0,warn:1,info:2};
  const sorted=[...alarms].sort((a,b)=>(a.ack-b.ack)||order[a.sev]-order[b.sev]);
  const sevIco={crit:['a-crit','bell'],warn:['a-warn','bolt'],info:['a-info','clock']};
  return topbar('Driftövervakning','Larm',`<button class="linkbtn" onclick="ackAll()">Kvittera alla lokalt</button>`)+`<div class="view">
   <div class="grid g-kpi" style="margin-bottom:16px">
     <div class="card kpi"><h3>Kritiska</h3><div class="val down">${alarms.filter(a=>a.sev==='crit'&&!a.ack).length}</div></div>
     <div class="card kpi"><h3>Varningar</h3><div class="val warn">${alarms.filter(a=>a.sev==='warn'&&!a.ack).length}</div></div>
     <div class="card kpi"><h3>Info</h3><div class="val">${alarms.filter(a=>a.sev==='info'&&!a.ack).length}</div></div>
   </div>
   <div class="card">${sorted.map(a=>{const[c,i]=sevIco[a.sev];return `<div class="alarm-item ${a.ack?'ack':''}">
      <div class="alarm-ico ${c}">${icon(i,'currentColor',18)}</div>
      <div class="a-body"><div class="a-title">${a.title}</div><div class="a-meta">${a.meta}</div></div>
      ${a.ack?'<span class="chip s-off"><span class="d"></span>Kvitterad</span>':`<button class="linkbtn" onclick="ackOne(${a.id})">Kvittera</button>`}
    </div>`}).join('')}</div>
   <div class="note" style="margin-top:14px">Kvittering sker <b>lokalt i appen</b> (döljer larmet för den som tittar) — styrsystemet påverkas inte, eftersom appen bara läser. Faktisk återställning görs i anläggningen.</div>
  </div>`;
}

function vForecast(){
  return topbar('Prognos','Körfönster')+`<div class="view">
   <div class="card">
     <div class="row"><span class="chip s-run"><span class="d"></span>Går att köra nu</span><span class="muted small">Våttemp −6,3 °C · startgräns −2,5 °C</span></div>
     <p class="muted" style="line-height:1.6;margin-top:12px">Förhållandena är gynnsamma och håller i sig <b style="color:var(--text)">till ca 09:00 imorgon</b>. Under eftermiddagen stiger våttemperaturen över startgränsen. Nästa fönster öppnar natten mot torsdag.</p>
     ${timelineHTML()}
   </div>
   <div class="grid g-2" style="margin-top:14px">
     <div class="card"><h3>${icon('temp','#7dd3fc',15)} Våttemperatur — prognos 48 h</h3><canvas id="cFc" height="160"></canvas></div>
     <div class="card"><h3>${icon('drop','#7dd3fc',15)} Vattenmagasin — så länge räcker det</h3>
       <div class="val" style="font-size:1.7rem;font-weight:700;margin-top:6px">≈ ${fmtDur(damDaysAt(totalWater())*24)} <small class="muted" style="font-size:.85rem">vid nuvarande uttag</small></div>
       <div class="bar ${damPct()<30?'red':damPct()<50?'amber':'green'}" style="margin-top:10px"><i style="width:${Math.min(100,damPct())}%"></i></div>
       <p class="muted small" style="line-height:1.6;margin-top:12px">Snöproduktion pågår oftast bara några dygn, max en vecka, innan vattnet är slut. Grafen hjälper till att planera: kör hårt medan fönstret är öppet och magasinet räcker.</p>
       <div class="note" style="margin-top:10px">Kopplas ihop med prognosmaskinen i snowgun-forecast — samma våttemperatur­modell och startgräns.</div>
     </div>
   </div>
  </div>`;
}

function timelineHTML(){
  const segs=[['good','nu'],['good',''],['good','06'],['ok','09'],['ok',''],['no','14'],['no',''],['no','18'],['ok','22'],['good','02'],['good',''],['good','06']];
  return `<div class="timeline">${segs.map(([c,l])=>`<div class="tseg ${c}">${l}</div>`).join('')}</div>
    <div class="legend"><span><i style="background:#10533a"></i>Gynnsamt</span><span><i style="background:#24476f"></i>Marginellt</span><span><i style="background:#3a2020"></i>Över gräns</span></div>`;
}

/* ---------- unit detail (modal-ish, reuse main) ---------- */
let backTo='overview';
function openUnit(id){
  const c=cannons.find(x=>x.id===id); backTo=current;
  document.getElementById('main').innerHTML=topbar('Enhet / '+(c.typ==='kanon'?'Kanon':'Lans'),c.namn,
    `<button class="linkbtn" onclick="go('${backTo}')">← Tillbaka</button>`)+`<div class="view">
    <div class="grid g-kpi">
      <div class="card kpi"><h3>Status</h3><div style="margin-top:10px">${chip(c.state)}</div><div class="foot" style="margin-top:9px">Brunn ${c.brunn} · steg ${c.steg}</div></div>
      <div class="card kpi"><h3>Vattenflöde</h3><div class="val">${c.eau.toFixed(1)}<small> l/s</small></div>${c.stryp?`<div class="foot warn">Strypt ${c.stryp}%</div>`:'<div class="foot">Full</div>'}</div>
      <div class="card kpi"><h3>Luft</h3><div class="val">${c.air.toFixed(1)}<small> ${c.typ==='kanon'?'m³/min':'l/s'}</small></div></div>
      <div class="card kpi"><h3>Våttemp vid enheten</h3><div class="val">${c.tw.toFixed(1)}<small> °C</small></div></div>
    </div>
    <div class="card" style="margin-top:14px"><h3>${icon('drop','#7dd3fc',15)} Vattenflöde — senaste timmen</h3><canvas id="cUnit" height="150"></canvas></div>
    <div class="note" style="margin-top:14px">Trenden hjälper att se om en strypning håller eller om flödet vandrar — t.ex. när pumptrycket pressas av att fler enheter startar.</div>
  </div>`;
  drawUnitChart(c);
}

/* ============================================================
   CHARTS
   ============================================================ */
const CH_BASE={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
  scales:{x:{grid:{color:'#ffffff0c'},ticks:{color:'#64789b',maxRotation:0,font:{size:10}}},
          y:{grid:{color:'#ffffff0c'},ticks:{color:'#64789b',font:{size:10}}}}};
function mkGrad(ctx,c1,c2){const g=ctx.createLinearGradient(0,0,0,160);g.addColorStop(0,c1);g.addColorStop(1,c2);return g}
function line(id,labels,data,col,fill){
  const el=document.getElementById(id);if(!el)return;const ctx=el.getContext('2d');
  if(charts[id])charts[id].destroy();
  charts[id]=new Chart(ctx,{type:'line',data:{labels,datasets:[{data,borderColor:col,borderWidth:2,
    backgroundColor:fill?mkGrad(ctx,col+'44','#ffffff00'):'transparent',fill:!!fill,tension:.4,pointRadius:0,pointHoverRadius:4}]},options:CH_BASE});
}
function drawCharts(){
  if(current==='overview'){
    line('cTw',['−12h','−10','−8','−6','−4','−2','nu'],[-3.1,-3.8,-4.6,-5.2,-5.9,-6.1,-6.4],'#38bdf8',true);
  }
  if(current==='water'){
    const l=['−12h','−10','−8','−6','−4','−2','nu'];
    const el=document.getElementById('cWater');if(el){if(charts.cWater)charts.cWater.destroy();
      charts.cWater=new Chart(el.getContext('2d'),{type:'line',data:{labels:l,datasets:[
        {data:[28,33,39,42,44,43,totalWater()],label:'Uttag',borderColor:'#22d3ee',borderWidth:2,tension:.4,pointRadius:0,backgroundColor:mkGrad(el.getContext('2d'),'#22d3ee33','#ffffff00'),fill:true},
        {data:Array(7).fill(PUMP_MAX),label:'Kapacitet',borderColor:'#f8717199',borderWidth:1.5,borderDash:[5,4],tension:0,pointRadius:0}
      ]},options:CH_BASE});}
  }
  if(current==='forecast'){
    const lab=[];for(let h=0;h<=48;h+=4)lab.push(h+'h');
    const d=[-6.3,-6.6,-6.1,-5.2,-3.9,-2.1,-0.8,-1.9,-3.6,-5.4,-6.2,-6.5,-6.1];
    const el=document.getElementById('cFc');if(el){if(charts.cFc)charts.cFc.destroy();
      charts.cFc=new Chart(el.getContext('2d'),{type:'line',data:{labels:lab,datasets:[
        {data:d,borderColor:'#38bdf8',borderWidth:2,tension:.4,pointRadius:0,backgroundColor:mkGrad(el.getContext('2d'),'#38bdf833','#ffffff00'),fill:true},
        {data:Array(lab.length).fill(-2.5),borderColor:'#fbbf2499',borderWidth:1.5,borderDash:[5,4],pointRadius:0,tension:0}
      ]},options:CH_BASE});}
  }
}
function drawUnitChart(c){
  const base=c.eau||4;const d=Array.from({length:12},(_,i)=>+(base+Math.sin(i/2)*0.5+(Math.random()-.5)*0.3).toFixed(1));
  line('cUnit',['−60m','−50','−40','−30','−20','−10','nu'].concat([]),d.slice(0,7),'#22d3ee',true);
}

/* ============================================================
   RENDER + LIVE
   ============================================================ */
function render(){
  buildNav();
  const m=document.getElementById('main');
  if(current==='overview')m.innerHTML=vOverview();
  else if(current==='water')m.innerHTML=vWater();
  else if(current==='dam')m.innerHTML=vDam();
  else if(current==='advisor')m.innerHTML=vAdvisor();
  else if(current==='map')m.innerHTML=vMap();
  else if(current==='cannons')m.innerHTML=vUnits('kanon');
  else if(current==='lances')m.innerHTML=vUnits('lans');
  else if(current==='alarms')m.innerHTML=vAlarms();
  else if(current==='forecast')m.innerHTML=vForecast();
  requestAnimationFrame(()=>{drawCharts();if(current==='map')initMap();});
}
function ackOne(id){const a=alarms.find(x=>x.id===id);if(a)a.ack=true;render()}
function ackAll(){alarms.forEach(a=>a.ack=true);render()}

/* gentle live simulation */
setInterval(()=>{
  cannons.forEach(c=>{if(c.state==='off')return;
    c.eau=Math.max(0,+(c.eau+(Math.random()-.5)*0.25).toFixed(1));
    c.tw=+(c.tw+(Math.random()-.5)*0.08).toFixed(1);
  });
  // only cheap refresh when on data-heavy views
  if(['overview','water','cannons','lances'].includes(current)) render();
},5000);

/* ---------- login ---------- */
function login(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render()}
function logout(){document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}

(function(){const f=document.getElementById('flakes');let h='';for(let i=0;i<22;i++){const x=Math.random()*100,d=6+Math.random()*8,s=8+Math.random()*12,o=Math.random();h+=`<div class="flake" style="left:${x}%;animation-duration:${d}s;animation-delay:${-Math.random()*d}s;font-size:${s}px;opacity:${o}">❄</div>`}f.innerHTML=h})();
</script>
